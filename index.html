  <style>
    :root {
      --bg-app: hsl(40, 20%, 97%);
      --bg-sidebar: hsl(40, 18%, 94%);
      --bg-surface: hsl(0, 0%, 100%);
      --bg-surface-hover: hsl(40, 15%, 96%);
      --bg-surface-subtle: hsl(40, 16%, 95%);
      --bg-elevated: hsl(0, 0%, 100%);
      --bg-glass: hsla(40, 20%, 98%, 0.88);

      --text-primary: hsl(215, 28%, 14%);
      --text-secondary: hsl(215, 16%, 38%);
      --text-muted: hsl(215, 12%, 56%);
      --text-on-accent: hsl(0, 0%, 100%);

      --border-subtle: hsl(40, 14%, 89%);
      --border-default: hsl(215, 14%, 84%);
      --border-strong: hsl(215, 16%, 72%);

      --accent-primary: hsl(192, 78%, 31%);
      --accent-primary-hover: hsl(192, 82%, 25%);
      --accent-soft: hsl(192, 55%, 93%);
      --accent-soft-text: hsl(192, 85%, 24%);

      --danger-bg: hsl(4, 82%, 95%);
      --danger-text: hsl(4, 74%, 42%);
      --danger-border: hsl(4, 70%, 84%);
      --danger-dot: hsl(4, 76%, 52%);

      --warning-bg: hsl(36, 90%, 94%);
      --warning-text: hsl(32, 84%, 34%);
      --warning-border: hsl(36, 80%, 80%);
      --warning-dot: hsl(35, 90%, 48%);

      --safe-bg: hsl(152, 56%, 94%);
      --safe-text: hsl(154, 68%, 28%);
      --safe-border: hsl(152, 48%, 82%);
      --safe-dot: hsl(152, 64%, 40%);

      --neutral-badge-bg: hsl(215, 16%, 93%);
      --neutral-badge-text: hsl(215, 16%, 40%);

      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 2px 6px -1px rgba(15, 23, 42, 0.06), 0 1px 3px -1px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 20px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 18px 36px -6px rgba(15, 23, 42, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.06);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --radius-pill: 9999px;

      --sidebar-width: 244px;
      --transition-fast: 140ms cubic-bezier(0.22, 1, 0.36, 1);
      --transition-base: 220ms cubic-bezier(0.22, 1, 0.36, 1);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    }

    [data-theme="dark"] {
      --bg-app: hsl(210, 20%, 10%);
      --bg-sidebar: hsl(210, 22%, 8%);
      --bg-surface: hsl(210, 18%, 14%);
      --bg-surface-hover: hsl(210, 18%, 17%);
      --bg-surface-subtle: hsl(210, 19%, 12%);
      --bg-elevated: hsl(210, 18%, 16%);
      --bg-glass: hsla(210, 20%, 11%, 0.88);

      --text-primary: hsl(40, 15%, 94%);
      --text-secondary: hsl(210, 12%, 70%);
      --text-muted: hsl(210, 10%, 50%);
      --text-on-accent: hsl(210, 22%, 8%);

      --border-subtle: hsl(210, 16%, 19%);
      --border-default: hsl(210, 15%, 24%);
      --border-strong: hsl(210, 14%, 34%);

      --accent-primary: hsl(186, 68%, 50%);
      --accent-primary-hover: hsl(186, 74%, 58%);
      --accent-soft: hsla(186, 68%, 45%, 0.15);
      --accent-soft-text: hsl(186, 72%, 68%);

      --danger-bg: hsla(4, 76%, 54%, 0.15);
      --danger-text: hsl(4, 85%, 74%);
      --danger-border: hsla(4, 76%, 54%, 0.32);
      --danger-dot: hsl(4, 82%, 62%);

      --warning-bg: hsla(36, 88%, 52%, 0.15);
      --warning-text: hsl(38, 92%, 72%);
      --warning-border: hsla(36, 88%, 52%, 0.32);
      --warning-dot: hsl(36, 90%, 58%);

      --safe-bg: hsla(152, 60%, 45%, 0.15);
      --safe-text: hsl(152, 70%, 70%);
      --safe-border: hsla(152, 60%, 45%, 0.32);
      --safe-dot: hsl(152, 65%, 52%);

      --neutral-badge-bg: hsl(210, 16%, 20%);
      --neutral-badge-text: hsl(210, 14%, 74%);

      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.32);
      --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.42);
      --shadow-lg: 0 20px 44px rgba(0, 0, 0, 0.58);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font-sans);
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text-primary);
      background-color: var(--bg-app);
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--transition-base), color var(--transition-base);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

    .app-shell { display: grid; grid-template-columns: var(--sidebar-width) 1fr; min-height: 100vh; }
    .sidebar {
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.15rem 0.8rem;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 30;
    }
    .brand-header { display: flex; align-items: center; justify-content: space-between; padding: 0.2rem 0.5rem 1.15rem; }
    .brand-logo { display: flex; align-items: center; gap: 0.6rem; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: var(--radius-sm);
      background-color: var(--accent-primary); color: var(--text-on-accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem;
    }
    .brand-title { font-size: 0.92rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .brand-subtitle { font-size: 0.7rem; color: var(--text-muted); display: block; font-weight: 500; }

    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 0.2rem; }
    .nav-item {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 0.7rem; border-radius: var(--radius-md);
      color: var(--text-secondary); font-weight: 500; font-size: 0.86rem;
      transition: background-color var(--transition-fast), color var(--transition-fast);
      text-align: left;
    }
    .nav-item:hover { background-color: var(--bg-surface-hover); color: var(--text-primary); }
    .nav-item.active { background-color: var(--bg-surface); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-xs); }
    .nav-item-left { display: flex; align-items: center; gap: 0.55rem; }
    .nav-badge {
      font-size: 0.7rem; font-weight: 600; padding: 0.08rem 0.42rem;
      border-radius: var(--radius-pill); background-color: var(--neutral-badge-bg); color: var(--neutral-badge-text);
    }
    .nav-badge.alert { background-color: var(--danger-bg); color: var(--danger-text); }

    .sidebar-footer { border-top: 1px solid var(--border-subtle); padding-top: 0.75rem; display: flex; flex-direction: column; gap: 0.45rem; }
    .sidebar-section-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); padding: 0.6rem 0.65rem 0.2rem; }
    .subject-mini-list { display: flex; flex-direction: column; gap: 0.12rem; max-height: 200px; overflow-y: auto; }
    .subject-mini-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.35rem 0.65rem; border-radius: var(--radius-sm); font-size: 0.8rem; color: var(--text-secondary);
    }
    .subject-mini-item:hover { background-color: var(--bg-surface-hover); color: var(--text-primary); }
    .subject-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.45rem; flex-shrink: 0; }

    .main-area { display: flex; flex-direction: column; min-width: 0; padding-bottom: 4.5rem; }
    .top-capture-sticky {
      position: sticky; top: 0; z-index: 25;
      background-color: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle); padding: 0.75rem 1.25rem;
    }
    .capture-container { max-width: 960px; margin: 0 auto; }
    .capture-box {
      background-color: var(--bg-surface); border: 1.5px solid var(--border-default);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      padding: 0.42rem 0.55rem 0.42rem 0.85rem; display: flex; align-items: center; gap: 0.55rem;
    }
    .capture-box:focus-within { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-sm); }
    .capture-input { flex: 1; border: none; background: transparent; font-size: 0.92rem; color: var(--text-primary); outline: none; min-width: 0; }
    .capture-input::placeholder { color: var(--text-muted); }
    .capture-submit-btn {
      background-color: var(--accent-primary); color: var(--text-on-accent);
      font-weight: 600; font-size: 0.82rem; padding: 0.42rem 0.85rem; border-radius: var(--radius-md);
      display: inline-flex; align-items: center; gap: 0.3rem; flex-shrink: 0;
    }
    .capture-submit-btn:hover { background-color: var(--accent-primary-hover); }

    .capture-preview { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; padding-top: 0.5rem; font-size: 0.76rem; }
    .capture-preview.hidden { display: none; }
    .preview-chip {
      display: inline-flex; align-items: center; gap: 0.28rem; padding: 0.16rem 0.55rem;
      border-radius: var(--radius-pill); background-color: var(--bg-surface);
      border: 1px solid var(--border-default); color: var(--text-secondary); font-weight: 500;
    }
    .preview-chip.matched { background-color: var(--accent-soft); border-color: transparent; color: var(--accent-soft-text); font-weight: 600; }
    .preview-chip.warning { background-color: var(--warning-bg); border-color: var(--warning-border); color: var(--warning-text); }

    .quick-examples-row { display: flex; align-items: center; gap: 0.35rem; margin-top: 0.4rem; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .quick-examples-row::-webkit-scrollbar { display: none; }
    .quick-example-label { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
    .example-pill {
      font-size: 0.72rem; color: var(--text-secondary); background-color: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle); padding: 0.14rem 0.5rem; border-radius: var(--radius-pill); white-space: nowrap;
    }
    .example-pill:hover { background-color: var(--bg-surface); border-color: var(--border-default); color: var(--text-primary); }

    .page-container { max-width: 960px; width: 100%; margin: 0 auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1.35rem; }
    .status-banner {
      background-color: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: 1rem 1.2rem; box-shadow: var(--shadow-xs);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .date-greeting h1 { font-size: 1.18rem; font-weight: 700; color: var(--text-primary); }
    .date-greeting p { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.1rem; }

    .condition-selector-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .condition-label { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); }
    .condition-segmented {
      display: inline-flex; background-color: var(--bg-surface-subtle);
      padding: 0.18rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);
    }
    .condition-btn {
      padding: 0.3rem 0.65rem; border-radius: var(--radius-sm); font-size: 0.78rem;
      font-weight: 500; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .condition-btn.active { background-color: var(--bg-surface); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-xs); }

    .workload-meter-box { min-width: 210px; flex: 1; max-width: 280px; }
    .workload-header { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.78rem; margin-bottom: 0.3rem; }
    .workload-title { color: var(--text-secondary); font-weight: 500; }
    .workload-numbers { font-weight: 600; color: var(--text-primary); }
    .progress-track { height: 7px; background-color: var(--bg-surface-subtle); border-radius: var(--radius-pill); overflow: hidden; display: flex; border: 1px solid var(--border-subtle); }
    .progress-fill-done { background-color: var(--safe-dot); height: 100%; transition: width var(--transition-base); }
    .progress-fill-planned { background-color: var(--accent-primary); height: 100%; transition: width var(--transition-base); }
    .progress-fill-overload { background-color: var(--danger-dot); height: 100%; transition: width var(--transition-base); }

    /* ==========================================================================

    const STORAGE_KEY = 'smart_study_os_v2_state';
    const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

    function toDateStr(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDays(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      return toDateStr(dt);
    }

    function diffDays(fromDateStr, toDateStr) {
      if (!fromDateStr || !toDateStr) return null;
      const [fy, fm, fd] = fromDateStr.split('-').map(Number);
      const [ty, tm, td] = toDateStr.split('-').map(Number);
      const f = new Date(fy, fm - 1, fd);
      const t = new Date(ty, tm - 1, td);
      return Math.round((t - f) / (1000 * 60 * 60 * 24));
    }

    function formatJpDate(dateStr, todayStr = toDateStr()) {
      if (!dateStr) return '期限未設定';
      const diff = diffDays(todayStr, dateStr);

      if (diff === 1) return `明日 (${m}/${d} ${w})`;
      if (diff === -1) return `昨日 (${m}/${d} ${w})`;

    function computeLearnedEstimate(templateStep, actualMinutes) {
      const current = templateStep.estimatedMinutes || 30;
      const n = templateStep.sampleCount || 0;
      let actual = Math.min(600, Math.max(1, Number(actualMinutes) || current));
      if (n > 0) {
        actual = Math.min(current * 3, Math.max(current / 3, actual));
      }
      const alpha = n === 0 ? 1 : Math.max(0.3, 1 / (n + 1));
      return roundTo5(alpha * actual + (1 - alpha) * current);
    }

    function getAverageError(templateStep) {
      const history = templateStep.history || [];
      if (history.length === 0) return null;
      const recent = history.slice(-3);
      const total = recent.reduce((acc, h) => acc + Math.abs(h.actual - h.estimated), 0);
      return Math.round(total / recent.length);
    }

    function findTemplateStepForStep(st, step) {
      if (!step || typeof step.templateIndex !== 'number') return null;
      const task = st.tasks.find(t => t.id === step.taskId);
      if (!task || !task.recurringRuleId) return null;
      const rule = (st.recurringRules || []).find(r => r.id === task.recurringRuleId);
      if (!rule) return null;
      const templateStep = rule.stepsTemplate[step.templateIndex];
      if (!templateStep) return null;
      return { rule, templateStep, task };
    }

    function previewLearning(st, step, actualMinutes) {
      const found = findTemplateStepForStep(st, step);
      if (!found) return null;
      return {
        ruleTitle: found.rule.title,
        current: found.templateStep.estimatedMinutes,
        next: computeLearnedEstimate(found.templateStep, actualMinutes),
        sampleCount: found.templateStep.sampleCount || 0
      };
    }

    function applyActualToRecurringRule(st, step, actualMinutes, todayStr) {
      const found = findTemplateStepForStep(st, step);
      if (!found) return null;
      const { rule, templateStep } = found;
      const oldEstimate = templateStep.estimatedMinutes || 30;
      const nextEstimate = computeLearnedEstimate(templateStep, actualMinutes);

      templateStep.history = [
        ...(templateStep.history || []),
        { date: todayStr, estimated: step.estimatedMinutes || oldEstimate, actual: Number(actualMinutes) || oldEstimate }
      ].slice(-8);
      templateStep.sampleCount = (templateStep.sampleCount || 0) + 1;
      templateStep.estimatedMinutes = nextEstimate;

      const otherTaskIds = new Set(st.tasks.filter(t => t.recurringRuleId === rule.id && t.id !== step.taskId).map(t => t.id));
      for (const s of st.taskSteps) {
        if (otherTaskIds.has(s.taskId) && !s.isCompleted && s.templateIndex === step.templateIndex && s.estimatedMinutes === oldEstimate) {
          s.estimatedMinutes = nextEstimate;
        }
      }
      for (const taskId of otherTaskIds) {
        const t = st.tasks.find(x => x.id === taskId);
        if (t) {
          t.estimatedMinutes = st.taskSteps.filter(s => s.taskId === taskId).reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0);
        }
      }
      return { ruleTitle: rule.title, oldEstimate, nextEstimate, sampleCount: templateStep.sampleCount };
    }

    const WEEKDAY_MAP = { '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };

    function parseNaturalInput(rawText, subjects = [], todayStr = toDateStr(), defaultMinutes = 30) {
      const text = (rawText || '').trim();
      if (!text) return null;

      const [ty, tm, td] = todayStr.split('-').map(Number);
      const todayObj = new Date(ty, tm - 1, td);
      const currentDow = todayObj.getDay();

      let matchedSubject = null;
      for (const sub of subjects) {
        const candidates = [sub.name, ...(sub.aliases || [])].filter(Boolean).sort((a, b) => b.length - a.length);
        if (candidates.some(alias => text.includes(alias))) {
          matchedSubject = sub;
          break;
        }
      }

      let category = 'assignment';
      if (/レポート|レポ|報告書|論文/.test(text)) category = 'report';
      else if (/小テスト|クイズ|単語テスト|ミニテスト/.test(text)) category = 'quiz';
      else if (/定期試験|期末試験|中間試験|期末テスト|中間テスト|本試験|試験/.test(text)) category = 'exam';
      else if (/問題|演習|課題|宿題|プリント|提出/.test(text)) category = 'assignment';
      else if (/勉強|復習|予習|整理|まとめ|暗記|読書|読む|リスニング/.test(text)) category = 'self_study';

      let deadlineDate = null;
      let matchedDateToken = '';
      let recurrence = null;

      const weeklyMatch = text.match(/毎週(?:の)?(?:([日月火水木金土])曜(?:日)?)?(?:まで(?:に)?|に|の)?/);
      if (weeklyMatch) {
        let weekday;
        if (weeklyMatch[1]) weekday = WEEKDAY_MAP[weeklyMatch[1]];
        else if (matchedSubject && typeof matchedSubject.defaultWeekday === 'number') weekday = matchedSubject.defaultWeekday;
        else weekday = currentDow;
        let delta = weekday - currentDow;
        if (delta <= 0) delta += 7;
        deadlineDate = addDays(todayStr, delta);
        matchedDateToken = weeklyMatch[0];
        recurrence = { frequency: 'weekly', weekday };
      }

      const mdMatch = text.match(/(\d{1,2})\s*(?:月|\/)\s*(\d{1,2})\s*日?(?:まで(?:に)?|に)?/);
      if (!deadlineDate && mdMatch) {
        const m = parseInt(mdMatch[1], 10);
        const d = parseInt(mdMatch[2], 10);
        if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
          deadlineDate = toDateStr(new Date(ty, m - 1, d));
          matchedDateToken = mdMatch[0];
        }
      }

      if (!deadlineDate) {
        const relDaysMatch = text.match(/(\d+)\s*日後(?:まで(?:に)?|に)?/);
        if (relDaysMatch) {
          deadlineDate = addDays(todayStr, parseInt(relDaysMatch[1], 10));
          matchedDateToken = relDaysMatch[0];
        } else if (/今日|本日|きょう/.test(text)) {
          deadlineDate = todayStr;
          const m = text.match(/(?:今日|本日|きょう)(?:の|中|まで(?:に)?|に)?/);
          if (m) matchedDateToken = m[0];
        } else if (/明後日|あさって/.test(text)) {
          deadlineDate = addDays(todayStr, 2);
          const m = text.match(/(?:明後日|あさって)(?:の|まで(?:に)?|に)?/);
          if (m) matchedDateToken = m[0];
        } else if (/明日|あした/.test(text)) {
          deadlineDate = addDays(todayStr, 1);
          const m = text.match(/(?:明日|あした)(?:の|まで(?:に)?|に)?/);
          if (m) matchedDateToken = m[0];
        }
      }

      if (!deadlineDate) {
        const dowMatch = text.match(/(再来週|来週|今週)?(?:の)?([日月火水木金土])曜(?:日)?(?:まで(?:に)?|に|の)?/);
        if (dowMatch) {
          const prefix = dowMatch[1] || '';
          const targetDow = WEEKDAY_MAP[dowMatch[2]];
          let delta = targetDow - currentDow;
          if (prefix === '来週') {
            const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
            const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
            delta = daysToNextMonday + offsetFromMonday;
          } else if (prefix === '再来週') {
            const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
            const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
            delta = daysToNextMonday + 7 + offsetFromMonday;
          } else if (delta <= 0) {
            delta += 7;
          }
          deadlineDate = addDays(todayStr, delta);
          matchedDateToken = dowMatch[0];
        }
      }

      if (!deadlineDate && /来週/.test(text) && matchedSubject && typeof matchedSubject.defaultWeekday === 'number') {
        const targetDow = matchedSubject.defaultWeekday;
        const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
        const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
        deadlineDate = addDays(todayStr, daysToNextMonday + offsetFromMonday);
        matchedDateToken = '来週';
      }

      let explicitMinutes = null;
      let matchedDurationToken = '';
      const halfHourMatch = text.match(/(\d+)\s*時間半/);
      const hourMinMatch = text.match(/(\d+(?:\.\d+)?)\s*時間(?:\s*(\d+)\s*分)?/);
      const minMatch = text.match(/(\d+)\s*(?:分|分間|m|min)(?:間|だけ|勉強する|やる)?/i);

      if (halfHourMatch) {
        explicitMinutes = parseInt(halfHourMatch[1], 10) * 60 + 30;
        matchedDurationToken = halfHourMatch[0];
      } else if (hourMinMatch) {
        explicitMinutes = Math.round(parseFloat(hourMinMatch[1]) * 60) + (hourMinMatch[2] ? parseInt(hourMinMatch[2], 10) : 0);
        matchedDurationToken = hourMinMatch[0];
      } else if (minMatch) {
        explicitMinutes = parseInt(minMatch[1], 10);
        matchedDurationToken = minMatch[0];
      }

      const probMatch = text.match(/(\d+)\s*問/);
      const problemCount = probMatch ? parseInt(probMatch[1], 10) : null;

      let suggestedSteps = [];
      let shouldDecompose = false;

      if (category === 'report') {
        shouldDecompose = true;
        suggestedSteps = DECOMPOSITION_TEMPLATES.report.map(s => ({ ...s }));
      } else if (category === 'exam') {
        shouldDecompose = true;
        suggestedSteps = DECOMPOSITION_TEMPLATES.exam.map(s => ({ ...s }));
      } else if (category === 'quiz' && (!explicitMinutes || explicitMinutes >= 45)) {
        shouldDecompose = true;
        suggestedSteps = DECOMPOSITION_TEMPLATES.quiz.map(s => ({ ...s }));
      } else if (/実験結果.*整理/.test(text) && (!explicitMinutes || explicitMinutes >= 40)) {
        shouldDecompose = true;
        suggestedSteps = DECOMPOSITION_TEMPLATES.experiment_org.map(s => ({ ...s }));
      } else if (problemCount && problemCount >= 3 && (!explicitMinutes || explicitMinutes >= 45)) {
        shouldDecompose = true;
        const firstBatch = Math.ceil(problemCount / 2);
        const secondBatch = problemCount - firstBatch;
        suggestedSteps = [
          { title: `問題 1〜${firstBatch} を解く`, minutes: firstBatch * 15 },
          { title: `問題 ${firstBatch + 1}〜${problemCount} を解く＆解答確認`, minutes: secondBatch * 15 }
        ];
      }

      if (explicitMinutes && explicitMinutes <= 35 && category !== 'report') {
        shouldDecompose = false;
        suggestedSteps = [];
      }

      let estimatedMinutes = explicitMinutes;
      let isDefaultDuration = false;
      if (!estimatedMinutes) {
        if (shouldDecompose && suggestedSteps.length > 0) {
          estimatedMinutes = suggestedSteps.reduce((acc, s) => acc + s.minutes, 0);
        } else if (problemCount) {
          estimatedMinutes = Math.max(15, Math.min(120, problemCount * 15));
        } else {
          estimatedMinutes = defaultMinutes || 30;
          isDefaultDuration = true;
        }
      }

      let cleanTitle = text;
      if (matchedDateToken && !/今日/.test(matchedDateToken)) {
        cleanTitle = cleanTitle.replace(matchedDateToken, '').trim();
      }
      if (matchedDurationToken) {
        cleanTitle = cleanTitle
          .replace(/を?\s*\d+(?:\.\d+)?\s*(?:時間半|時間|分|分間)\s*(?:勉強する|やる|行う)$/, 'を勉強する')
          .replace(/\s+\d+\s*(?:分|時間)$/, '')
          .trim();
      }
      cleanTitle = cleanTitle.replace(/^[、,・\s]+/, '').trim() || text;

      return {
        rawInput: text,
        cleanTitle,
        subjectId: matchedSubject ? matchedSubject.id : null,
        subjectName: matchedSubject ? matchedSubject.name : null,
        subjectColor: matchedSubject ? matchedSubject.color : null,
        category,
        categoryLabel: CATEGORY_META[category].label,
        categoryIcon: CATEGORY_META[category].icon,
        importance: CATEGORY_META[category].defaultImportance,
        deadlineDate,
        deadlineLabel: deadlineDate ? formatJpDate(deadlineDate, todayStr) : '未設定',
        estimatedMinutes,
        isDefaultDuration,
        shouldDecompose,
        suggestedSteps,
        recurrence
      };
    }

    /* ==========================================================================
       4. Auto-Scheduler, Risk Evaluator & Replanning Engine
       ========================================================================== */
    const CONDITION_META = {
      energetic: { label: '元気', icon: '🔥', multiplier: 1.2, desc: '通常より+20%の作業枠。重めの課題や先取りに最適' },
      normal: { label: '普通', icon: '🙂', multiplier: 1.0, desc: '標準ペース。計画通りに無理なく進めるモード' },
      tired: { label: '疲れている', icon: '😴', multiplier: 0.6, desc: '作業枠を60%に圧縮。必須課題と短時間タスクのみに厳選' }
    };

    const RISK_META = {
      danger: { label: '危険', icon: '🔴', className: 'danger', weight: 300 },
      warning: { label: '注意', icon: '🟡', className: 'warning', weight: 200 },
      safe: { label: '余裕', icon: '🟢', className: 'safe', weight: 100 },
      none: { label: '期限なし', icon: '⚪', className: 'none', weight: 30 }
    };

    function getDayEffectiveCapacity(dateStr, st) {
      const dow = weekdayOf(dateStr);
      const baseCap = (st.userSettings?.weekdayCapacity?.[dow]) ?? 90;
      const dayState = st.dailyStates?.[dateStr];
      const rawCap = (dayState && typeof dayState.customAvailableMinutes === 'number') ? dayState.customAvailableMinutes : baseCap;
      const condition = dayState?.condition || 'normal';
      const mult = CONDITION_META[condition]?.multiplier ?? 1.0;
      return Math.max(15, Math.round((rawCap * mult) / 5) * 5);
    }

    function getDayScheduledMinutes(dateStr, st) {
      let total = 0;
      for (const step of st.taskSteps) {
        if (step.scheduledDate === dateStr) total += (step.estimatedMinutes || 30);
      }
      return total;
    }

    function evaluateTaskRisk(task, st, todayStr = toDateStr()) {
      const steps = st.taskSteps.filter(s => s.taskId === task.id);
      const uncompletedSteps = steps.filter(s => !s.isCompleted);
      const remainingMinutes = uncompletedSteps.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0);
      const totalMinutes = steps.length > 0 ? steps.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0) : (task.estimatedMinutes || 30);
      const progressPercent = totalMinutes > 0 ? Math.round(((totalMinutes - remainingMinutes) / totalMinutes) * 100) : 0;

      if (task.status === 'completed' || (steps.length > 0 && uncompletedSteps.length === 0)) {
        return { level: 'safe', label: '完了済', reason: '完了済', remainingMinutes: 0, totalMinutes, progressPercent: 100, daysLeft: null, score: 0 };
      }

      const hasOverdueStep = uncompletedSteps.some(s => s.scheduledDate && diffDays(todayStr, s.scheduledDate) < 0);
      if (!task.deadlineDate) {
        return {
          level: 'none', label: '期限なし',
          reason: `残作業 ${remainingMinutes}分（空き時間に実行可能）`,
          remainingMinutes, totalMinutes, progressPercent, daysLeft: null,
          score: 40 + (task.importance || 1) * 15
        };
      }

      const daysLeft = diffDays(todayStr, task.deadlineDate);
      let cumulativeCapacity = 0;
      const spanDays = Math.max(0, Math.min(daysLeft, 21));
      for (let i = 0; i <= spanDays; i++) {
        cumulativeCapacity += getDayEffectiveCapacity(addDays(todayStr, i), st);
      }
      const occupationRatio = remainingMinutes / Math.max(cumulativeCapacity, 15);

      let level = 'safe';
      let reason = `締切まであと${daysLeft}日・残作業${remainingMinutes}分`;
      if (daysLeft < 0) {
        level = 'danger'; reason = `締切を${Math.abs(daysLeft)}日超過・残作業${remainingMinutes}分`;
      } else if (daysLeft === 0) {
        level = 'danger'; reason = `今日が締切・残作業${remainingMinutes}分`;
      } else if (daysLeft === 1 && remainingMinutes >= 30) {
        level = 'danger'; reason = `明日が締切・残作業${remainingMinutes}分`;
      } else if (occupationRatio >= 0.45) {
        level = 'danger'; reason = `残日数に対し作業量が大（空き枠の${Math.round(occupationRatio * 100)}%占有）`;
      } else if (daysLeft <= 3 || occupationRatio >= 0.22 || hasOverdueStep) {
        level = 'warning';
        reason = hasOverdueStep ? `昨日以前の未消化ステップあり（締切まであと${daysLeft}日）` : `締切まであと${daysLeft}日・計画的な着手が必要`;
      }

      const urgencyBonus = Math.max(0, 14 - Math.max(0, daysLeft)) * 12;
      const score = RISK_META[level].weight + (task.importance || 2) * 35 + urgencyBonus + (hasOverdueStep ? 80 : 0);
      return { level, label: RISK_META[level].label, reason, remainingMinutes, totalMinutes, progressPercent, daysLeft, score };
    }

    function assignDatesForNewTaskSteps(steps, deadlineDate, st, todayStr = toDateStr()) {
      if (!steps || steps.length === 0) return [];
      if (!deadlineDate) {
        const todayCap = getDayEffectiveCapacity(todayStr, st);
        const todayUsed = getDayScheduledMinutes(todayStr, st);
        return steps.map((s, idx) => (idx === 0 && (todayUsed + s.estimatedMinutes) <= todayCap) ? { ...s, scheduledDate: todayStr } : { ...s, scheduledDate: null });
      }
      const daysToDeadline = Math.max(0, diffDays(todayStr, deadlineDate));
      const targetSpan = daysToDeadline >= 2 ? daysToDeadline - 1 : daysToDeadline;
      const candidateDates = [];
      for (let d = 0; d <= targetSpan; d++) candidateDates.push(addDays(todayStr, d));

      const virtualUsage = {};
      const taskStepsCountOnDay = {};
      for (const dt of candidateDates) {
        virtualUsage[dt] = getDayScheduledMinutes(dt, st);
        taskStepsCountOnDay[dt] = 0;
      }

      return steps.map(step => {
        const stepMins = step.estimatedMinutes || 30;
        let chosenDate = candidateDates[0];
        let found = false;
        for (const dt of candidateDates) {
          if ((virtualUsage[dt] + stepMins) <= getDayEffectiveCapacity(dt, st) && taskStepsCountOnDay[dt] < 1) {
            chosenDate = dt; found = true; break;
          }
        }
        if (!found) {
          let bestRatio = Infinity;
          for (const dt of candidateDates) {
            const ratio = (virtualUsage[dt] + stepMins) / Math.max(getDayEffectiveCapacity(dt, st), 15);
            if (ratio < bestRatio) { bestRatio = ratio; chosenDate = dt; }
          }
        }
        virtualUsage[chosenDate] = (virtualUsage[chosenDate] || 0) + stepMins;
        taskStepsCountOnDay[chosenDate] = (taskStepsCountOnDay[chosenDate] || 0) + 1;
        return { ...step, scheduledDate: chosenDate };
      });
    }

    function createInstanceForRule(st, rule, deadlineDate, todayStr) {
      const taskId = uid('task');
      const [, m, d] = deadlineDate.split('-').map(Number);
      const rawSteps = rule.stepsTemplate.map((ts, idx) => ({
        id: uid('step'), taskId, title: ts.title, orderIndex: idx + 1,
        estimatedMinutes: ts.estimatedMinutes, templateIndex: idx,
        scheduledDate: null, isCompleted: false, completedAt: null
      }));
      const scheduledSteps = assignDatesForNewTaskSteps(rawSteps, deadlineDate, st, todayStr);
      const task = {
        id: taskId, subjectId: rule.subjectId, title: `${rule.title}（${m}/${d}）`,
        rawInput: `毎週${WEEKDAY_LABELS[rule.weekday]}曜: ${rule.title}`,
        category: rule.category, status: 'planned', deadlineDate,
        estimatedMinutes: scheduledSteps.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0),
        importance: rule.importance || 2, understandingLevel: null, nextReviewDate: null,
        createdAt: todayStr, recurringRuleId: rule.id, occurrenceDate: deadlineDate
      };
      st.tasks.unshift(task);
      st.taskSteps.push(...scheduledSteps);
      return task;
    }

    function generateRecurringInstances(st, todayStr) {
      const created = [];
      for (const rule of st.recurringRules || []) {
        if (!rule.active) continue;
        for (let d = 0; d <= 7; d++) {
          const date = addDays(todayStr, d);
          if (weekdayOf(date) !== rule.weekday) continue;
          if (rule.startDate && date < rule.startDate) continue;
          if (rule.lastGeneratedDeadline && date <= rule.lastGeneratedDeadline) continue;
          const exists = st.tasks.some(t => t.recurringRuleId === rule.id && t.occurrenceDate === date);
          if (!exists) created.push(createInstanceForRule(st, rule, date, todayStr));
          rule.lastGeneratedDeadline = date;
        }
      }
      return created;
    }

    function createRuleFromParsed(st, parsed, stepDefs, todayStr) {
      const rule = {
        id: uid('rule'), subjectId: parsed.subjectId, title: parsed.cleanTitle,
        category: parsed.category, importance: parsed.importance,
        weekday: parsed.recurrence.weekday, active: true,
        startDate: addDays(todayStr, 1), lastGeneratedDeadline: null,
        stepsTemplate: stepDefs.map(s => ({ title: s.title, estimatedMinutes: s.minutes, sampleCount: 0, history: [] })),
        createdAt: todayStr
      };
      if (!st.recurringRules) st.recurringRules = [];
      st.recurringRules.push(rule);
      return rule;
    }

    function createRuleFromTask(st, task, weekday, todayStr) {
      const steps = st.taskSteps.filter(s => s.taskId === task.id).sort((a, b) => a.orderIndex - b.orderIndex);
      const rule = {
        id: uid('rule'), subjectId: task.subjectId, title: task.title.replace(/（\d{1,2}\/\d{1,2}）$/, ''),
        category: task.category, importance: task.importance || 2, weekday, active: true,
        startDate: addDays(todayStr, 1),
        lastGeneratedDeadline: task.deadlineDate && weekdayOf(task.deadlineDate) === weekday ? task.deadlineDate : null,
        stepsTemplate: steps.map(s => ({ title: s.title, estimatedMinutes: s.estimatedMinutes || 30, sampleCount: 0, history: [] })),
        createdAt: todayStr
      };
      steps.forEach((s, idx) => { s.templateIndex = idx; });
      task.recurringRuleId = rule.id;
      task.occurrenceDate = task.deadlineDate || null;
      if (!st.recurringRules) st.recurringRules = [];
      st.recurringRules.push(rule);
      return rule;
    }

    function generateReplanProposal(st, todayStr = toDateStr(), forceFullOptimize = false) {
      const uncompletedSteps = st.taskSteps.filter(s => !s.isCompleted);
      const taskMap = new Map(st.tasks.map(t => [t.id, t]));
      const subjectMap = new Map(st.subjects.map(s => [s.id, s]));

      const overdueSteps = uncompletedSteps.filter(s => s.scheduledDate && diffDays(todayStr, s.scheduledDate) < 0);
      const todayCap = getDayEffectiveCapacity(todayStr, st);
      const todayUncompleted = uncompletedSteps.filter(s => s.scheduledDate === todayStr);
      const todayCompletedMins = st.taskSteps.filter(s => s.isCompleted && s.scheduledDate === todayStr).reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0);
      const todayPlannedMins = todayUncompleted.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0) + todayCompletedMins;
      const condition = st.dailyStates?.[todayStr]?.condition || 'normal';
      const isOverloadedToday = todayPlannedMins > todayCap;

      if (!forceFullOptimize && overdueSteps.length === 0 && !isOverloadedToday) {
        return { hasChanges: false, reasons: [], diffs: [] };
      }

      const reasons = [];
      if (overdueSteps.length > 0) reasons.push(`昨日以前の未完了ステップが ${overdueSteps.length}件 あります`);
      if (isOverloadedToday) reasons.push(`今日の予定（${todayPlannedMins}分）が現在の目安枠（${todayCap}分・${CONDITION_META[condition].label}モード）を超えています`);
      if (forceFullOptimize && reasons.length === 0) reasons.push('締切危険度と日別の空き時間バランスに合わせて全体を再配分します');

      const schedulableSteps = uncompletedSteps
        .filter(s => { const task = taskMap.get(s.taskId); return task && (task.deadlineDate || s.scheduledDate); })
        .map(step => {
          const task = taskMap.get(step.taskId);
          const risk = evaluateTaskRisk(task, st, todayStr);
          return { step, task, riskScore: risk.score, deadlineDate: task.deadlineDate || addDays(todayStr, 7) };
        });

      schedulableSteps.sort((a, b) => {
        if (b.riskScore !== a.riskScore) return b.riskScore - a.riskScore;
        if (a.step.taskId === b.step.taskId) return a.step.orderIndex - b.step.orderIndex;
        return (a.deadlineDate || '').localeCompare(b.deadlineDate || '');
      });

      const dayUsage = { [todayStr]: todayCompletedMins };
      const taskDayCount = {};
      const diffs = [];

      for (const item of schedulableSteps) {
        const { step, task, deadlineDate } = item;
        const mins = step.estimatedMinutes || 30;
        const daysLeft = Math.max(0, diffDays(todayStr, deadlineDate));
        const maxOffset = daysLeft >= 2 ? daysLeft - 1 : daysLeft;

        let startOffset = (condition === 'tired' && daysLeft >= 2 && mins > 30) ? 1 : 0;
        const minDateForTask = taskDayCount[`lastDate_${task.id}`] || todayStr;
        startOffset = Math.max(startOffset, Math.max(0, diffDays(todayStr, minDateForTask)));

        let selectedDate = null;
        for (let d = startOffset; d <= Math.max(startOffset, maxOffset + 1); d++) {
          const candidate = addDays(todayStr, d);
          if (((dayUsage[candidate] || 0) + mins) <= getDayEffectiveCapacity(candidate, st) && (taskDayCount[`${task.id}_${candidate}`] || 0) < 1) {
            selectedDate = candidate; break;
          }
        }
        if (!selectedDate) {
          let bestDate = addDays(todayStr, Math.min(startOffset, daysLeft));
          let minRatio = Infinity;
          for (let d = startOffset; d <= Math.max(startOffset, daysLeft); d++) {
            const candidate = addDays(todayStr, d);
            const ratio = ((dayUsage[candidate] || 0) + mins) / Math.max(getDayEffectiveCapacity(candidate, st), 15);
            if (ratio < minRatio) { minRatio = ratio; bestDate = candidate; }
          }
          selectedDate = bestDate;
        }

        dayUsage[selectedDate] = (dayUsage[selectedDate] || 0) + mins;
        taskDayCount[`${task.id}_${selectedDate}`] = (taskDayCount[`${task.id}_${selectedDate}`] || 0) + 1;
        taskDayCount[`lastDate_${task.id}`] = selectedDate;

        if (step.scheduledDate !== selectedDate) {
          const sub = subjectMap.get(task.subjectId);
          diffs.push({
            stepId: step.id, taskId: task.id, stepTitle: step.title, taskTitle: task.title,
            subjectName: sub ? sub.name : '科目未設定', subjectColor: sub ? sub.color : 'hsl(215, 16%, 50%)',
            minutes: mins, oldDate: step.scheduledDate, oldDateLabel: formatJpDate(step.scheduledDate, todayStr),
            newDate: selectedDate, newDateLabel: formatJpDate(selectedDate, todayStr)
          });
        }
      }

      return { hasChanges: diffs.length > 0, reasons, diffs };
    }

    function buildDashboardModel(st, todayStr = toDateStr(), pocketMaxMinutes = 30) {
      const taskMap = new Map(st.tasks.map(t => [t.id, t]));
      const subjectMap = new Map(st.subjects.map(s => [s.id, s]));
      const condition = st.dailyStates?.[todayStr]?.condition || 'normal';
      const capacityMinutes = getDayEffectiveCapacity(todayStr, st);

      const enrichedSteps = st.taskSteps.map(step => {
        const task = taskMap.get(step.taskId);
        if (!task) return null;
        const sub = subjectMap.get(task.subjectId);
        const risk = evaluateTaskRisk(task, st, todayStr);
        const isOverdue = !step.isCompleted && step.scheduledDate && diffDays(todayStr, step.scheduledDate) < 0;
        return {
          ...step, taskTitle: task.title, category: task.category, deadlineDate: task.deadlineDate,
          deadlineLabel: formatJpDate(task.deadlineDate, todayStr), subjectId: task.subjectId,
          subjectName: sub ? sub.name : '未設定', subjectColor: sub ? sub.color : 'hsl(215, 14%, 55%)',
          risk, isOverdue, isRecurring: !!task.recurringRuleId,
          priorityScore: risk.score + (isOverdue ? 100 : 0) - step.orderIndex * 2
        };
      }).filter(Boolean);

      const todayAndOverdueUncompleted = enrichedSteps
        .filter(s => !s.isCompleted && (s.scheduledDate === todayStr || s.isOverdue))
        .sort((a, b) => b.priorityScore - a.priorityScore);

      const completedTodaySteps = enrichedSteps.filter(s => s.isCompleted && (s.completedAt === todayStr || s.scheduledDate === todayStr));
      const completedTodayMinutes = completedTodaySteps.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0);
      let plannedRemainingMinutes = todayAndOverdueUncompleted.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0);

      const unscheduledSteps = enrichedSteps.filter(s => !s.isCompleted && !s.scheduledDate);
      const recommendedBonusSteps = [];
      let runningTotal = completedTodayMinutes + plannedRemainingMinutes;
      for (const us of unscheduledSteps) {
        if ((runningTotal + (us.estimatedMinutes || 30)) <= capacityMinutes && recommendedBonusSteps.length < 2) {
          recommendedBonusSteps.push({ ...us, isBonusRecommendation: true });
          runningTotal += (us.estimatedMinutes || 30);
        }
      }

      const allTodayActionSteps = [...todayAndOverdueUncompleted, ...recommendedBonusSteps];
      const topPriorityStep = allTodayActionSteps.length > 0 ? allTodayActionSteps[0] : null;
      const otherTodaySteps = allTodayActionSteps.slice(1);
      const totalTodayMinutes = completedTodayMinutes + allTodayActionSteps.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0);

      const firstUncompletedByTask = new Map();
      for (const s of enrichedSteps) {
        if (!s.isCompleted && !firstUncompletedByTask.has(s.taskId)) firstUncompletedByTask.set(s.taskId, s);
      }
      const pocketSteps = Array.from(firstUncompletedByTask.values())
        .filter(s => (s.estimatedMinutes || 30) <= pocketMaxMinutes)
        .sort((a, b) => b.priorityScore - a.priorityScore)
        .slice(0, 5);

      const activeTasksWithRisk = st.tasks
        .filter(t => t.status !== 'completed')
        .map(t => {
          const sub = subjectMap.get(t.subjectId);
          const risk = evaluateTaskRisk(t, st, todayStr);
          return { ...t, subjectName: sub ? sub.name : '未設定', subjectColor: sub ? sub.color : 'hsl(215, 14%, 55%)', deadlineLabel: formatJpDate(t.deadlineDate, todayStr), risk };
        })
        .filter(t => t.risk.remainingMinutes > 0)
        .sort((a, b) => b.risk.score - a.risk.score);

      const reviewTasks = st.tasks
        .filter(t => t.understandingLevel === 1 || t.nextReviewDate)
        .map(t => {
          const sub = subjectMap.get(t.subjectId);
          return { ...t, subjectName: sub ? sub.name : '未設定', subjectColor: sub ? sub.color : 'hsl(215, 14%, 55%)', reviewDateLabel: t.nextReviewDate ? formatJpDate(t.nextReviewDate, todayStr) : '要復習' };
        });

      const replanProposal = generateReplanProposal(st, todayStr, false);
      return { todayStr, condition, capacityMinutes, completedTodayMinutes, totalTodayMinutes, completedTodaySteps, topPriorityStep, otherTodaySteps, pocketSteps, activeTasksWithRisk, reviewTasks, replanProposal };
    }

    /* ==========================================================================
       5. Main App Controller & View Renderer
       ========================================================================== */
    let state = loadAppState();
    let currentTab = 'today';
    let pocketFilterMins = 30;
    let inboxFilter = 'all';
    let captureDecomposeOverride = null;
    let captureRecurringOverride = null;
    let captureRecurringWeekday = null;
    let activeTimer = { stepId: null, taskId: null, title: '', remainingSeconds: 0, elapsedSeconds: 0, isRunning: false, intervalId: null };

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      el.className = 'toast-msg';
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function applyTheme(theme) {
      if (!state.userSettings) state.userSettings = {};
      state.userSettings.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('btn-theme-toggle');
      if (btn) btn.innerHTML = theme === 'dark' ? '☀️ ライト' : '🌙 ダーク';
    }

    function commitState() {
      saveAppState(state);
      renderAll();
    }

    function resolveCaptureRecurrence(parsed, todayStr) {
      const isRecurring = captureRecurringOverride !== null ? captureRecurringOverride : !!parsed.recurrence;
      if (!isRecurring) return null;
      const currentDow = weekdayOf(todayStr);
      let weekday = captureRecurringWeekday;
      if (typeof weekday !== 'number') {
        if (parsed.recurrence && typeof parsed.recurrence.weekday === 'number') weekday = parsed.recurrence.weekday;
        else if (parsed.deadlineDate) weekday = weekdayOf(parsed.deadlineDate);
        else {
          const sub = state.subjects.find(s => s.id === parsed.subjectId);
          weekday = typeof sub?.defaultWeekday === 'number' ? sub.defaultWeekday : currentDow;
        }
      }
      let delta = weekday - currentDow;
      if (delta <= 0) delta += 7;
      return { frequency: 'weekly', weekday, nextDeadlineDate: addDays(todayStr, delta) };
    }

    function renderCapturePreview() {
      const input = document.getElementById('quick-capture-input');
      const previewEl = document.getElementById('quick-capture-preview');
      if (!input || !previewEl) return;

      const todayStr = toDateStr();
      const parsed = parseNaturalInput(input.value, state.subjects, todayStr, state.userSettings?.defaultTaskMinutes || 30);
      if (!parsed) {
        previewEl.classList.add('hidden');
        previewEl.innerHTML = '';
        return;
      }

      const effectiveDecompose = captureDecomposeOverride !== null ? captureDecomposeOverride : parsed.shouldDecompose;
      const stepCount = effectiveDecompose && parsed.suggestedSteps.length > 0 ? parsed.suggestedSteps.length : 1;
      const rec = resolveCaptureRecurrence(parsed, todayStr);
      const effectiveDeadline = rec ? rec.nextDeadlineDate : parsed.deadlineDate;
      const effectiveDeadlineLabel = effectiveDeadline ? formatJpDate(effectiveDeadline, todayStr) : '未設定';

      previewEl.classList.remove('hidden');
      previewEl.innerHTML = `
        <span class="preview-chip ${parsed.subjectId ? 'matched' : ''}">
          <span class="subject-dot" style="background:${parsed.subjectColor || 'hsl(215,15%,60%)'}"></span>
          科目: ${escapeHtml(parsed.subjectName || '未設定 (そのまま登録可)')}
        </span>
        <span class="preview-chip matched">${parsed.categoryIcon} 種別: ${escapeHtml(parsed.categoryLabel)}</span>
        <span class="preview-chip ${effectiveDeadline ? 'matched' : ''}">📅 初回期限: ${escapeHtml(effectiveDeadlineLabel)}</span>
        <span class="preview-chip ${!parsed.isDefaultDuration ? 'matched' : ''}">⏱️ 初期推定: ${parsed.estimatedMinutes}分${rec ? ' (完了時に実績から自動補正)' : (parsed.isDefaultDuration ? ' (標準)' : '')}</span>
        <button type="button" id="toggle-capture-decompose" class="preview-chip ${effectiveDecompose ? 'matched' : ''}">
          🪄 ${effectiveDecompose && parsed.suggestedSteps.length > 0 ? `自動分解: ON (${stepCount}ステップ)` : '単一タスク (分解OFF)'}
        </button>
        <button type="button" id="toggle-capture-recurring" class="preview-chip ${rec ? 'matched' : ''}">
          🔁 ${rec ? `毎週${WEEKDAY_LABELS[rec.weekday]}曜に繰り返す: ON` : '毎週繰り返す: OFF (クリックでON)'}
        </button>
        ${rec ? `
          <label class="preview-chip matched" style="padding:0.1rem 0.45rem;">
            <span>曜日変更:</span>
            <select id="capture-recurring-dow" style="background:transparent;border:none;font-weight:700;outline:none;cursor:pointer;">
              ${WEEKDAY_LABELS.map((w, idx) => `<option value="${idx}" ${rec.weekday === idx ? 'selected' : ''}>毎週${w}曜</option>`).join('')}
            </select>
          </label>
        ` : ''}
      `;

      document.getElementById('toggle-capture-decompose')?.addEventListener('click', () => {
        if (parsed.suggestedSteps.length === 0 && !effectiveDecompose) {
          parsed.suggestedSteps = [
            { title: '準備・内容確認', minutes: 10 },
            { title: 'メイン作業・演習', minutes: Math.max(15, parsed.estimatedMinutes - 20) },
            { title: '見直し・完了確認', minutes: 10 }
          ];
        }
        captureDecomposeOverride = !effectiveDecompose;
        renderCapturePreview();
      });

      document.getElementById('toggle-capture-recurring')?.addEventListener('click', () => {
        captureRecurringOverride = !rec;
        renderCapturePreview();
      });

      document.getElementById('capture-recurring-dow')?.addEventListener('change', (e) => {
        captureRecurringWeekday = Number(e.target.value);
        captureRecurringOverride = true;
        renderCapturePreview();
      });
    }

    function handleQuickCaptureSubmit() {
      const input = document.getElementById('quick-capture-input');
      if (!input || !input.value.trim()) return;
      const todayStr = toDateStr();
      const parsed = parseNaturalInput(input.value, state.subjects, todayStr, state.userSettings?.defaultTaskMinutes || 30);
      if (!parsed) return;

      const effectiveDecompose = captureDecomposeOverride !== null ? captureDecomposeOverride : parsed.shouldDecompose;
      const rec = resolveCaptureRecurrence(parsed, todayStr);

      let stepDefs = [];
      if (effectiveDecompose && parsed.suggestedSteps.length > 0) {
        stepDefs = parsed.suggestedSteps.map(s => ({ title: s.title, minutes: s.minutes }));
      } else {
        stepDefs = [{ title: parsed.cleanTitle, minutes: parsed.estimatedMinutes }];
      }

      if (rec) {
        const rule = createRuleFromParsed(state, { ...parsed, recurrence: { frequency: 'weekly', weekday: rec.weekday } }, stepDefs, todayStr);
        generateRecurringInstances(state, todayStr);
        input.value = '';
        captureDecomposeOverride = null;
        captureRecurringOverride = null;
        captureRecurringWeekday = null;
        renderCapturePreview();
        commitState();
        showToast(`🔁「${rule.title}」を毎週${WEEKDAY_LABELS[rec.weekday]}曜の定期課題として登録しました（完了時に実時間から推定時間を自動補正します）`);
        return;
      }

      const newTaskId = uid('task');
      const rawSteps = stepDefs.map((s, idx) => ({
        id: uid('step'), taskId: newTaskId, title: s.title, orderIndex: idx + 1,
        estimatedMinutes: s.minutes, scheduledDate: null, isCompleted: false, completedAt: null
      }));
      const scheduledSteps = assignDatesForNewTaskSteps(rawSteps, parsed.deadlineDate, state, todayStr);
      const totalMins = scheduledSteps.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0);

      state.tasks.unshift({
        id: newTaskId, subjectId: parsed.subjectId, title: parsed.cleanTitle, rawInput: parsed.rawInput,
        category: parsed.category, status: parsed.deadlineDate ? 'planned' : 'inbox',
        deadlineDate: parsed.deadlineDate, estimatedMinutes: totalMins, importance: parsed.importance,
        understandingLevel: null, nextReviewDate: null, createdAt: todayStr
      });
      state.taskSteps.push(...scheduledSteps);

      input.value = '';
      captureDecomposeOverride = null;
      captureRecurringOverride = null;
      captureRecurringWeekday = null;
      renderCapturePreview();
      commitState();
      showToast(`✓「${parsed.cleanTitle}」を追加しました（${scheduledSteps.length}ステップ）`);
    }

    function bindDashboardEvents(replanProposal) {
      const todayStr = toDateStr();
      document.querySelectorAll('[data-set-condition]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cond = btn.getAttribute('data-set-condition');
          if (!state.dailyStates) state.dailyStates = {};
          state.dailyStates[todayStr] = { date: todayStr, condition: cond, customAvailableMinutes: null };
          commitState();
          showToast(`今日のコンディションを「${CONDITION_META[cond].icon} ${CONDITION_META[cond].label}」に切り替えました`);
        });
      });

      document.querySelectorAll('[data-pocket-mins]').forEach(btn => {
        btn.addEventListener('click', () => {
          pocketFilterMins = parseInt(btn.getAttribute('data-pocket-mins'), 10);
          renderAll();
        });
      });

      document.getElementById('btn-open-replan-modal')?.addEventListener('click', () => openReplanModal(replanProposal));

      document.querySelectorAll('[data-complete-step]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const stepId = btn.getAttribute('data-complete-step');
          const step = state.taskSteps.find(s => s.id === stepId);
          if (!step) return;
          if (step.isCompleted) {
            step.isCompleted = false;
            step.completedAt = null;
            const parent = state.tasks.find(t => t.id === step.taskId);
            if (parent && parent.status === 'completed') parent.status = 'in_progress';
            commitState();
          } else {
            openCompleteStepModal(stepId);
          }
        });
      });

      document.querySelectorAll('[data-start-timer]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          startFocusTimerForStep(btn.getAttribute('data-start-timer'));

          const mins = Number(document.getElementById('complete-actual-mins')?.value) || step.estimatedMinutes || 30;

            task.status = siblings.every(s => s.isCompleted) ? 'completed' : 'in_progress';

    function startFocusTimerForStep(stepId) {
      const step = state.taskSteps.find(s => s.id === stepId);
      if (!step) return;
      if (activeTimer.intervalId) clearInterval(activeTimer.intervalId);
      activeTimer = {
        stepId: step.id, taskId: step.taskId, title: step.title,
        remainingSeconds: (step.estimatedMinutes || 25) * 60, elapsedSeconds: 0, isRunning: true,
        intervalId: setInterval(() => {
          if (!activeTimer.isRunning) return;
          activeTimer.elapsedSeconds += 1;
          if (activeTimer.remainingSeconds > 0) activeTimer.remainingSeconds -= 1;
          updateTimerUI();
        }, 1000)
      };
      updateTimerUI();
      document.getElementById('timer-floating-bar')?.classList.remove('hidden');
    }

    function updateTimerUI() {
      const tEl = document.getElementById('timer-step-title');
      const cEl = document.getElementById('timer-clock-display');
      const bEl = document.getElementById('timer-toggle-btn');
      if (tEl) tEl.textContent = activeTimer.title;
      if (cEl) {
        const m = String(Math.floor(activeTimer.remainingSeconds / 60)).padStart(2, '0');
        const s = String(activeTimer.remainingSeconds % 60).padStart(2, '0');
        cEl.textContent = `${m}:${s}`;
      }
      if (bEl) bEl.textContent = activeTimer.isRunning ? '⏸ 一時停止' : '▶ 再開';
