            <div style="display:flex;align-items:center;gap:0.4rem;">
              <span style="font-size:0.76rem;color:var(--text-secondary);">毎週</span>
              <select class="form-select" style="width:auto;padding:0.2rem 0.45rem;font-size:0.76rem;" data-rule-weekday="${rule.id}">
                ${WEEKDAY_LABELS.map((w, idx) => `<option value="${idx}" ${rule.weekday === idx ? 'selected' : ''}>${w}曜</option>`).join('')}
              </select>
              <button type="button" class="btn-secondary" style="font-size:0.74rem;padding:0.25rem 0.55rem;" data-toggle-rule="${rule.id}">
                ${rule.active ? '一時停止' : '再開'}

                ${icon('trash', 14)}
              </button>
            </div>
          </div>

          <div style="font-size:0.76rem;color:var(--text-secondary);">
            次回の推定 合計 <strong class="tabular-nums">${totalEstimate}分</strong>
            ・実績からの学習反映 <span class="tabular-nums">${totalSamples}回</span>
          </div>

          <div style="display:flex;flex-direction:column;gap:0.3rem;">
            ${rule.stepsTemplate.map((ts, idx) => {
              const last = (ts.history || []).slice(-1)[0];
              const err = getAverageError(ts);
              return `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;background:var(--bg-surface-subtle);padding:0.35rem 0.6rem;border-radius:var(--radius-sm);font-size:0.78rem;flex-wrap:wrap;">

                    <span class="duration-tag">次回推定 ${ts.estimatedMinutes}分</span>
                  </span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function finalizeStepCompletion(step, task, actualMinutes, understandingLevel, reflectionNote) {
  // Capture pre-completion state snapshot for 5-second Undo
  const snapshotJson = JSON.stringify(state);

  const todayStr = toDateStr();
  const sub = state.subjects.find(s => s.id === task?.subjectId);
  const taskType = task ? (task.taskType || inferTaskTypeForItem(task, sub)) : '課題';
  const spec = getTaskTypeSpec(isExperimentSubject(sub), taskType);
  const estimatedBefore = step.estimatedMinutes || spec.baseMinutes;
  const baseEstimatedBefore = step.baseEstimatedMinutes || estimatedBefore;

  applyActualToRecurringRule(state, step, actualMinutes, todayStr);

  step.isCompleted = true;
  step.completedAt = todayStr;
  step.estimatedMinutes = actualMinutes;

  if (task && task.subjectId && task.isPrepReview && sub && !isExperimentSubject(sub)) {
    const key = task.isPrepReview === 'prep' ? 'prepMinutes' : 'reviewMinutes';
    const oldVal = Number(sub[key]) || 20;
    sub[key] = Math.max(5, Math.round((0.5 * actualMinutes + 0.5 * oldVal) / 5) * 5);
  }

  // Append reflectionNote to subject's 1-line memoLogs if provided
  if (reflectionNote && sub) {
    if (!Array.isArray(sub.memoLogs)) sub.memoLogs = [];
    sub.memoLogs.unshift({
      id: uid('memo'),
      date: todayStr,
      text: `${reflectionNote}（${step.title}）`
    });
  }

  if (task) {
    task.taskType = taskType;
    task.understandingLevel = understandingLevel;
    if (understandingLevel === 1) {
      task.nextReviewDate = addDays(todayStr, 3);
    }
    const allSteps = state.taskSteps.filter(s => s.taskId === task.id);
    if (allSteps.every(s => s.isCompleted)) {
      task.status = 'completed';
      task.completedAt = todayStr;
      if (task.recurringRuleId) {
        generateRecurringInstances(state, todayStr);
      }
    } else {
      task.status = 'in_progress';
    }
    task.estimatedMinutes = allSteps.reduce((acc, s) => acc + (Number(s.estimatedMinutes) || 0), 0);
  }

  state.studyLogs.unshift({
    id: uid('log'),
    taskId: task ? task.id : null,
    stepId: step.id,
    subjectId: task ? task.subjectId : null,
    taskType,
    title: task && task.title !== step.title ? `${task.title}：${step.title}` : step.title,
    studiedDate: todayStr,
    durationMinutes: actualMinutes,
    estimatedMinutes: estimatedBefore,
    baseEstimatedMinutes: baseEstimatedBefore,
    understandingLevel,
    reflectionNote
  });

  const learnedStat = sub ? getLearnedEstimateForSubjectType(state, sub.id, taskType) : null;

  commitState();

  const undoMsg = learnedStat
    ? `完了！${sub.name}（${taskType}）平均${learnedStat.avgMinutes}分（比${learnedStat.ratio}倍）`
    : `「${step.title}」を完了しました`;

  showUndoToast(undoMsg, snapshotJson);
}

              <option value="${tType}" ${task.taskType === tType ? 'selected' : ''}>${escapeHtml(tType)}</option>
            `).join('')}
          </select>
        </div>
        <div class="form-field">
          <label class="form-label">締切日</label>
          <input type="date" id="detail-task-deadline" class="form-input" value="${task.deadlineDate || ''}" />
        </div>
        <div class="form-field">
          <label class="form-label">優先度（重要度）</label>
          <select id="detail-task-importance" class="form-select">
            <option value="3" ${task.importance === 3 ? 'selected' : ''}>高（レポート・試験・必修）</option>
            <option value="2" ${task.importance === 2 ? 'selected' : ''}>中（通常課題・演習）</option>
            <option value="1" ${task.importance === 1 ? 'selected' : ''}>低（自主学習・予備）</option>
          </select>
        </div>
      </div>

      ${renderRecurringSectionHtml(task)}

      <div style="border-top:1px solid var(--border-subtle);padding-top:0.9rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;flex-wrap:wrap;gap:0.4rem;">
          <div>
            <div style="font-weight:700;font-size:0.9rem;">${icon('layers', 15)} 実行ステップ分解 (${steps.length}ステップ)</div>
            <div style="font-size:0.75rem;color:var(--text-secondary);">種別に応じた初期推定・自動分解、または完了実測からの補正値を反映できます</div>
          </div>
          <div style="display:flex;gap:0.4rem;">
            <button type="button" class="btn-secondary" id="btn-auto-decompose-template" style="font-size:0.75rem;padding:0.3rem 0.6rem;">
              種別テンプレートで再分解
            </button>
            <button type="button" class="btn-secondary" id="btn-add-step-row" style="font-size:0.75rem;padding:0.3rem 0.6rem;">
              + ステップ追加
            </button>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:0.45rem;" id="detail-steps-list">
          ${steps.map((st, idx) => `
            <div style="display:flex;align-items:center;gap:0.45rem;background:var(--bg-surface-subtle);padding:0.45rem 0.6rem;border-radius:var(--radius-sm);flex-wrap:wrap;">
              <span class="tabular-nums" style="font-size:0.76rem;font-weight:700;color:var(--text-muted);width:22px;">${idx + 1}.</span>
              <input
                type="text"
                class="form-input"
                style="flex:1;min-width:140px;padding:0.3rem 0.5rem;font-size:0.83rem;"
                data-edit-step-title="${st.id}"
                value="${escapeHtml(st.title)}"
              />
              <input
                type="number"
                class="form-input tabular-nums"
                style="width:68px;padding:0.3rem 0.4rem;font-size:0.82rem;"
                data-edit-step-mins="${st.id}"
                value="${st.estimatedMinutes}"
                min="5"
                max="300"
                step="5"
              />
              <span style="font-size:0.75rem;color:var(--text-secondary);">分</span>
              <input
                type="date"
                class="form-input"
                style="width:130px;padding:0.28rem 0.4rem;font-size:0.76rem;"
                data-edit-step-date="${st.id}"
                value="${st.scheduledDate || ''}"
              />
              ${steps.length > 1 ? `
                <button type="button" class="close-btn" data-remove-step="${st.id}" title="ステップ削除">${icon('x', 14)}</button>
              ` : ''}
            </div>
          `).join('')}
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:0.85rem;border-top:1px solid var(--border-subtle);">
        <button type="button" class="btn-danger-ghost" id="btn-delete-task">${icon('trash', 14)} <span>課題を削除</span></button>
        <div style="display:flex;gap:0.55rem;">
          <button type="button" class="btn-primary" id="btn-save-task-detail">保存してスケジュール反映</button>
        </div>
      </div>
    `;

    const syncDraftInputs = () => {
      task.title = document.getElementById('detail-task-title')?.value?.trim() || task.title;
      task.subjectId = document.getElementById('detail-task-subject')?.value || null;
      const newSub = state.subjects.find(s => s.id === task.subjectId);
      const selectedType = document.getElementById('detail-task-type')?.value;
      const validTypes = getAllowedTaskTypes(isExperimentSubject(newSub));
      task.taskType = validTypes.includes(selectedType) ? selectedType : inferTaskTypeForItem(task, newSub);
      const spec = getTaskTypeSpec(isExperimentSubject(newSub), task.taskType);
      task.category = spec.category;
      task.deadlineDate = document.getElementById('detail-task-deadline')?.value || null;
      task.importance = Number(document.getElementById('detail-task-importance')?.value) || 2;

      body.querySelectorAll('[data-edit-step-title]').forEach(inp => {
        const st = state.taskSteps.find(s => s.id === inp.getAttribute('data-edit-step-title'));
        if (st) st.title = inp.value.trim() || st.title;
      });
      body.querySelectorAll('[data-edit-step-mins]').forEach(inp => {
        const st = state.taskSteps.find(s => s.id === inp.getAttribute('data-edit-step-mins'));
        if (st) st.estimatedMinutes = Math.max(5, Number(inp.value) || 30);
      });
      body.querySelectorAll('[data-edit-step-date]').forEach(inp => {
        const st = state.taskSteps.find(s => s.id === inp.getAttribute('data-edit-step-date'));
        if (st) st.scheduledDate = inp.value || null;
      });

      const currentSteps = state.taskSteps.filter(s => s.taskId === task.id);
      task.estimatedMinutes = currentSteps.reduce((acc, s) => acc + (Number(s.estimatedMinutes) || 0), 0);
    };

    // Re-render modal if Subject changes between Normal and Experiment course so TaskType options update
    document.getElementById('detail-task-subject')?.addEventListener('change', () => {
      syncDraftInputs();
      renderModalContent();
    });

    document.getElementById('btn-convert-to-recurring')?.addEventListener('click', () => {
      syncDraftInputs();
      const dow = Number(document.getElementById('convert-rule-weekday')?.value ?? 1);
      const rule = createRuleFromTask(state, task, dow, toDateStr());
      generateRecurringInstances(state, toDateStr());
      commitState();
      renderModalContent();
      showToast(`「${rule.title}」を毎週${WEEKDAY_LABELS[dow]}曜の定期課題に設定しました`);
    });

    document.getElementById('detail-rule-weekday')?.addEventListener('change', (e) => {
      const rule = (state.recurringRules || []).find(r => r.id === task.recurringRuleId);
      if (rule) {
        rule.weekday = Number(e.target.value);
        commitState();
        renderModalContent();
        showToast(`繰り返し曜日を毎週${WEEKDAY_LABELS[rule.weekday]}曜に変更しました`);
      }
    });

    document.getElementById('btn-stop-recurring-rule')?.addEventListener('click', () => {
      const rule = (state.recurringRules || []).find(r => r.id === task.recurringRuleId);
      if (rule) rule.active = false;
      task.recurringRuleId = null;
      commitState();
      renderModalContent();
      showToast('毎週の繰り返しを解除しました');
    });

    body.querySelectorAll('[data-remove-step]').forEach(btn => {
      btn.addEventListener('click', () => {
        syncDraftInputs();
        const rmId = btn.getAttribute('data-remove-step');
        state.taskSteps = state.taskSteps.filter(s => s.id !== rmId);
        state.taskSteps
          .filter(s => s.taskId === task.id)
          .sort((a, b) => a.orderIndex - b.orderIndex)
          .forEach((s, idx) => { s.orderIndex = idx + 1; });
        renderModalContent();
      });
    });

    document.getElementById('btn-auto-decompose-template')?.addEventListener('click', () => {
      syncDraftInputs();
      const todayStr = toDateStr();
      const currentSub = state.subjects.find(s => s.id === task.subjectId);
      const expFlag = isExperimentSubject(currentSub);
      const templates = getCategoryStepTemplates(task.taskType, expFlag, task.taskType);
      const learned = task.subjectId ? getLearnedEstimateForSubjectType(state, task.subjectId, task.taskType) : null;
      const templateSum = templates.reduce((acc, t) => acc + t.minutes, 0);
      const scale = learned ? (learned.learnedMinutes / Math.max(1, templateSum)) : 1;

      state.taskSteps = state.taskSteps.filter(s => s.taskId !== task.id);
      const rawSteps = templates.map((t, idx) => ({
        id: uid('step'),
        taskId: task.id,
        title: templates.length === 1 ? task.title : t.title,
        orderIndex: idx + 1,
        templateIndex: idx,
        estimatedMinutes: Math.max(5, Math.round((t.minutes * scale) / 5) * 5),
        baseEstimatedMinutes: t.minutes,
        scheduledDate: null,
        isCompleted: false,
        completedAt: null
      }));
      const scheduled = assignDatesForNewTaskSteps(rawSteps, task.deadlineDate, state, todayStr, task.subjectId);
      state.taskSteps.push(...scheduled);
      renderModalContent();
      showToast(`「${task.taskType}」のテンプレート（${scheduled.length}ステップ）を適用しました`);
    });

    document.getElementById('btn-add-step-row')?.addEventListener('click', () => {
      syncDraftInputs();
      const existing = state.taskSteps.filter(s => s.taskId === task.id);
      state.taskSteps.push({
        id: uid('step'),
        taskId: task.id,
        title: `作業ステップ ${existing.length + 1}`,
        orderIndex: existing.length + 1,
        estimatedMinutes: 30,
        baseEstimatedMinutes: 30,
        scheduledDate: task.deadlineDate || toDateStr(),
        isCompleted: false,
        completedAt: null
      });
      renderModalContent();
    });

    document.getElementById('btn-delete-task')?.addEventListener('click', () => {
      state.tasks = state.tasks.filter(t => t.id !== task.id);
      state.taskSteps = state.taskSteps.filter(s => s.taskId !== task.id);
      modal.classList.add('hidden');
      commitState();
      showToast('課題を削除しました');
    });

    document.getElementById('btn-save-task-detail')?.addEventListener('click', () => {
      syncDraftInputs();
      if (task.deadlineDate) {
        const unscheduled = state.taskSteps.filter(s => s.taskId === task.id && !s.scheduledDate && !s.isCompleted);
        if (unscheduled.length > 0) {
          const allTaskSteps = state.taskSteps.filter(s => s.taskId === task.id);
          const scheduled = assignDatesForNewTaskSteps(allTaskSteps, task.deadlineDate, state, toDateStr(), task.subjectId);
          state.taskSteps = state.taskSteps.filter(s => s.taskId !== task.id).concat(scheduled);
        }
        if (task.status === 'inbox') task.status = 'planned';
      }
      modal.classList.add('hidden');
      commitState();
      showToast('課題とステップ計画を保存しました');
    });
  };

  renderModalContent();
  modal.classList.remove('hidden');
}

/* ==========================================================================
   MODAL 3: Non-destructive Replanning Diff Preview
   ========================================================================== */
function openReplanModal(proposal) {
  const modal = document.getElementById('modal-replan-diff');
  const body = document.getElementById('modal-replan-body');
  if (!modal || !body) return;

  if (!proposal || !proposal.hasChanges) {
    body.innerHTML = `
      <div style="text-align:center;padding:1.5rem 0;">
        <div style="color:var(--accent-primary);">${icon('checkCircle', 30)}</div>
        <div style="font-weight:700;margin-top:0.5rem;">現在のスケジュールは最適に分散されています</div>
        <p style="font-size:0.84rem;color:var(--text-secondary);margin-top:0.25rem;">
          期限遅れや1日のキャパシティ超過はありません。
        </p>
      </div>
    `;
    modal.classList.remove('hidden');
    return;
  }

  body.innerHTML = `
    <div style="font-size:0.85rem;color:var(--text-secondary);">
      以下のステップの実行予定日を再配置することで、締切直前の集中や1日のキャパシティ超過を防ぎます。確認の上で適用してください。
    </div>

    <div class="diff-list">
      ${proposal.diffs.map(d => `
        <div class="diff-row">
          <div style="min-width:0;flex:1;">
            <div style="font-size:0.75rem;color:var(--text-secondary);display:flex;align-items:center;gap:0.35rem;">
              <span class="subject-dot" style="background:${d.subjectColor}"></span>
              <span>${escapeHtml(d.subjectName)}・${escapeHtml(d.taskTitle)} (${d.minutes}分)</span>
            </div>
            <div style="font-weight:600;margin-top:0.1rem;">${escapeHtml(d.stepTitle)}</div>
          </div>
          <div class="diff-dates tabular-nums">
            <span class="diff-old">${escapeHtml(d.oldDateLabel)}</span>
            <span>→</span>
            <span class="diff-new">${escapeHtml(d.newDateLabel)}</span>
          </div>
        </div>
      `).join('')}
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.6rem;padding-top:0.75rem;border-top:1px solid var(--border-subtle);">
      <button type="button" class="btn-secondary" id="btn-cancel-replan">今は変更しない</button>
      <button type="button" class="btn-primary" id="btn-approve-replan">
        ${icon('check', 15)} <span>この内容で計画を更新する (${proposal.diffs.length}件)</span>
      </button>
    </div>
  `;

  modal.classList.remove('hidden');

  document.getElementById('btn-cancel-replan')?.addEventListener('click', () => {
    modal.classList.add('hidden');
  });

  document.getElementById('btn-approve-replan')?.addEventListener('click', () => {
    for (const diff of proposal.diffs) {
      const step = state.taskSteps.find(s => s.id === diff.stepId);
      if (step) {
        step.scheduledDate = diff.newDate;
      }
    }
    modal.classList.add('hidden');
    commitState();
    showToast(`${proposal.diffs.length}件のステップを新しい計画に更新しました`);
  });
}

/* ==========================================================================
   Focus Timer Controller
   ========================================================================== */
function startFocusTimerForStep(stepId) {
  const step = state.taskSteps.find(s => s.id === stepId);
  if (!step) return;

  if (activeTimer.intervalId) {
    clearInterval(activeTimer.intervalId);
  }

  const mins = Number(step.estimatedMinutes) || 25;
  activeTimer = {
    stepId: step.id,
    taskId: step.taskId,
    title: step.title,
    remainingSeconds: mins * 60,
    elapsedSeconds: 0,
    isRunning: true,
    intervalId: setInterval(() => {
      if (!activeTimer.isRunning) return;
      activeTimer.elapsedSeconds += 1;
      if (activeTimer.remainingSeconds > 0) {
        activeTimer.remainingSeconds -= 1;
      }
      updateTimerFloatingBarUI();
    }, 1000)
  };

  updateTimerFloatingBarUI();
  document.getElementById('timer-floating-bar')?.classList.remove('hidden');
  showToast(`「${step.title}」の集中タイマーを開始しました`);
}

function toggleFocusTimer() {
  if (!activeTimer.stepId) return;
  activeTimer.isRunning = !activeTimer.isRunning;
  updateTimerFloatingBarUI();
}

function stopFocusTimer() {
  if (activeTimer.intervalId) {
    clearInterval(activeTimer.intervalId);
  }
  activeTimer = {
    stepId: null,
    taskId: null,
    title: '',
    remainingSeconds: 0,
    elapsedSeconds: 0,
    isRunning: false,
    intervalId: null
  };
  document.getElementById('timer-floating-bar')?.classList.add('hidden');
}

function updateTimerFloatingBarUI() {
  const titleEl = document.getElementById('timer-step-title');
  const clockEl = document.getElementById('timer-clock-display');
  const toggleBtn = document.getElementById('timer-toggle-btn');

  if (titleEl) titleEl.textContent = activeTimer.title;
  if (clockEl) {
    const m = String(Math.floor(activeTimer.remainingSeconds / 60)).padStart(2, '0');
