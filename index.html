    { title: '後半範囲の演習問題解き直し', minutes: 45 },
    { title: '苦手問題・間違えた箇所の集中復習', minutes: 40 },
    { title: '公式・要点の総仕上げチェック', minutes: 30 }
  ]
};

const WEEKDAY_MAP = {
  '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6
};

/**
 * Parse natural Japanese task input in real-time
 * @param {string} rawText - User input string
 * @param {Array} subjects - Registered subjects array
 * @param {string} todayStr - Today's YYYY-MM-DD
 * @param {number} defaultMinutes - Default task duration from settings (30)
 */
function parseNaturalInput(rawText, subjects = [], todayStr = toDateStr(), defaultMinutes = 30) {
  const text = (rawText || '').trim();
  if (!text) {
    return null;
  }

  const [ty, tm, td] = todayStr.split('-').map(Number);
  const todayObj = new Date(ty, tm - 1, td);
  const currentDow = todayObj.getDay();

  // 1. Detect Subject (Match against registered subjects & aliases)
  let matchedSubject = null;
  for (const sub of subjects) {
    const candidates = [sub.name, ...(sub.aliases || [])].filter(Boolean);
    // Sort longer aliases first for accurate matching
    candidates.sort((a, b) => b.length - a.length);
    if (candidates.some(alias => text.includes(alias))) {
      matchedSubject = sub;
      break;
    }
  }

  // 2. Detect Category & Importance
  let category = 'assignment';
  let categoryExplicit = false;

  if (/レポート|レポ|報告書|論文/.test(text)) {
    category = 'report';
    categoryExplicit = true;
  } else if (/小テスト|クイズ|単語テスト|ミニテスト/.test(text)) {
    category = 'quiz';
    categoryExplicit = true;
  } else if (/定期試験|期末試験|中間試験|期末テスト|中間テスト|本試験|試験/.test(text)) {
    category = 'exam';
    categoryExplicit = true;
  } else if (/問題|演習|課題|宿題|プリント|提出/.test(text)) {
    category = 'assignment';
    categoryExplicit = true;
  } else if (/勉強|復習|予習|整理|まとめ|暗記|読書|読む|リスニング/.test(text)) {
    category = 'self_study';
    categoryExplicit = true;
  }

  // 3. Detect Deadline Date (Do NOT guess if no date expression is present)
  let deadlineDate = null;
  let matchedDateToken = '';

  // 3-0. Weekly recurrence: 毎週月曜に / 毎週金曜までに / 毎週 (曜日なし)
  //      曜日がない場合は科目の授業曜日 → それもなければ今日の曜日 (後から変更可)
  let recurrence = null;
  const weeklyMatch = text.match(/毎週(?:の)?(?:([日月火水木金土])曜(?:日)?)?(?:まで(?:に)?|に|の)?/);
  if (weeklyMatch) {
    let weekday;
    let weekdaySource = 'explicit';
    if (weeklyMatch[1]) {
      weekday = WEEKDAY_MAP[weeklyMatch[1]];
    } else if (matchedSubject && typeof matchedSubject.defaultWeekday === 'number') {
      weekday = matchedSubject.defaultWeekday;
      weekdaySource = 'subject';
    } else {
      weekday = currentDow;
      weekdaySource = 'fallback';
    }
    let delta = weekday - currentDow;
    if (delta <= 0) delta += 7;
    deadlineDate = addDays(todayStr, delta);
    matchedDateToken = weeklyMatch[0];
    recurrence = { frequency: 'weekly', weekday, weekdaySource };
  }

  // 3a. Explicit M/D or M月D日
  const mdMatch = text.match(/(\d{1,2})\s*(?:月|\/)\s*(\d{1,2})\s*日?(?:まで(?:に)?|に)?/);
  if (!deadlineDate && mdMatch) {
    const m = parseInt(mdMatch[1], 10);
    const d = parseInt(mdMatch[2], 10);
    if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
      let targetYear = ty;
      const candidate = new Date(targetYear, m - 1, d);
      if (candidate < todayObj && (todayObj - candidate) > 1000 * 60 * 60 * 24 * 30) {
        targetYear += 1;
      }
      deadlineDate = toDateStr(new Date(targetYear, m - 1, d));
      matchedDateToken = mdMatch[0];
    }
  }

  // 3b. Relative days: 今日 / 明日 / 明後日 / N日後
  if (!deadlineDate) {
    const relDaysMatch = text.match(/(\d+)\s*日後(?:まで(?:に)?|に)?/);
    if (relDaysMatch) {
      deadlineDate = addDays(todayStr, parseInt(relDaysMatch[1], 10));
      matchedDateToken = relDaysMatch[0];
    } else if (/今日|本日|きょう/.test(text)) {
      deadlineDate = todayStr;
      const m = text.match(/(?:今日|本日|きょう)(?:の|中|まで(?:に)?|に)?/);
      if (m) matchedDateToken = m[0];
    } else if (/明後日|あさって/.test(text)) {
      deadlineDate = addDays(todayStr, 2);
      const m = text.match(/(?:明後日|あさって)(?:の|まで(?:に)?|に)?/);
      if (m) matchedDateToken = m[0];
    } else if (/明日|あした/.test(text)) {
      deadlineDate = addDays(todayStr, 1);
      const m = text.match(/(?:明日|あした)(?:の|まで(?:に)?|に)?/);
      if (m) matchedDateToken = m[0];
    }
  }

  // 3c. Weekdays: 来週月曜 / 今週金曜 / 金曜日までに / 水曜に
  if (!deadlineDate) {
    const dowMatch = text.match(/(再来週|来週|今週)?(?:の)?([日月火水木金土])曜(?:日)?(?:まで(?:に)?|に|の)?/);
    if (dowMatch) {
      const prefix = dowMatch[1] || '';
      const targetDow = WEEKDAY_MAP[dowMatch[2]];
      let delta = targetDow - currentDow;

      if (prefix === '来週') {
        // Next week's target day (at least into next week's cycle)
        const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
        const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
        delta = daysToNextMonday + offsetFromMonday;
      } else if (prefix === '再来週') {
        const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
        const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
        delta = daysToNextMonday + 7 + offsetFromMonday;
      } else {
        // 今週 or bare "金曜日までに"
        if (delta <= 0) {
          delta += 7;
        }
      }
      deadlineDate = addDays(todayStr, delta);
      matchedDateToken = dowMatch[0];
    }
  }

  // 3d. "来週の[科目]の課題" when weekday is omitted -> use subject's defaultWeekday if available
  if (!deadlineDate && /来週/.test(text) && matchedSubject && typeof matchedSubject.defaultWeekday === 'number') {
    const targetDow = matchedSubject.defaultWeekday;
    const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
    const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
    deadlineDate = addDays(todayStr, daysToNextMonday + offsetFromMonday);
    matchedDateToken = '来週';
  }

  // 4. Detect Estimated Duration (Minutes)
  let explicitMinutes = null;
  let matchedDurationToken = '';

  const hourMinMatch = text.match(/(\d+(?:\.\d+)?)\s*時間(?:\s*(\d+)\s*分)?/);
  const halfHourMatch = text.match(/(\d+)\s*時間半/);
  const minMatch = text.match(/(\d+)\s*(?:分|分間|m|min)(?:間|だけ|勉強する|やる)?/i);

  if (halfHourMatch) {
    explicitMinutes = parseInt(halfHourMatch[1], 10) * 60 + 30;
    matchedDurationToken = halfHourMatch[0];
  } else if (hourMinMatch) {
    const hrs = parseFloat(hourMinMatch[1]);
    const mins = hourMinMatch[2] ? parseInt(hourMinMatch[2], 10) : 0;
    explicitMinutes = Math.round(hrs * 60) + mins;
    matchedDurationToken = hourMinMatch[0];
  } else if (minMatch) {
    explicitMinutes = parseInt(minMatch[1], 10);
    matchedDurationToken = minMatch[0];
  }

  // Check problem count (e.g., "問題3問" -> 15 mins * 3 = 45 mins)
  let problemCount = null;
  const probMatch = text.match(/(\d+)\s*問/);
  if (probMatch) {
    problemCount = parseInt(probMatch[1], 10);
  }

  // 5. Determine Decomposition Steps (Only decompose large tasks; keep small tasks single-step)
  let suggestedSteps = [];
  let shouldDecompose = false;

  if (category === 'report') {
    shouldDecompose = true;
    suggestedSteps = DECOMPOSITION_TEMPLATES.report.map(s => ({ ...s }));
  } else if (category === 'exam') {
    shouldDecompose = true;
    suggestedSteps = DECOMPOSITION_TEMPLATES.exam.map(s => ({ ...s }));
  } else if (category === 'quiz' && (!explicitMinutes || explicitMinutes >= 45)) {
    shouldDecompose = true;
    suggestedSteps = DECOMPOSITION_TEMPLATES.quiz.map(s => ({ ...s }));
  } else if (/実験結果.*整理/.test(text) && (!explicitMinutes || explicitMinutes >= 40)) {
    shouldDecompose = true;
    suggestedSteps = DECOMPOSITION_TEMPLATES.experiment_org.map(s => ({ ...s }));
  } else if (problemCount && problemCount >= 3 && (!explicitMinutes || explicitMinutes >= 45)) {
    // e.g. 熱力学の問題3問を解く -> Split into manageable chunks if >= 3 problems
    shouldDecompose = true;
    const firstBatch = Math.ceil(problemCount / 2);
    const secondBatch = problemCount - firstBatch;
    suggestedSteps = [
      { title: `問題 1〜${firstBatch} を解く`, minutes: firstBatch * 15 },
      { title: `問題 ${firstBatch + 1}〜${problemCount} を解く＆解答確認`, minutes: secondBatch * 15 }
    ];
  }

  // If user specified an explicit short duration (e.g., 20分 or 30分), do NOT force multi-step breakdown
  if (explicitMinutes && explicitMinutes <= 35 && category !== 'report') {
    shouldDecompose = false;
    suggestedSteps = [];
  }

  // Calculate final estimatedMinutes
  let estimatedMinutes = explicitMinutes;
  let isDefaultDuration = false;

  if (!estimatedMinutes) {
    if (shouldDecompose && suggestedSteps.length > 0) {
      estimatedMinutes = suggestedSteps.reduce((acc, s) => acc + s.minutes, 0);
    } else if (problemCount) {
      estimatedMinutes = Math.max(15, Math.min(120, problemCount * 15));
    } else {
      // Rule #2: Default to 30 mins when unspecified
      estimatedMinutes = defaultMinutes || 30;
      isDefaultDuration = true;
    }
  } else if (shouldDecompose && suggestedSteps.length > 0) {
    // Scale template steps to match explicit total duration
    const templateSum = suggestedSteps.reduce((acc, s) => acc + s.minutes, 0);
    const ratio = estimatedMinutes / templateSum;
    suggestedSteps = suggestedSteps.map(s => ({
      title: s.title,
      minutes: Math.max(10, Math.round((s.minutes * ratio) / 5) * 5)
    }));
  }

  // 6. Clean up Title (Keep natural readability while stripping leading date prefix)
  let cleanTitle = text;
  if (matchedDateToken && !/今日/.test(matchedDateToken)) {
    cleanTitle = cleanTitle.replace(matchedDateToken, '').trim();
  }
  if (matchedDurationToken) {
    // Strip standalone duration phrases like "20分勉強する" -> keep natural or clean
    cleanTitle = cleanTitle
      .replace(/を?\s*\d+(?:\.\d+)?\s*(?:時間半|時間|分|分間)\s*(?:勉強する|やる|行う)$/, 'を勉強する')
      .replace(/\s+\d+\s*(?:分|時間)$/, '')
      .trim();
  }
  cleanTitle = cleanTitle.replace(/^[、,・\s]+/, '').trim();
  if (!cleanTitle) {
    cleanTitle = text;
  }

  return {
    rawInput: text,
    cleanTitle,
    subjectId: matchedSubject ? matchedSubject.id : null,
    subjectName: matchedSubject ? matchedSubject.name : null,
    subjectColor: matchedSubject ? matchedSubject.color : null,
    category,
    categoryLabel: CATEGORY_META[category].label,
    categoryIconName: CATEGORY_META[category].iconName,
    categoryExplicit,
    importance: CATEGORY_META[category].defaultImportance,
    deadlineDate,
    deadlineLabel: deadlineDate ? formatJpDate(deadlineDate, todayStr) : '未設定',
    estimatedMinutes,
    explicitMinutes,
    isDurationExplicit: Boolean(explicitMinutes),
    isDefaultDuration,
    shouldDecompose,
    suggestedSteps,
    recurrence
  };
}
function getCategoryStepTemplates(category) {
  if (category === 'report') return DECOMPOSITION_TEMPLATES.report.map(s => ({ ...s }));
  if (category === 'quiz') return DECOMPOSITION_TEMPLATES.quiz.map(s => ({ ...s }));
  if (category === 'exam') return DECOMPOSITION_TEMPLATES.exam.map(s => ({ ...s }));
  return [
    { title: '課題内容・資料の確認', minutes: 10 },
    { title: 'メイン作業・演習', minutes: 25 },
    { title: '見直し・完了確認', minutes: 10 }
  ];
}


// --- scheduler.js ---
/**
 * Smart Study OS - Auto-Scheduler, Risk Evaluator, AM/PM Condition & Gemini Weekly Prompt Engine (scheduler.js)
 */
const CONDITION_META = {
  energetic: {
    label: '元気',
    iconName: 'batteryHigh',
    multiplier: 1.25,
    desc: '集中力が高い状態。重めのレポート考察や計算ステップも積極的に進めます。'
  },
  normal: {
    label: '普通',
    iconName: 'batteryMid',
    multiplier: 1.0,
    desc: '標準ペース。計画通りに無理なくステップを消化します。'
  },
  tired: {
    label: '疲れている',
    iconName: 'batteryLow',
    multiplier: 0.55,
    desc: '負荷を自動軽減中。重たいレポートより短時間で終わる講義復習・軽負荷タスクを優先繰り上げします。'
  }
};
const RISK_META = {
  danger: { label: '危険', iconName: 'alertTriangle', className: 'danger' },
  warning: { label: '注意', iconName: 'alertCircle', className: 'warning' },
  safe: { label: '余裕', iconName: 'shieldCheck', className: 'safe' },
  none: { label: '期限なし', iconName: 'clock', className: 'none' }
};

const WEEKDAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];

/**
 * Determine whether current local time is PM (12:00 or later)
 */
function isCurrentTimePm() {
  return new Date().getHours() >= 12;
}

/**
 * Get AM / PM condition for a specific date (backward compatible with single `condition`)
 */
function getDayConditions(dateStr, state) {
  const ds = state.dailyStates?.[dateStr];
  const fallback = ds?.condition || 'normal';
  const am = ds?.conditionAm || fallback;
  const pm = ds?.conditionPm || fallback;
  const isPmNow = isCurrentTimePm();
  const activeSlot = isPmNow ? 'pm' : 'am';
  const activeCondition = isPmNow ? pm : am;
  return { am, pm, activeSlot, activeCondition };
}

/**
 * Get effective available study minutes for a specific date (YYYY-MM-DD),
 * combining AM (45% weight) and PM (55% weight) condition multipliers.
 */
function getDayEffectiveCapacity(dateStr, state) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = dt.getDay();

  const baseMap = state.userSettings?.weekdayCapacity || {
    0: 150, 1: 90, 2: 90, 3: 105, 4: 90, 5: 90, 6: 150
  };
  const baseMinutes = baseMap[dow] ?? 90;

  const daily = state.dailyStates?.[dateStr];
  if (daily && typeof daily.customAvailableMinutes === 'number' && daily.customAvailableMinutes > 0) {
    return daily.customAvailableMinutes;
  }

  const { am, pm } = getDayConditions(dateStr, state);
  const multAm = CONDITION_META[am]?.multiplier ?? 1.0;
  const multPm = CONDITION_META[pm]?.multiplier ?? 1.0;

  const combined = baseMinutes * (0.45 * multAm + 0.55 * multPm);
  return Math.max(15, Math.round(combined / 5) * 5);
}

/**
 * Calculate remaining steps and total remaining minutes for a parent task
 */
function getTaskProgressStats(taskId, taskSteps) {
  const steps = taskSteps.filter(s => s.taskId === taskId);
  if (steps.length === 0) {
    return { totalSteps: 0, completedSteps: 0, remainingMinutes: 0, totalMinutes: 0 };
  }
  let completedSteps = 0;
  let remainingMinutes = 0;
  let totalMinutes = 0;

  for (const s of steps) {
    const mins = Number(s.estimatedMinutes) || 30;
    totalMinutes += mins;
    if (s.isCompleted) {
      completedSteps += 1;
    } else {
      remainingMinutes += mins;
    }
  }

  return {
    totalSteps: steps.length,
    completedSteps,
    remainingMinutes,
    totalMinutes
  };
}

/**
 * Evaluate Deadline Risk Level for a Task
 */
function evaluateTaskRisk(task, state, todayStr = toDateStr()) {
  const stats = getTaskProgressStats(task.id, state.taskSteps);
  const remainingMinutes = stats.remainingMinutes;

  if (task.status === 'completed' || remainingMinutes === 0) {
    return {
      level: 'safe',
      score: 0,
      daysLeft: null,
      remainingMinutes: 0,
      totalMinutes: stats.totalMinutes,
      completedSteps: stats.completedSteps,
      totalSteps: stats.totalSteps,
      label: '完了',
      reason: 'すべてのステップが完了しています'
    };
  }

  if (!task.deadlineDate) {
    return {
      level: 'none',
      score: 15 + (task.importance || 2) * 5,
      daysLeft: null,
      remainingMinutes,
      totalMinutes: stats.totalMinutes,
      completedSteps: stats.completedSteps,
      totalSteps: stats.totalSteps,
      label: '期限未設定',
      reason: `残作業 ${remainingMinutes}分（空き時間に提案）`
    };
  }

  const daysLeft = diffDays(todayStr, task.deadlineDate);

  let availableMinutesUntilDeadline = 0;
  const spanDays = Math.max(0, daysLeft);
  for (let i = 0; i <= Math.min(spanDays, 14); i++) {
    const dStr = addDays(todayStr, i);
    availableMinutesUntilDeadline += getDayEffectiveCapacity(dStr, state);
  }

  const loadRatio = availableMinutesUntilDeadline > 0
    ? remainingMinutes / availableMinutesUntilDeadline
    : 9.9;

  let level = 'safe';
  let reason = '';

  if (daysLeft < 0) {
    level = 'danger';
    reason = `期限を ${Math.abs(daysLeft)}日 超過しています（残 ${remainingMinutes}分）`;
  } else if (daysLeft === 0) {
    level = 'danger';
    reason = `今日が締切です（残作業 ${remainingMinutes}分）`;
  } else if (daysLeft === 1 && remainingMinutes >= 45) {
    level = 'danger';
    reason = `明日締切・残作業 ${remainingMinutes}分で集中対応が必要`;
  } else if (loadRatio >= 0.65) {
    level = 'danger';
    reason = `締切までの空き時間に対し残作業（${remainingMinutes}分）が逼迫`;
  } else if (daysLeft <= 2 || loadRatio >= 0.32 || (daysLeft <= 4 && remainingMinutes >= 90)) {
    level = 'warning';
    reason = `あと${daysLeft}日・残作業 ${remainingMinutes}分（今日からの分散着手を推奨）`;
  } else {
    level = 'safe';
    reason = `あと${daysLeft}日・残作業 ${remainingMinutes}分（計画通り進行中）`;
  }

  const urgencyBase = daysLeft <= 0 ? 120 - daysLeft * 15 : Math.max(10, 95 - daysLeft * 14);
  const score = Math.round(
    urgencyBase +
    Math.min(60, remainingMinutes * 0.45) +
    (task.importance || 2) * 12
  );

  return {
    level,
    score,
    daysLeft,
    remainingMinutes,
    totalMinutes: stats.totalMinutes,
    completedSteps: stats.completedSteps,
    totalSteps: stats.totalSteps,
    label: RISK_META[level].label,
    reason
  };
}

/**
 * Compute currently scheduled minutes per date
 */
function getScheduledMinutesByDate(taskSteps, todayStr = toDateStr()) {
  const map = {};
  for (const step of taskSteps) {
    if (!step.scheduledDate) continue;
    if (step.isCompleted && step.scheduledDate !== todayStr) continue;
    map[step.scheduledDate] = (map[step.scheduledDate] || 0) + (Number(step.estimatedMinutes) || 30);
  }
  return map;
}

/**
 * Auto-schedule steps for a newly added or decomposed task
 */
function assignDatesForNewTaskSteps(steps, deadlineDate, state, todayStr = toDateStr()) {
  if (!deadlineDate) {
    return steps.map(s => ({ ...s, scheduledDate: null }));
  }

  const daysUntilDeadline = diffDays(todayStr, deadlineDate);
  if (daysUntilDeadline <= 0) {
    return steps.map(s => ({ ...s, scheduledDate: todayStr }));
  }

  const scheduledByDate = getScheduledMinutesByDate(state.taskSteps, todayStr);
  const isFinalSubmissionStep = (title) => /提出|最終確認|見直し/.test(title);
  const maxWorkOffset = daysUntilDeadline >= 2 ? daysUntilDeadline - 1 : daysUntilDeadline;

  const candidateDates = [];
  for (let i = 0; i <= maxWorkOffset; i++) {
    candidateDates.push(addDays(todayStr, i));
  }

  let minDateIdx = 0;

  return steps.map((step, idx) => {
    const stepMins = Number(step.estimatedMinutes) || 30;

    if (idx === steps.length - 1 && isFinalSubmissionStep(step.title) && daysUntilDeadline >= 1) {
      const subDate = addDays(todayStr, Math.min(daysUntilDeadline, maxWorkOffset + 1));
      scheduledByDate[subDate] = (scheduledByDate[subDate] || 0) + stepMins;
      return { ...step, scheduledDate: subDate };
    }

    let chosenIdx = minDateIdx;
    let foundUnderCap = false;

    for (let cIdx = minDateIdx; cIdx < candidateDates.length; cIdx++) {
      const dStr = candidateDates[cIdx];
      const cap = getDayEffectiveCapacity(dStr, state);
      const currentLoad = scheduledByDate[dStr] || 0;

      if (currentLoad + stepMins <= cap) {
        chosenIdx = cIdx;
        foundUnderCap = true;
        break;
      }
    }

    if (!foundUnderCap) {
      let bestRatio = Infinity;
      for (let cIdx = minDateIdx; cIdx < candidateDates.length; cIdx++) {
        const dStr = candidateDates[cIdx];
        const cap = getDayEffectiveCapacity(dStr, state);
        const currentLoad = scheduledByDate[dStr] || 0;
        const ratio = (currentLoad + stepMins) / Math.max(cap, 15);
        if (ratio < bestRatio) {
          bestRatio = ratio;
          chosenIdx = cIdx;
        }
      }
    }

    minDateIdx = chosenIdx;
    const assignedDate = candidateDates[chosenIdx];
    scheduledByDate[assignedDate] = (scheduledByDate[assignedDate] || 0) + stepMins;

    return {
      ...step,
      scheduledDate: assignedDate
    };
  });
}

/**
 * Generate a NON-DESTRUCTIVE replanning proposal (Before -> After diff)
 */
function generateReplanProposal(state, todayStr = toDateStr(), forceAll = false) {
  const taskMap = new Map(state.tasks.map(t => [t.id, t]));
  const subjectMap = new Map(state.subjects.map(s => [s.id, s]));

  const completedTodayMins = state.taskSteps
    .filter(s => s.isCompleted && (s.completedAt === todayStr || s.scheduledDate === todayStr))
    .reduce((acc, s) => acc + (Number(s.estimatedMinutes) || 30), 0);

  const uncompletedSteps = state.taskSteps.filter(s => {
    if (s.isCompleted) return false;
    const parent = taskMap.get(s.taskId);
    if (!parent || parent.status === 'completed') return false;
    return Boolean(parent.deadlineDate || s.scheduledDate);
  });

  const overdueSteps = uncompletedSteps.filter(
    s => s.scheduledDate && diffDays(todayStr, s.scheduledDate) < 0
  );
  const todayScheduledMins = uncompletedSteps
    .filter(s => s.scheduledDate === todayStr)
    .reduce((acc, s) => acc + (Number(s.estimatedMinutes) || 30), 0);

  const todayCapacity = getDayEffectiveCapacity(todayStr, state);
  const isTodayOverloaded = (completedTodayMins + todayScheduledMins) > todayCapacity;

  if (!forceAll && overdueSteps.length === 0 && !isTodayOverloaded) {
    return {
      hasChanges: false,
      reasons: [],
      diffs: []
    };
  }

  const reasons = [];
  if (overdueSteps.length > 0) {
    reasons.push(`未完了の過去予定ステップが ${overdueSteps.length}件 あります`);
  }
  if (isTodayOverloaded) {
    const { pm } = getDayConditions(todayStr, state);
    reasons.push(
      pm === 'tired'
        ? `午後の疲労モード（目安 ${todayCapacity}分）に対して今日の予定（${completedTodayMins + todayScheduledMins}分）が超過しています`
        : `今日の予定作業時間（${completedTodayMins + todayScheduledMins}分）が今日の目安枠（${todayCapacity}分）を超えています`
    );
  }
  if (reasons.length === 0 && forceAll) {
    reasons.push('締切までの負荷を均等に再配分します');
  }

  const taskRisks = new Map();
  for (const t of state.tasks) {
    taskRisks.set(t.id, evaluateTaskRisk(t, state, todayStr));
  }

  const stepsByTask = new Map();
  for (const s of uncompletedSteps) {
    if (!stepsByTask.has(s.taskId)) stepsByTask.set(s.taskId, []);
    stepsByTask.get(s.taskId).push(s);
  }
  for (const list of stepsByTask.values()) {
    list.sort((a, b) => a.orderIndex - b.orderIndex);
  }

  const sortedTaskIds = Array.from(stepsByTask.keys()).sort((a, b) => {
    const rA = taskRisks.get(a)?.score || 0;
    const rB = taskRisks.get(b)?.score || 0;
    return rB - rA;
  });

  const simLoadByDate = { [todayStr]: completedTodayMins };
  const diffs = [];

  for (const taskId of sortedTaskIds) {
    const task = taskMap.get(taskId);
    const subject = subjectMap.get(task?.subjectId);
    const tSteps = stepsByTask.get(taskId);
    const deadline = task?.deadlineDate || addDays(todayStr, 5);
    const daysLeft = Math.max(0, diffDays(todayStr, deadline));
    const maxOffset = daysLeft >= 2 ? daysLeft - 1 : daysLeft;

    let minOffset = 0;

    tSteps.forEach((step, idx) => {
      const mins = Number(step.estimatedMinutes) || 30;
      const isLastSub = idx === tSteps.length - 1 && /提出|最終確認/.test(step.title) && daysLeft >= 1;

      let chosenOffset = minOffset;
      if (isLastSub) {
        chosenOffset = Math.min(daysLeft, maxOffset + 1);
      } else {
        let placed = false;
        for (let off = minOffset; off <= maxOffset; off++) {
          const dStr = addDays(todayStr, off);
          const cap = getDayEffectiveCapacity(dStr, state);
          const cur = simLoadByDate[dStr] || 0;
          if (cur + mins <= cap) {
            chosenOffset = off;
            placed = true;
            break;
          }
        }
        if (!placed) {
          let bestRatio = Infinity;
          for (let off = minOffset; off <= daysLeft; off++) {
            const dStr = addDays(todayStr, off);
            const cap = getDayEffectiveCapacity(dStr, state);
            const cur = simLoadByDate[dStr] || 0;
            const ratio = (cur + mins) / Math.max(cap, 15);
            if (ratio < bestRatio) {
              bestRatio = ratio;
              chosenOffset = off;
            }
          }
        }
      }

      minOffset = chosenOffset;
      const newDate = addDays(todayStr, chosenOffset);
      simLoadByDate[newDate] = (simLoadByDate[newDate] || 0) + mins;

      if (newDate !== step.scheduledDate) {
        diffs.push({
          stepId: step.id,
          taskId: task.id,
          stepTitle: step.title,
          taskTitle: task.title,
          subjectName: subject ? subject.name : '科目未設定',
          subjectColor: subject ? subject.color : 'hsl(215, 14%, 55%)',
          minutes: mins,
          oldDate: step.scheduledDate,
          newDate,
          oldDateLabel: step.scheduledDate ? formatJpDate(step.scheduledDate, todayStr) : '未定',
          newDateLabel: formatJpDate(newDate, todayStr)
        });
      }
    });
  }

  return {
    hasChanges: diffs.length > 0,
    reasons,
    diffs
  };
}

/**
 * Build complete Today's Dashboard model with AM/PM condition & PM Tired Lecture Review Priority Boost
 */
function buildDashboardModel(state, todayStr = toDateStr(), pocketMaxMinutes = 30) {
  const taskMap = new Map(state.tasks.map(t => [t.id, t]));
  const subjectMap = new Map(state.subjects.map(s => [s.id, s]));

  const conditions = getDayConditions(todayStr, state);
  const conditionAm = conditions.am;
  const conditionPm = conditions.pm;
  const activeSlot = conditions.activeSlot;
  const condition = conditions.activeCondition;
  const capacityMinutes = getDayEffectiveCapacity(todayStr, state);

  // When PM is set to 'tired', automatically elevate lecture review/prep & short tasks above heavy report steps
  const isPmTiredMode = conditionPm === 'tired';

  const enrichedSteps = state.taskSteps
    .map(step => {
      const task = taskMap.get(step.taskId);
      if (!task) return null;
      const sub = subjectMap.get(task.subjectId);
      const risk = evaluateTaskRisk(task, state, todayStr);
      const isOverdue = !step.isCompleted && step.scheduledDate && diffDays(todayStr, step.scheduledDate) < 0;
      const isPrepOrReview = Boolean(
        task.isPrepReview ||
        task.category === 'review' ||
        task.category === 'prep' ||
        /復習|予習/.test(task.title) ||
        /復習|予習/.test(step.title)
      );
      const isShortStep = (Number(step.estimatedMinutes) || 30) <= 25;
      const isHeavyReport = task.category === 'report' && (Number(step.estimatedMinutes) || 30) >= 35;

      let priorityScore = risk.score + (isOverdue ? 100 : 0) - step.orderIndex * 2;
      let pmTiredBoosted = false;

      if (isPmTiredMode) {
        if (isPrepOrReview) {
          priorityScore += 85;
          pmTiredBoosted = true;
        } else if (isShortStep) {
          priorityScore += 45;
          pmTiredBoosted = true;
        } else if (isHeavyReport && risk.daysLeft !== 0) {
          priorityScore -= 35;
        }
      }

      return {
        ...step,
        taskTitle: task.title,
        category: task.category,
        isPrepReview: task.isPrepReview || null,
        deadlineDate: task.deadlineDate,
        deadlineLabel: formatJpDate(task.deadlineDate, todayStr),
        subjectId: task.subjectId,
        subjectName: sub ? sub.name : '未設定',
        subjectColor: sub ? sub.color : 'hsl(215, 14%, 55%)',
        risk,
        isOverdue,
        isRecurring: !!task.recurringRuleId,
        pmTiredBoosted,
        priorityScore
      };
    })
    .filter(Boolean);

  const todayAndOverdueUncompleted = enrichedSteps
    .filter(s => !s.isCompleted && (s.scheduledDate === todayStr || s.isOverdue))
    .sort((a, b) => b.priorityScore - a.priorityScore);

  const completedTodaySteps = enrichedSteps.filter(
    s => s.isCompleted && (s.completedAt === todayStr || s.scheduledDate === todayStr)
  );

  const completedTodayMinutes = completedTodaySteps.reduce(
    (acc, s) => acc + (Number(s.estimatedMinutes) || 30),
    0
  );

  let plannedRemainingMinutes = todayAndOverdueUncompleted.reduce(
    (acc, s) => acc + (Number(s.estimatedMinutes) || 30),
    0
  );

  // Pull in unscheduled/review steps if capacity allows (or if PM tired mode wants a quick review task)
  const unscheduledSteps = enrichedSteps
    .filter(s => !s.isCompleted && (!s.scheduledDate || (isPmTiredMode && s.pmTiredBoosted && s.scheduledDate !== todayStr)))
    .sort((a, b) => b.priorityScore - a.priorityScore);

  const recommendedBonusSteps = [];
  let runningTotal = completedTodayMinutes + plannedRemainingMinutes;
  for (const us of unscheduledSteps) {
    const mins = Number(us.estimatedMinutes) || 30;
    if ((runningTotal + mins <= capacityMinutes || (isPmTiredMode && us.pmTiredBoosted && recommendedBonusSteps.length === 0)) && recommendedBonusSteps.length < 2) {
      recommendedBonusSteps.push({ ...us, isBonusRecommendation: true });
      runningTotal += mins;
    }
  }

  const allTodayActionSteps = [...todayAndOverdueUncompleted, ...recommendedBonusSteps]
    .sort((a, b) => b.priorityScore - a.priorityScore);
  const topPriorityStep = allTodayActionSteps.length > 0 ? allTodayActionSteps[0] : null;
  const otherTodaySteps = allTodayActionSteps.slice(1);

  const totalTodayMinutes = completedTodayMinutes + allTodayActionSteps.reduce(
    (acc, s) => acc + (Number(s.estimatedMinutes) || 30),
    0
  );

  const firstUncompletedByTask = new Map();
  for (const s of enrichedSteps) {
    if (!s.isCompleted && !firstUncompletedByTask.has(s.taskId)) {
      firstUncompletedByTask.set(s.taskId, s);
    }
  }
  const pocketSteps = Array.from(firstUncompletedByTask.values())
    .filter(s => (Number(s.estimatedMinutes) || 30) <= pocketMaxMinutes)
    .sort((a, b) => b.priorityScore - a.priorityScore)
    .slice(0, 5);

  const activeTasksWithRisk = state.tasks
    .filter(t => t.status !== 'completed')
    .map(t => {
      const sub = subjectMap.get(t.subjectId);
      const risk = evaluateTaskRisk(t, state, todayStr);
      return {
        ...t,
        subjectName: sub ? sub.name : '未設定',
        subjectColor: sub ? sub.color : 'hsl(215, 14%, 55%)',
        deadlineLabel: formatJpDate(t.deadlineDate, todayStr),
        risk
      };
    })
    .filter(t => t.risk.remainingMinutes > 0)
    .sort((a, b) => b.risk.score - a.risk.score);

  const reviewTasks = state.tasks
    .filter(t => t.understandingLevel === 1 || t.nextReviewDate)
    .map(t => {
      const sub = subjectMap.get(t.subjectId);
      return {
        ...t,
        subjectName: sub ? sub.name : '未設定',
        subjectColor: sub ? sub.color : 'hsl(215, 14%, 55%)',
        reviewDateLabel: t.nextReviewDate ? formatJpDate(t.nextReviewDate, todayStr) : '要復習'
      };
    });

  const replanProposal = generateReplanProposal(state, todayStr, false);

  return {
    todayStr,
    condition,
    conditionAm,
    conditionPm,
    activeSlot,
    isPmTiredMode,
    capacityMinutes,
    completedTodayMinutes,
    totalTodayMinutes,
    completedTodaySteps,
    topPriorityStep,
    otherTodaySteps,
    pocketSteps,
    activeTasksWithRisk,
    reviewTasks,
    replanProposal
  };
}

/**
 * Generate structured Weekly Reflection Prompt for Gemini
 */
function generateWeeklyGeminiPrompt(state, todayStr = toDateStr()) {
  const startStr = addDays(todayStr, -6);
  const subjectMap = new Map((state.subjects || []).map(s => [s.id, s]));

  // 1. 今週の完了タスク数と合計学習時間
  const weekLogs = (state.studyLogs || []).filter(
    l => l.studiedDate >= startStr && l.studiedDate <= todayStr
  );
  const completedTasksCount = (state.tasks || []).filter(
    t => t.status === 'completed' && t.completedAt >= startStr && t.completedAt <= todayStr
  ).length;
  const completedStepsCount = (state.taskSteps || []).filter(
    s => s.isCompleted && s.completedAt >= startStr && s.completedAt <= todayStr
  ).length;
  const totalStudiedMinutes = weekLogs.reduce((acc, l) => acc + (Number(l.durationMinutes) || 0), 0);

  // 2. 午前・午後のコンディション推移（直近7日間）
  const condLines = [];
  const tiredSlots = [];
  for (let i = -6; i <= 0; i++) {
    const dStr = addDays(todayStr, i);
    const [y, m, d] = dStr.split('-').map(Number);
    const dow = WEEKDAY_NAMES[new Date(y, m - 1, d).getDay()];
    const { am, pm } = getDayConditions(dStr, state);
    const amLabel = CONDITION_META[am]?.label || '普通';
    const pmLabel = CONDITION_META[pm]?.label || '普通';
    condLines.push(`- ${m}/${d}(${dow}): 午前(AM)=${amLabel} / 午後(PM)=${pmLabel}`);
    if (am === 'tired') tiredSlots.push(`${dow}曜午前`);
    if (pm === 'tired') tiredSlots.push(`${dow}曜午後`);
  }
  const fatigueSummary = tiredSlots.length > 0
    ? `疲れやすい時間帯: ${tiredSlots.join('、')}`
    : '今週「疲れている」を選択した時間帯はありません（安定したコンディション）';

  // 3. 科目別の見積もりクセ（推定時間に対する実測時間の平均倍率・ズレの傾向）
  const subjectStats = new Map();
  for (const log of state.studyLogs || []) {
    if (!log.subjectId) continue;
    const actual = Number(log.durationMinutes) || 0;
    const est = Number(log.estimatedMinutes) || actual;
    if (actual <= 0 || est <= 0) continue;
    if (!subjectStats.has(log.subjectId)) {
      subjectStats.set(log.subjectId, { totalEst: 0, totalAct: 0, count: 0 });
    }
    const st = subjectStats.get(log.subjectId);
    st.totalEst += est;
    st.totalAct += actual;
    st.count += 1;
  }
  // Also include recurring rules step histories
  for (const rule of state.recurringRules || []) {
    if (!rule.subjectId) continue;
    for (const ts of rule.stepsTemplate || []) {
      for (const h of ts.history || []) {
        if (!subjectStats.has(rule.subjectId)) {
          subjectStats.set(rule.subjectId, { totalEst: 0, totalAct: 0, count: 0 });
        }
        const st = subjectStats.get(rule.subjectId);
        st.totalEst += Number(h.estimated) || 30;
        st.totalAct += Number(h.actual) || 30;
        st.count += 1;
      }
    }
  }

  const estimationLines = [];
  for (const [subId, st] of subjectStats.entries()) {
    const sub = subjectMap.get(subId);
    const subName = sub ? sub.name : 'その他';
    const ratio = (st.totalAct / Math.max(1, st.totalEst)).toFixed(2);
    const avgDiff = Math.round((st.totalAct - st.totalEst) / st.count);
    const trend = avgDiff > 3
      ? `見積もりより平均 +${avgDiff}分 長引く傾向（過小評価クセ）`
      : avgDiff < -3
        ? `見積もりより平均 ${Math.abs(avgDiff)}分 早く終わる傾向`
        : '見積もりと実測がほぼ一致';
    estimationLines.push(`- ${subName}: 実測/推定倍率 ${ratio}倍（推定計${st.totalEst}分 → 実測計${st.totalAct}分 / ${trend}）`);
  }
  if (estimationLines.length === 0) {
    estimationLines.push('- まだ完了タスクの実測ログが蓄積されていません（タスク完了時に実時間を記録すると自動集計されます）');
  }

  // 4. 今週書き留めた教科ごとの学習メモ一覧
  const memoLines = [];
  for (const sub of state.subjects || []) {
    const memos = (sub.memoLogs || []).filter(m => !m.date || (m.date >= startStr && m.date <= todayStr));
    const logNotes = weekLogs
      .filter(l => l.subjectId === sub.id && l.reflectionNote)
      .map(l => `[${l.studiedDate}] ${l.reflectionNote}`);
    const combined = [
      ...memos.map(m => `[${m.date || todayStr}] ${m.text}`),
      ...logNotes
    ];
    const uniqueMemos = Array.from(new Set(combined));
    if (uniqueMemos.length > 0 || sub.weakPointsNote) {
      memoLines.push(`【${sub.name}】`);
      if (sub.weakPointsNote) {
        memoLines.push(`  ・苦手分野メモ: ${sub.weakPointsNote}`);
      }
      uniqueMemos.forEach(line => memoLines.push(`  ・${line}`));
    }
  }
  if (memoLines.length === 0) {
    memoLines.push('- 今週記録された学習メモ・つまずきログはまだありません');
  }

  return [
    `# 今週の学習振り返りデータ（${startStr} 〜 ${todayStr}）`,
    '',
    '## 1. 今週の完了タスク数と合計学習時間',
    `- 完了した親課題数: ${completedTasksCount}件（完了ステップ数: ${completedStepsCount}ステップ）`,
    `- 合計学習時間: ${totalStudiedMinutes}分（約 ${(totalStudiedMinutes / 60).toFixed(1)}時間 / 記録ログ ${weekLogs.length}件）`,
    '',
    '## 2. 午前・午後のコンディション推移',
    ...condLines,
    `- 傾向サマリー: ${fatigueSummary}`,
    '',
    '## 3. 科目別の見積もりクセ（推定時間 vs 実測時間）',
    ...estimationLines,
    '',
    '## 4. 今週書き留めた教科ごとの学習メモ・つまずき一覧',
    ...memoLines,
    '',
    '---',
    '上記の学習ログと見積もりクセをもとに、来週の時間配分の改善案と、つまずいている科目の具体的な復習アプローチを提案してください。'
  ].join('\n');
}


// --- recurring.js ---
/**
 * Smart Study OS - 毎週の繰り返し課題 & 時間割の予習・復習自動生成 & 推定時間の学習 (recurring.js)
 */
const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

const GENERATE_AHEAD_DAYS = 7;
const HISTORY_LIMIT = 8;
const MIN_ALPHA = 0.3;
function weekdayOf(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}
function roundTo5(minutes) {
  return Math.max(5, Math.round(minutes / 5) * 5);
}

/**
 * 今日より後で、最初に指定曜日になる日付 (1〜7日後)
 */
function nextWeekdayDate(todayStr, weekday) {
  for (let d = 1; d <= 7; d++) {
    const candidate = addDays(todayStr, d);
    if (weekdayOf(candidate) === weekday) return candidate;
  }
  return addDays(todayStr, 7);
}

/**
 * 実績時間から次回の推定時間を計算する (状態は変更しない)
 */
function computeLearnedEstimate(templateStep, actualMinutes) {
  const current = templateStep.estimatedMinutes || 30;
  const n = templateStep.sampleCount || 0;

  let actual = Math.min(600, Math.max(1, Number(actualMinutes) || current));
  if (n > 0) {
    actual = Math.min(current * 3, Math.max(current / 3, actual));
  }

  const alpha = n === 0 ? 1 : Math.max(MIN_ALPHA, 1 / (n + 1));
  return roundTo5(alpha * actual + (1 - alpha) * current);
}

/**
 * 直近3回の「推定と実績のズレ」の平均 (分)。精度の目安として表示する
 */
function getAverageError(templateStep) {
  const history = templateStep.history || [];
  if (history.length === 0) return null;
  const recent = history.slice(-3);
  const total = recent.reduce((acc, h) => acc + Math.abs(h.actual - h.estimated), 0);
  return Math.round(total / recent.length);
}

/**
 * ステップに対応する繰り返しルールとテンプレートステップを探す
 */
function findTemplateStepForStep(state, step) {
  if (!step || typeof step.templateIndex !== 'number') return null;
  const task = state.tasks.find(t => t.id === step.taskId);
  if (!task || !task.recurringRuleId) return null;
  const rule = (state.recurringRules || []).find(r => r.id === task.recurringRuleId);
  if (!rule) return null;
  const templateStep = rule.stepsTemplate[step.templateIndex];
  if (!templateStep) return null;
  return { rule, templateStep, task };
}

/**
 * 完了モーダルでの「次回の推定はこう変わります」プレビュー用
 */
function previewLearning(state, step, actualMinutes) {
  const found = findTemplateStepForStep(state, step);
  if (!found) return null;
  const oldEstimate = found.templateStep.estimatedMinutes || 30;
  const nextEstimate = computeLearnedEstimate(found.templateStep, actualMinutes);
  return {
    ruleTitle: found.rule.title,
    stepTitle: found.templateStep.title,
    oldEstimate,
    nextEstimate,
    current: oldEstimate,
    next: nextEstimate,
    actualMinutes: Number(actualMinutes) || oldEstimate,
    sampleCount: found.templateStep.sampleCount || 0
  };
}

/**
 * ステップ完了時に実績を繰り返しルールへ反映する (学習)
 */
function applyActualToRecurringRule(state, step, actualMinutes, todayStr) {
  const found = findTemplateStepForStep(state, step);
  if (!found) return null;
  const { rule, templateStep } = found;

  const oldEstimate = templateStep.estimatedMinutes || 30;
  const nextEstimate = computeLearnedEstimate(templateStep, actualMinutes);

  templateStep.history = [
    ...(templateStep.history || []),
    { date: todayStr, estimated: step.estimatedMinutes || oldEstimate, actual: Number(actualMinutes) || oldEstimate }
  ].slice(-HISTORY_LIMIT);
  templateStep.sampleCount = (templateStep.sampleCount || 0) + 1;
  templateStep.estimatedMinutes = nextEstimate;

  const otherTaskIds = new Set(
    state.tasks
      .filter(t => t.recurringRuleId === rule.id && t.id !== step.taskId)
      .map(t => t.id)
  );
  for (const s of state.taskSteps) {
    if (
      otherTaskIds.has(s.taskId) &&
      !s.isCompleted &&
      s.templateIndex === step.templateIndex &&
      s.estimatedMinutes === oldEstimate
    ) {
      s.estimatedMinutes = nextEstimate;
    }
  }
  for (const taskId of otherTaskIds) {
    const t = state.tasks.find(x => x.id === taskId);
    if (t) {
      t.estimatedMinutes = state.taskSteps
        .filter(s => s.taskId === taskId)
        .reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0);
    }
  }

  return {
    ruleTitle: rule.title,
    stepTitle: templateStep.title,
    oldEstimate,
    nextEstimate,
    sampleCount: templateStep.sampleCount
  };
}

/**
 * 1回分の課題 (タスク + ステップ) をルールから作る
 */
function createInstanceForRule(state, rule, deadlineDate, todayStr) {
  const taskId = uid('task');
  const [, m, d] = deadlineDate.split('-').map(Number);

  const rawSteps = rule.stepsTemplate.map((ts, idx) => ({
    id: uid('step'),
    taskId,
    title: ts.title,
    orderIndex: idx + 1,
    estimatedMinutes: ts.estimatedMinutes,
    templateIndex: idx,
    scheduledDate: null,
    isCompleted: false,
    completedAt: null
  }));
  const scheduledSteps = assignDatesForNewTaskSteps(rawSteps, deadlineDate, state, todayStr);

  const task = {
    id: taskId,
    subjectId: rule.subjectId,
    title: `${rule.title}（${m}/${d}）`,
    rawInput: `毎週${WEEKDAY_LABELS[rule.weekday]}曜: ${rule.title}`,
    category: rule.category,
    status: 'planned',
    deadlineDate,
    estimatedMinutes: scheduledSteps.reduce((acc, s) => acc + (s.estimatedMinutes || 30), 0),
    importance: rule.importance || 2,
    understandingLevel: null,
    nextReviewDate: null,
    createdAt: todayStr,
    recurringRuleId: rule.id,
    occurrenceDate: deadlineDate
  };

  state.tasks.unshift(task);
  state.taskSteps.push(...scheduledSteps);
  return task;
}

/**
 * 締切が「今日〜7日後」に来る回をまだ作っていなければ作る
 */
function generateRecurringInstances(state, todayStr) {
  const created = [];
  for (const rule of state.recurringRules || []) {
    if (!rule.active) continue;
    for (let d = 0; d <= GENERATE_AHEAD_DAYS; d++) {
      const date = addDays(todayStr, d);
      if (weekdayOf(date) !== rule.weekday) continue;
      if (rule.startDate && date < rule.startDate) continue;
      if (rule.lastGeneratedDeadline && date <= rule.lastGeneratedDeadline) continue;

      const exists = state.tasks.some(t => t.recurringRuleId === rule.id && t.occurrenceDate === date);
      if (!exists) {
        created.push(createInstanceForRule(state, rule, date, todayStr));
      }
      rule.lastGeneratedDeadline = date;
    }
  }
  return created;
}

/**
 * 時間割科目の「予習（講義前日・推定20分）」「復習（講義当日〜翌日・推定20分）」自動生成同期
 */
function syncTimetablePrepReviewTasks(state, todayStr) {
  const created = [];
  const subjects = state.subjects || [];

  for (const sub of subjects) {
    const dow = sub.defaultWeekday;
    if (typeof dow !== 'number') continue;

    // 1. OFFになっている場合は未完了の自動生成タスクをクリーンアップ
    if (!sub.autoPrep) {
      const removeIds = new Set(
        state.tasks
          .filter(t => t.subjectId === sub.id && t.isPrepReview === 'prep' && t.status !== 'completed')
          .map(t => t.id)
      );
      if (removeIds.size > 0) {
        state.tasks = state.tasks.filter(t => !removeIds.has(t.id));
        state.taskSteps = state.taskSteps.filter(s => !removeIds.has(s.taskId));
      }
    }

    if (!sub.autoReview) {
      const removeIds = new Set(
        state.tasks
          .filter(t => t.subjectId === sub.id && t.isPrepReview === 'review' && t.status !== 'completed')
          .map(t => t.id)
      );
      if (removeIds.size > 0) {
        state.tasks = state.tasks.filter(t => !removeIds.has(t.id));
        state.taskSteps = state.taskSteps.filter(s => !removeIds.has(s.taskId));
      }
    }

    // 2. ONになっている場合は直近1週間の講義日に対して予習・復習タスクを自動生成
    for (let offset = -1; offset <= 7; offset++) {
      const lectureDate = addDays(todayStr, offset);
      if (weekdayOf(lectureDate) !== dow) continue;
      const [, lm, ld] = lectureDate.split('-').map(Number);

      // 予習: 講義前日に予定、講義当日が締切（今日〜7日後の講義が対象）
      if (sub.autoPrep && offset >= 0 && offset <= 7) {
        const prepKey = `prep_${sub.id}_${lectureDate}`;
        const exists = state.tasks.some(t => t.prepReviewKey === prepKey);
        if (!exists) {
          const prepMins = Number(sub.prepMinutes) || 20;
          const prepScheduledDate = offset >= 1 ? addDays(lectureDate, -1) : todayStr;
          const taskId = uid('task');
          const stepId = uid('step');
          const task = {
            id: taskId,
            subjectId: sub.id,
            title: `【予習】${sub.name}（${lm}/${ld}講義分）`,
            rawInput: `時間割自動生成: ${sub.name} 予習`,
            category: 'prep',
            isPrepReview: 'prep',
            prepReviewKey: prepKey,
            status: 'planned',
            deadlineDate: lectureDate,
            estimatedMinutes: prepMins,
            importance: 2,
            understandingLevel: null,
            nextReviewDate: null,
            createdAt: todayStr
          };
          const step = {
            id: stepId,
            taskId,
            title: `${sub.name} 次回講義範囲の予習・資料確認`,
            orderIndex: 1,
            estimatedMinutes: prepMins,
            scheduledDate: prepScheduledDate,
            isCompleted: false,
            completedAt: null
          };
          state.tasks.unshift(task);
          state.taskSteps.push(step);
          created.push(task);
        }
      }

      // 復習: 講義当日〜翌日に予定、講義翌日が締切（昨日〜6日後の講義が対象）
      if (sub.autoReview && offset >= -1 && offset <= 6) {
        const reviewKey = `review_${sub.id}_${lectureDate}`;
        const exists = state.tasks.some(t => t.prepReviewKey === reviewKey);
        if (!exists) {
          const revMins = Number(sub.reviewMinutes) || 20;
          const revScheduledDate = offset < 0 ? todayStr : lectureDate;
          const revDeadlineDate = addDays(lectureDate, 1);
          const taskId = uid('task');
          const stepId = uid('step');
          const task = {
            id: taskId,
            subjectId: sub.id,
            title: `【復習】${sub.name}（${lm}/${ld}講義分）`,
            rawInput: `時間割自動生成: ${sub.name} 復習`,
            category: 'review',
            isPrepReview: 'review',
            prepReviewKey: reviewKey,
            status: 'planned',
            deadlineDate: revDeadlineDate,
            estimatedMinutes: revMins,
            importance: 2,
            understandingLevel: null,
            nextReviewDate: null,
            createdAt: todayStr
          };
          const step = {
            id: stepId,
            taskId,
            title: `${sub.name} 講義ノート整理・要点復習`,
            orderIndex: 1,
            estimatedMinutes: revMins,
            scheduledDate: revScheduledDate,
            isCompleted: false,
            completedAt: null
          };
          state.tasks.unshift(task);
          state.taskSteps.push(step);
          created.push(task);
        }
      }
    }
  }

  return created;
}

/**
 * クイック登録 (例: 毎週月曜に電磁気の小テスト) からルールを作る
 */
function createRuleFromParsed(state, parsed, stepDefs, todayStr) {
  let delta = parsed.recurrence.weekday - weekdayOf(todayStr);
  if (delta <= 0) delta += 7;
  const firstDeadline = parsed.deadlineDate || addDays(todayStr, delta);

  const rule = {
    id: uid('rule'),
    subjectId: parsed.subjectId,
    title: parsed.cleanTitle,
    category: parsed.category,
    importance: parsed.importance,
    weekday: parsed.recurrence.weekday,
    active: true,
    startDate: todayStr,
    lastGeneratedDeadline: null,
    stepsTemplate: stepDefs.map(s => ({
      title: s.title,
      estimatedMinutes: s.minutes,
      sampleCount: 0,
      history: []
    })),
    createdAt: todayStr
  };
  if (!state.recurringRules) state.recurringRules = [];
  state.recurringRules.push(rule);
  createInstanceForRule(state, rule, firstDeadline, todayStr);
  rule.lastGeneratedDeadline = firstDeadline;
  return rule;
}

/**
 * 既存の課題を「毎週繰り返す」に変換する
 */
function createRuleFromTask(state, task, weekday, todayStr) {
  const steps = state.taskSteps
    .filter(s => s.taskId === task.id)
    .sort((a, b) => a.orderIndex - b.orderIndex);

  const rule = {
    id: uid('rule'),
    subjectId: task.subjectId,
    title: task.title.replace(/（\d{1,2}\/\d{1,2}）$/, ''),
    category: task.category,
    importance: task.importance || 2,
    weekday,
    active: true,
    startDate: addDays(todayStr, 1),
    lastGeneratedDeadline:
      task.deadlineDate && weekdayOf(task.deadlineDate) === weekday ? task.deadlineDate : null,
    stepsTemplate: steps.map(s => ({
      title: s.title,
      estimatedMinutes: s.estimatedMinutes || 30,
      sampleCount: 0,
      history: []
    })),
    createdAt: todayStr
  };

  steps.forEach((s, idx) => { s.templateIndex = idx; });
  task.recurringRuleId = rule.id;
  task.occurrenceDate = task.deadlineDate || null;

  if (!state.recurringRules) state.recurringRules = [];
  state.recurringRules.push(rule);
  return rule;
}

/**
 * Copy text to clipboard reliably with modal textarea fallback
 */
function copyTextWithModalFallback(title, description, textContent, toastMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textContent).catch(() => {});
  }
  const modal = document.getElementById('modal-subject-edit');
  const titleEl = document.getElementById('title-subject-modal');
  const body = document.getElementById('modal-subject-body');
  if (titleEl) titleEl.textContent = title;
  if (modal && body) {
    body.innerHTML = `
      <div style="background:var(--accent-soft);color:var(--accent-primary);padding:0.7rem 0.85rem;border-radius:var(--radius-sm);font-size:0.82rem;font-weight:600;display:flex;align-items:center;gap:0.45rem;">
        ${icon('checkCircle', 16)}
        <span>${escapeHtml(description)}</span>
      </div>
      <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
        <button type="button" class="btn-primary" id="btn-modal-copy-clipboard" style="width:100%;justify-content:center;padding:0.6rem;">
          ${icon('copy', 15)}
          <span>クリップボードにコピーする</span>
        </button>
      </div>
      <textarea id="modal-copy-textarea" class="form-textarea" rows="8" readonly style="font-family:var(--font-mono);font-size:0.75rem;line-height:1.5;"></textarea>
    `;
    modal.classList.remove('hidden');
    const ta = document.getElementById('modal-copy-textarea');
    if (ta) {
      ta.value = textContent;
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
    }
    document.getElementById('btn-modal-copy-clipboard')?.addEventListener('click', () => {
      if (ta) {
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textContent).catch(() => {});
      }
      const btn = document.getElementById('btn-modal-copy-clipboard');
      if (btn) btn.innerHTML = `${icon('check', 15)}<span>コピー完了</span>`;
      showToast(toastMsg || 'クリップボードにコピーしました');
    });
  }
  showToast(toastMsg || 'クリップボードにコピーしました');
}

/**
 * Initialize Application
 */
async function initApp() {
  requestPersistentStorage();
  state = await loadAppState();
  const todayStr = toDateStr();
  const createdRec = generateRecurringInstances(state, todayStr);
  const createdPrepRev = syncTimetablePrepReviewTasks(state, todayStr);
  if (createdRec.length > 0 || createdPrepRev.length > 0) {
    saveAppState(state);
  }
  applyTheme(state.userSettings?.theme || 'light');
  bindGlobalEvents();
  renderAll();
}

/**
 * Apply Light / Dark Theme
 */
function applyTheme(theme) {
  if (!state.userSettings) state.userSettings = {};
  state.userSettings.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('btn-theme-toggle');
  if (btn) {
    btn.innerHTML = theme === 'dark'
      ? `${icon('sun', 14)}<span>ライト</span>`
      : `${icon('moon', 14)}<span>ダーク</span>`;
  }
}

/**
 * Save state and trigger full UI update
 */
function commitState() {
  saveAppState(state);
  renderAll();
}

/**
 * Show non-intrusive toast message
 */
function showToast(message) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => {
    el.remove();
  }, 3000);
}

/**
 * Bind top-level static shell event listeners
 */
function bindGlobalEvents() {
  document.querySelectorAll('[data-nav-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.getAttribute('data-nav-tab');
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  const themeBtn = document.getElementById('btn-theme-toggle');
  if (themeBtn) {
    themeBtn.addEventListener('click', () => {
      const next = (state.userSettings?.theme === 'dark') ? 'light' : 'dark';
      applyTheme(next);
      saveAppState(state);
    });
  }

  const quickBackupBtn = document.getElementById('btn-quick-backup');
  if (quickBackupBtn) {
    quickBackupBtn.addEventListener('click', () => {
      state.userSettings.lastBackupDate = toDateStr();
      saveAppState(state);
      exportBackupJson(state);
      showToast('バックアップJSONファイルを保存しました');
    });
  }

  const exportHtmlBtn = document.getElementById('btn-export-index-html');
  if (exportHtmlBtn) {
    exportHtmlBtn.addEventListener('click', () => {
      const clone = document.documentElement.cloneNode(true);
      const mainView = clone.querySelector('#main-view-container');
      if (mainView) mainView.innerHTML = '';
      const subList = clone.querySelector('#sidebar-subject-list');
      if (subList) subList.innerHTML = '';
      const toasts = clone.querySelector('#toast-container');
      if (toasts) toasts.innerHTML = '';
      clone.querySelectorAll('.modal-backdrop').forEach(m => m.classList.add('hidden'));
      const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
      copyTextWithModalFallback(
        'GitHub公開用コード (index.html)',
        'GitHub公開用の全コード（index.html）をコピーしました。GitHubの index.html 編集画面に貼り付けて Commit changes を押してください。',
        htmlContent,
        'GitHub公開用コードをコピーしました'
      );
    });
  }

  const captureInput = document.getElementById('quick-capture-input');
  const captureForm = document.getElementById('quick-capture-form');

  if (captureInput) {
    captureInput.addEventListener('input', () => {
      captureDecomposeOverride = null;
      captureRecurringOverride = null;
      captureRecurringWeekday = null;
      renderCapturePreview();
    });
  }

  if (captureForm) {
    captureForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleQuickCaptureSubmit();
    });
  }

  document.querySelectorAll('[data-example-text]').forEach(pill => {
    pill.addEventListener('click', () => {
      if (!captureInput) return;
      captureInput.value = pill.getAttribute('data-example-text');
      captureDecomposeOverride = null;
      captureRecurringOverride = null;
      captureRecurringWeekday = null;
      renderCapturePreview();
      captureInput.focus();
    });
  });

  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      captureInput?.focus();
    } else if (
      e.key === '/' &&
      document.activeElement &&
      !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)
    ) {
      e.preventDefault();
      captureInput?.focus();
    }
  });

  document.querySelectorAll('[data-close-modal]').forEach(btn => {
    btn.addEventListener('click', () => {
      const modalId = btn.getAttribute('data-close-modal');
      document.getElementById(modalId)?.classList.add('hidden');

  document.getElementById('timer-toggle-btn')?.addEventListener('click', toggleFocusTimer);
  document.getElementById('timer-finish-btn')?.addEventListener('click', () => {

      const stepId = activeTimer.stepId;
      const measuredMins = activeTimer.elapsedSeconds >= 30
        ? Math.max(1, Math.round(activeTimer.elapsedSeconds / 60))
        : null;
      stopFocusTimer();
      openCompleteStepModal(stepId, measuredMins);
    }
  });
  document.getElementById('timer-close-btn')?.addEventListener('click', stopFocusTimer);
}

/**
 * Determine effective recurrence settings for current quick-capture input
 */
function resolveCaptureRecurrence(parsed, todayStr) {
  const isRecurring = captureRecurringOverride !== null
    ? captureRecurringOverride
    : !!parsed.recurrence;

  if (!isRecurring) return null;

  const currentDow = weekdayOf(todayStr);

  let weekday = captureRecurringWeekday;
  if (typeof weekday !== 'number') {
    if (parsed.recurrence && typeof parsed.recurrence.weekday === 'number') {
      weekday = parsed.recurrence.weekday;
    } else if (parsed.deadlineDate) {
      weekday = weekdayOf(parsed.deadlineDate);
    } else {
      const sub = state.subjects.find(s => s.id === parsed.subjectId);
      weekday = typeof sub?.defaultWeekday === 'number' ? sub.defaultWeekday : currentDow;
    }
  }

  let delta = weekday - currentDow;
  if (delta <= 0) delta += 7;
  const firstDeadline = parsed.deadlineDate || addDays(todayStr, delta);

  return { weekday, firstDeadline };
}

/**
 * Render real-time natural language extraction preview under the Quick Capture bar
 */
function renderCapturePreview() {
  const input = document.getElementById('quick-capture-input');
  const previewEl = document.getElementById('quick-capture-preview');
  if (!input || !previewEl) return;

  const raw = input.value.trim();
  if (!raw) {
    previewEl.classList.add('hidden');
    previewEl.innerHTML = '';
    return;
  }

  const todayStr = toDateStr();
  const defaultMins = state.userSettings?.defaultTaskMinutes || 30;
  const parsed = parseNaturalInput(raw, state.subjects, todayStr, defaultMins);
  if (!parsed) return;

  const effectiveDecompose = captureDecomposeOverride !== null
    ? captureDecomposeOverride
    : parsed.shouldDecompose;
  const rec = resolveCaptureRecurrence(parsed, todayStr);

  previewEl.classList.remove('hidden');

  const subjectChip = parsed.subjectId
    ? `<span class="preview-chip matched">
         <span class="subject-dot" style="background:${parsed.subjectColor}"></span>
         科目: ${escapeHtml(parsed.subjectName)}
       </span>`
    : `<span class="preview-chip">科目: 未設定（そのまま登録可）</span>`;

  const deadlineChip = rec
    ? `<span class="preview-chip matched">${icon('calendar', 13)} 初回期限: ${escapeHtml(formatJpDate(rec.firstDeadline, todayStr))}</span>`
    : parsed.deadlineDate
      ? `<span class="preview-chip matched">${icon('calendar', 13)} 期限: ${escapeHtml( parsed.deadlineLabel)}</span>`
      : `<span class="preview-chip">${icon('calendar', 13)} 期限: 未設定（Inbox・空き時間提案へ）</span>`;

  const categoryChip = `<span class="preview-chip matched">${icon(parsed.categoryIconName || 'fileText', 13)} 種類: ${escapeHtml(parsed.categoryLabel)}</span>`;

  const durationChip = `<span class="preview-chip ${parsed.isDurationExplicit ? 'matched' : ''} tabular-nums">
    ${icon('clock', 13)} 推定: 合計${parsed.estimatedMinutes}分${parsed.isDurationExplicit ? '' : '（初期値・完了時に実時間から自動学習）'}
  </span>`;

  const decomposeChip = `<button type="button" id="toggle-capture-decompose" class="preview-chip ${effectiveDecompose ? 'warning' : ''}" style="cursor:pointer;">
    ${icon('layers', 13)} 自動分解: ${effectiveDecompose ? `ON (${parsed.suggestedSteps.length}ステップ)` : 'OFF (単一タスク)'} [切替]
  </button>`;

  const recurringChip = `<button type="button" id="toggle-capture-recurring" class="preview-chip ${rec ? 'matched' : ''}" style="cursor:pointer;">
    ${icon('repeat', 13)} ${rec ? `毎週${WEEKDAY_LABELS[rec.weekday]}曜に繰り返す: ON` : '毎週繰り返す: OFF'} [切替]
  </button>`;

  const weekdaySelector = rec
    ? `<select id="capture-recurring-dow" class="form-select" style="width:auto;padding:0.15rem 0.45rem;font-size:0.75rem;height:auto;">
        ${WEEKDAY_LABELS.map((w, idx) => `<option value="${idx}" ${rec.weekday === idx ? 'selected' : ''}>毎週${w}曜</option>`).join('')}
      </select>`
    : '';

  previewEl.innerHTML = `
    <span style="font-size:0.75rem;color:var(--text-muted);font-weight:600;">自動抽出:</span>
    ${subjectChip}
    ${deadlineChip}
    ${categoryChip}
    ${durationChip}
    ${decomposeChip}
    ${recurringChip}
    ${weekdaySelector}
  `;

  document.getElementById('toggle-capture-decompose')?.addEventListener('click', () => {
    if (!effectiveDecompose && parsed.suggestedSteps.length <= 1) {
      parsed.suggestedSteps = [
        { title: '課題内容・資料の確認', minutes: 10 },
        { title: 'メイン作業・演習', minutes: Math.max(15, parsed.estimatedMinutes - 20) },
        { title: '見直し・完了確認', minutes: 10 }
      ];
    }
    captureDecomposeOverride = !effectiveDecompose;
    renderCapturePreview();
  });

  document.getElementById('toggle-capture-recurring')?.addEventListener('click', () => {
    captureRecurringOverride = !rec;
    renderCapturePreview();
  });

  document.getElementById('capture-recurring-dow')?.addEventListener('change', (e) => {
    captureRecurringWeekday = Number(e.target.value);
    captureRecurringOverride = true;
    renderCapturePreview();
  });
}

/**
 * Handle Quick Capture form submission
 */
function handleQuickCaptureSubmit() {
  const input = document.getElementById('quick-capture-input');
  if (!input || !input.value.trim()) return;

  const todayStr = toDateStr();
  const defaultMins = state.userSettings?.defaultTaskMinutes || 30;
  const parsed = parseNaturalInput(input.value, state.subjects, todayStr, defaultMins);
  if (!parsed) return;

  const effectiveDecompose = captureDecomposeOverride !== null
    ? captureDecomposeOverride
    : parsed.shouldDecompose;
  const rec = resolveCaptureRecurrence(parsed, todayStr);

  let stepDefs = [];
  if (effectiveDecompose && parsed.suggestedSteps.length > 0) {
    stepDefs = parsed.suggestedSteps.map(s => ({ title: s.title, minutes: s.minutes }));
  } else {
    stepDefs = [{ title: parsed.cleanTitle, minutes: parsed.estimatedMinutes }];
  }

  if (rec) {
    const parsedForRule = {
      ...parsed,
      deadlineDate: rec.firstDeadline,
      recurrence: { frequency: 'weekly', weekday: rec.weekday }
    };
    const rule = createRuleFromParsed(state, parsedForRule, stepDefs, todayStr);
    generateRecurringInstances(state, todayStr);

    input.value = '';
    captureDecomposeOverride = null;
    captureRecurringOverride = null;
    captureRecurringWeekday = null;
    renderCapturePreview();

    commitState();
    showToast(`「${rule.title}」を毎週${WEEKDAY_LABELS[rec.weekday]}曜の定期課題として登録しました`);
    return;
  }

  const newTaskId = uid('task');
  const rawSteps = stepDefs.map((s, idx) => ({
    id: uid('step'),
    taskId: newTaskId,
    title: s.title,
    orderIndex: idx + 1,
    estimatedMinutes: s.minutes,
    scheduledDate: null,
    isCompleted: false,
    completedAt: null
  }));

  const scheduledSteps = assignDatesForNewTaskSteps(rawSteps, parsed.deadlineDate, state, todayStr);
  const totalMins = scheduledSteps.reduce((acc, s) => acc + (Number(s.estimatedMinutes) || 30), 0);

  const newTask = {
    id: newTaskId,
    subjectId: parsed.subjectId,
    title: parsed.cleanTitle,
    rawInput: parsed.rawInput,
    category: parsed.category,
    status: parsed.deadlineDate ? 'planned' : 'inbox',
    deadlineDate: parsed.deadlineDate,
    estimatedMinutes: totalMins,
    importance: parsed.importance,
    understandingLevel: null,
    nextReviewDate: null,
    createdAt: todayStr
  };

  state.tasks.unshift(newTask);
  state.taskSteps.push(...scheduledSteps);

  input.value = '';
  captureDecomposeOverride = null;
  captureRecurringOverride = null;
  captureRecurringWeekday = null;
  renderCapturePreview();

  commitState();
  showToast(
    scheduledSteps.length > 1
      ? `「${newTask.title}」を${scheduledSteps.length}ステップに分解して計画しました`
      : `「${newTask.title}」を追加しました`
  );
}

/**
 * Render all navigation badges, sidebar subject list, and active view
 */
function renderAll() {
  const todayStr = toDateStr();
  const dashboardModel = buildDashboardModel(state, todayStr, pocketFilterMins);

  document.querySelectorAll('[data-nav-tab]').forEach(btn => {
    const tab = btn.getAttribute('data-nav-tab');
    btn.classList.toggle('active', tab === currentTab);
  });

  const todayCount = (dashboardModel.topPriorityStep ? 1 : 0) + dashboardModel.otherTodaySteps.length;
  const todayBadge = document.getElementById('nav-badge-today');
  if (todayBadge) todayBadge.textContent = String(todayCount);

  const unconfiguredTasks = state.tasks.filter(
    t => t.status !== 'completed' && (!t.deadlineDate || !t.subjectId)
  );
  const inboxBadge = document.getElementById('nav-badge-inbox');
  if (inboxBadge) {
    inboxBadge.textContent = String(unconfiguredTasks.length);
    inboxBadge.classList.toggle('alert', unconfiguredTasks.length > 0);
  }

  renderSidebarSubjects();

  const container = document.getElementById('main-view-container');
  if (!container) return;

  if (currentTab === 'today') {
    renderTodayDashboard(container, dashboardModel);
  } else if (currentTab === 'plan') {
    renderPlanTimelineView(container, dashboardModel);
  } else if (currentTab === 'inbox') {
    renderInboxTasksView(container);
  } else if (currentTab === 'subjects') {
    renderSubjectsAndLogsView(container);
  }
}

/**
 * Render Sidebar quick subject list
 */
function renderSidebarSubjects() {
  const listEl = document.getElementById('sidebar-subject-list');
  if (!listEl) return;

  listEl.innerHTML = state.subjects
    .map(sub => {
      const activeCount = state.tasks.filter(t => t.subjectId === sub.id && t.status !== 'completed').length;
      const dowLabel = typeof sub.defaultWeekday === 'number' ? WEEKDAY_LABELS[sub.defaultWeekday] : '';
      return `
        <button type="button" class="subject-mini-item" data-jump-subject="${sub.id}">
          <span style="display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
            <span class="subject-dot" style="background:${sub.color}"></span>
            <span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(sub.name)}</span>
          </span>
          <span class="nav-badge tabular-nums">${dowLabel ? `${dowLabel}・` : ''}${activeCount}</span>
        </button>
      `;
    })
    .join('');

  listEl.querySelectorAll('[data-jump-subject]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = 'subjects';
      renderAll();
    });
  });
}

/**
 * Bind events inside Today's Dashboard
 */
function bindDashboardInteractions(container, replanProposal) {
  // AM / PM Condition switcher
  container.querySelectorAll('[data-set-condition-slot]').forEach(btn => {
    btn.addEventListener('click', () => {
      const slot = btn.getAttribute('data-set-condition-slot');
      const val = btn.getAttribute('data-set-condition-val');
      const todayStr = toDateStr();
      if (!state.dailyStates) state.dailyStates = {};
      const current = getDayConditions(todayStr, state);
      const nextAm = slot === 'am' ? val : current.am;
      const nextPm = slot === 'pm' ? val : current.pm;
      state.dailyStates[todayStr] = {
        ...(state.dailyStates[todayStr] || {}),
        date: todayStr,
        condition: slot === 'pm' ? nextPm : nextAm,
        conditionAm: nextAm,
        conditionPm: nextPm
      };
      commitState();
      const slotLabel = slot === 'am' ? '午前 (AM)' : '午後 (PM)';
      showToast(`${slotLabel}のコンディションを「${CONDITION_META[val].label}」に更新しました`);
    });
  });

  container.querySelectorAll('[data-pocket-mins]').forEach(btn => {
    btn.addEventListener('click', () => {
      pocketFilterMins = Number(btn.getAttribute('data-pocket-mins'));
      renderAll();
    });
  });

  document.getElementById('btn-open-replan-modal')?.addEventListener('click', () => {
    openReplanModal(replanProposal);
  });

  container.querySelectorAll('[data-complete-step]').forEach(btn => {
    btn.addEventListener('click', () => {
      const stepId = btn.getAttribute('data-complete-step');
      const step = state.taskSteps.find(s => s.id === stepId);
      if (!step) return;
      if (step.isCompleted) {
        step.isCompleted = false;
        step.completedAt = null;
        const parent = state.tasks.find(t => t.id === step.taskId);
        if (parent && parent.status === 'completed') parent.status = 'in_progress';
        commitState();
      } else {
        openCompleteStepModal(stepId);
      }
    });
  });

  container.querySelectorAll('[data-start-timer]').forEach(btn => {
    btn.addEventListener('click', () => {
      const stepId = btn.getAttribute('data-start-timer');
      startFocusTimerForStep(stepId);
    });
  });

  container.querySelectorAll('[data-open-task]').forEach(el => {
    el.addEventListener('click', () => {
      const taskId = el.getAttribute('data-open-task');
      openTaskDetailModal(taskId);
    });
  });

  container.querySelectorAll('[data-create-review-task]').forEach(btn => {
    btn.addEventListener('click', () => {
      const srcTask = state.tasks.find(t => t.id === btn.getAttribute('data-create-review-task'));
      if (!srcTask) return;
      const todayStr = toDateStr();
      const newTaskId = uid('task');
      const revTask = {
        id: newTaskId,
        subjectId: srcTask.subjectId,
        title: `【復習】${srcTask.title}`,
        rawInput: `復習: ${srcTask.title}`,
        category: 'review',
        status: 'planned',
        deadlineDate: addDays(todayStr, 2),
        estimatedMinutes: 20,
        importance: 2,
        understandingLevel: null,
        nextReviewDate: null,
        createdAt: todayStr
      };
      const revStep = {
        id: uid('step'),
        taskId: newTaskId,
        title: `つまずき箇所の解き直し：${srcTask.title}`,
        orderIndex: 1,
        estimatedMinutes: 20,
        scheduledDate: todayStr,
        isCompleted: false,
        completedAt: null
      };
      srcTask.understandingLevel = 2;
      srcTask.nextReviewDate = null;
      state.tasks.unshift(revTask);
      state.taskSteps.push(revStep);
      commitState();
      showToast('今日の予定に20分の復習ステップを追加しました');
    });
  });
}

/* ==========================================================================
   VIEW 2: 7-Day Schedule & Weekly Gemini Reflection Prompt Generator
   ========================================================================== */
function renderPlanTimelineView(container) {
  const todayStr = toDateStr();
  const taskMap = new Map(state.tasks.map(t => [t.id, t]));
  const subjectMap = new Map(state.subjects.map(s => [s.id, s]));

  const days = [];
  for (let i = 0; i < 7; i++) {
    const dStr = addDays(todayStr, i);
    const cap = getDayEffectiveCapacity(dStr, state);
    const stepsForDay = state.taskSteps
      .filter(s => {
        if (i === 0) {
          return s.scheduledDate === dStr || (!s.isCompleted && s.scheduledDate && diffDays(todayStr, s.scheduledDate) < 0);
        }
        return s.scheduledDate === dStr && !s.isCompleted;
      })
      .map(s => {
        const task = taskMap.get(s.taskId);
        const sub = subjectMap.get(task?.subjectId);
        return {
          ...s,
          taskTitle: task ? task.title : '',
          deadlineLabel: formatJpDate(task?.deadlineDate, todayStr),
          subjectName: sub ? sub.name : '未設定',
          subjectColor: sub ? sub.color : 'hsl(215, 14%, 55%)'
        };
      });

    const totalMins = stepsForDay.reduce((acc, s) => acc + (Number(s.estimatedMinutes) || 30), 0);
    days.push({
      dateStr: dStr,
      label: formatJpDate(dStr, todayStr),
      capacity: cap,
      totalMins,
      steps: stepsForDay
    });
  }

  container.innerHTML = `
    <section class="status-banner">
      <div class="date-greeting">
        <h1>週間スケジュール・AI振り返りプロンプト出力</h1>

        </button>
      </div>
    </section>

    <div class="timeline-grid">
      ${days.map(day => {
        const isOver = day.totalMins > day.capacity;
        const pct = Math.min(100, Math.round((day.totalMins / Math.max(day.capacity, 15)) * 100));
        return `
          <div class="day-bucket-card">
            <div class="day-bucket-header">
              <div style="display:flex;align-items:center;gap:0.65rem;">

              <div style="width:140px;">
                <div class="progress-track" style="height:6px;">
                  <div class="${isOver ? 'progress-fill-overload' : 'progress-fill-planned'}" style="width:${pct}%"></div>
                </div>
              </div>
            </div>

            ${day.steps.length > 0 ? `
              <div class="step-list">
                ${day.steps.map(st => `
                  <div class="step-card ${st.isCompleted ? 'completed' : ''}">
                    <div class="step-card-left">
                      <span class="subject-dot" style="background:${st.subjectColor};margin-top:0.35rem;"></span>
                      <div class="step-info">
                        <div class="step-title-text" style="cursor:pointer;" data-open-task="${st.taskId}">
                          ${escapeHtml(st.title)}
                        </div>
                        <div class="step-submeta">
                          <span>${escapeHtml(st.subjectName)}</span>
                          <span>・親課題: ${escapeHtml(st.taskTitle)}（締切: ${escapeHtml(st.deadlineLabel)}）</span>
                        </div>
                      </div>
                    </div>
                    <div class="step-actions">
                      <span class="duration-tag tabular-nums">${st.estimatedMinutes}分</span>
                      <select class="form-select" style="width:auto;padding:0.2rem 0.45rem;font-size:0.75rem;" data-move-step-date="${st.id}">
                        ${days.map(optDay => `
                          <option value="${optDay.dateStr}" ${optDay.dateStr === day.dateStr ? 'selected' : ''}>
                            ${escapeHtml(optDay.label)}へ移動
                          </option>
                        `).join('')}
                      </select>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : `
              <div style="font-size:0.8rem;color:var(--text-muted);padding:0.25rem 0;">

  document.getElementById('btn-copy-gemini-prompt')?.addEventListener('click', () => {
    const promptText = generateWeeklyGeminiPrompt(state, todayStr);
    copyTextWithModalFallback(
      '今週の振り返り（Gemini用プロンプト）',
      '今週の完了タスク・AM/PMコンディション推移・科目別の見積もりクセ・学習メモを整理したプロンプトをコピーしました。そのままGeminiに貼り付けて送信してください。',

function renderTimetableHtml(todayStr) {
  const currentDow = weekdayOf(todayStr);
  const weekdays = [
    { dow: 1, label: '月曜' },
    { dow: 2, label: '火曜' },
    { dow: 3, label: '水曜' },
    { dow: 4, label: '木曜' },

  const rows = [
    { slot: '1-2', label: '1・2限' },
    { slot: '3-4', label: '3・4限' },
    { slot: '5-6', label: '5・6限' },
    { slot: '7-8', label: '7・8限' }
  ];

  // Track cells covered by a 5-8 (2-row span) course
  const coveredBySpan = new Set();

  const renderCourseCard = (sub) => `
    <div class="tt-card" style="border-left-color:${sub.color};">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.3rem;">
        <div class="tt-course-name" data-edit-subject="${sub.id}">${escapeHtml(sub.name)}</div>

          ${icon('edit', 12)}
        </button>
      </div>
      ${sub.room ? `
        <div class="tt-room-badge">
          ${icon('mapPin', 11)}
          <span>${escapeHtml(sub.room)}</span>
        </div>
      ` : ''}
      <div class="tt-switch-row">
        <button
          type="button"
          class="tt-switch-btn ${sub.autoPrep ? 'on' : ''}"
          data-toggle-prep="${sub.id}"
          title="講義前日に予習タスク（推定${sub.prepMinutes || 20}分）を自動生成"
        >
          <span>予習: ${sub.autoPrep ? 'ON' : 'OFF'}</span>
        </button>
        <button
          type="button"
          class="tt-switch-btn ${sub.autoReview ? 'on' : ''}"
          data-toggle-review="${sub.id}"
          title="講義当日〜翌日に復習タスク（推定${sub.reviewMinutes || 20}分）を自動生成"
        >
          <span>復習: ${sub.autoReview ? 'ON' : 'OFF'}</span>
        </button>
      </div>
    </div>
  `;

  return `
    <div class="timetable-scroll">
      <table class="timetable-table" aria-label="週間時間割">
        <thead>
          <tr>
            <th class="period-col">時限</th>
            ${weekdays.map(w => `
              <th class="${currentDow === w.dow ? 'today-col' : ''}">
                ${w.label}${currentDow === w.dow ? ' (今日)' : ''}
              </th>
            `).join('')}

        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              <td class="period-col tabular-nums">${row.label}</td>
              ${weekdays.map(w => {
                const key = `${w.dow}_${row.slot}`;
                if (coveredBySpan.has(key)) return '';

                // Check for 5-8 span course on 5-6 row
                if (row.slot === '5-6') {
                  const spanSub = state.subjects.find(
                    s => s.defaultWeekday === w.dow && s.periodSlot === '5-8'
                  );
                  if (spanSub) {
                    coveredBySpan.add(`${w.dow}_7-8`);
                    return `<td rowspan="2" style="height:150px;">${renderCourseCard(spanSub)}</td>`;
                  }
                }

                const sub = state.subjects.find(
                  s => s.defaultWeekday === w.dow && s.periodSlot === row.slot
                );
                if (sub) {
                  return `<td>${renderCourseCard(sub)}</td>`;

                return `
                  <td style="vertical-align:middle;text-align:center;">
                    <button
                      type="button"
                      class="btn-secondary"
                      style="font-size:0.68rem;padding:0.2rem 0.45rem;opacity:0.55;"

                      data-add-slot-period="${row.slot}"

                    </button>
                  </td>
                `;
              }).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
