  <style>
/* ==========================================================================
   Smart Study OS - Core Design System & Styles (Vanilla CSS)
    Aesthetic: Calm Academic Precision (Inspired by Things 3, Linear, Kinfolk)
   ========================================================================== */

:root {
  /* Surface & Background Tokens (Light Mode Default) */
  --bg-app: hsl(40, 20%, 97%);
  --bg-sidebar: hsl(40, 18%, 94%);
  --bg-surface: hsl(0, 0%, 100%);
  --bg-surface-hover: hsl(40, 15%, 96%);
  --bg-surface-subtle: hsl(40, 16%, 95%);
  --bg-elevated: hsl(0, 0%, 100%);
  --bg-glass: hsla(40, 20%, 98%, 0.88);

  /* Text Hierarchy */
  --text-primary: hsl(215, 28%, 14%);
  --text-secondary: hsl(215, 16%, 38%);
  --text-muted: hsl(215, 12%, 56%);
  --text-on-accent: hsl(0, 0%, 100%);

  /* Border & Divider Tokens */
  --border-subtle: hsl(40, 14%, 89%);
  --border-default: hsl(215, 14%, 84%);
  --border-strong: hsl(215, 16%, 72%);

  /* Brand & Functional Accent (Deep Teal / Academic Sapphire - No Purple) */
  --accent-primary: hsl(192, 78%, 31%);
  --accent-primary-hover: hsl(192, 82%, 25%);
  --accent-soft: hsl(192, 55%, 93%);
  --accent-soft-text: hsl(192, 85%, 24%);

  /* Semantic Status & Risk Colors */
  --danger-bg: hsl(4, 82%, 95%);
  --danger-text: hsl(4, 74%, 42%);
  --danger-border: hsl(4, 70%, 84%);
  --danger-dot: hsl(4, 76%, 52%);

  --warning-bg: hsl(36, 90%, 94%);
  --warning-text: hsl(32, 84%, 34%);
  --warning-border: hsl(36, 80%, 80%);
  --warning-dot: hsl(35, 90%, 48%);

  --safe-bg: hsl(152, 56%, 94%);
  --safe-text: hsl(154, 68%, 28%);
  --safe-border: hsl(152, 48%, 82%);
  --safe-dot: hsl(152, 64%, 40%);

  --neutral-badge-bg: hsl(215, 16%, 93%);
  --neutral-badge-text: hsl(215, 16%, 40%);

  /* Elevation & Shadows */
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 6px -1px rgba(15, 23, 42, 0.06), 0 1px 3px -1px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 8px 20px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 18px 36px -6px rgba(15, 23, 42, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.06);

  /* Layout & Radii */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-pill: 9999px;

  --sidebar-width: 248px;
  --header-height: 64px;
  --transition-fast: 140ms cubic-bezier(0.22, 1, 0.36, 1);
  --transition-base: 220ms cubic-bezier(0.22, 1, 0.36, 1);

  /* Typography */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
}

/* Dark Theme Tokens (Warm Slate & Teal - Zero Purple) */
[data-theme="dark"] {
  --bg-app: hsl(210, 20%, 10%);
  --bg-sidebar: hsl(210, 22%, 8%);
  --bg-surface: hsl(210, 18%, 14%);
  --bg-surface-hover: hsl(210, 18%, 17%);
  --bg-surface-subtle: hsl(210, 19%, 12%);
  --bg-elevated: hsl(210, 18%, 16%);
  --bg-glass: hsla(210, 20%, 11%, 0.88);

  --text-primary: hsl(40, 15%, 94%);
  --text-secondary: hsl(210, 12%, 70%);
  --text-muted: hsl(210, 10%, 50%);
  --text-on-accent: hsl(210, 22%, 8%);

  --border-subtle: hsl(210, 16%, 19%);
  --border-default: hsl(210, 15%, 24%);
  --border-strong: hsl(210, 14%, 34%);

  --accent-primary: hsl(186, 68%, 50%);
  --accent-primary-hover: hsl(186, 74%, 58%);
  --accent-soft: hsla(186, 68%, 45%, 0.15);
  --accent-soft-text: hsl(186, 72%, 68%);

  --danger-bg: hsla(4, 76%, 54%, 0.15);
  --danger-text: hsl(4, 85%, 74%);
  --danger-border: hsla(4, 76%, 54%, 0.32);
  --danger-dot: hsl(4, 82%, 62%);

  --warning-bg: hsla(36, 88%, 52%, 0.15);
  --warning-text: hsl(38, 92%, 72%);
  --warning-border: hsla(36, 88%, 52%, 0.32);
  --warning-dot: hsl(36, 90%, 58%);

  --safe-bg: hsla(152, 60%, 45%, 0.15);
  --safe-text: hsl(152, 70%, 70%);
  --safe-border: hsla(152, 60%, 45%, 0.32);
  --safe-dot: hsl(152, 65%, 52%);

  --neutral-badge-bg: hsl(210, 16%, 20%);
  --neutral-badge-text: hsl(210, 14%, 74%);

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.32);
  --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.42);
  --shadow-lg: 0 20px 44px rgba(0, 0, 0, 0.58);
}

/* ==========================================================================
   Base Reset & Typography
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  color: var(--text-primary);
  background-color: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color var(--transition-base), color var(--transition-base);
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

a {
  color: var(--accent-primary);
  text-decoration: none;
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
}

/* ==========================================================================
   App Shell Layout (Desktop Sidebar + Mobile Bottom Tab)
   ========================================================================== */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1.25rem 0.875rem;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 30;
}

.brand-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.25rem 0.625rem 1.25rem;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 0.625rem;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  background-color: var(--accent-primary);
  color: var(--text-on-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: -0.03em;
}

.brand-title {
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1.2;
}

.brand-subtitle {
  font-size: 0.72rem;
  color: var(--text-muted);
  display: block;
  font-weight: 500;
}

.nav-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 0.75rem;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 0.9rem;
  transition: background-color var(--transition-fast), color var(--transition-fast);
  text-align: left;
}

.nav-item:hover {
  background-color: var(--bg-surface-hover);
  color: var(--text-primary);
}

.nav-item.active {
  background-color: var(--bg-surface);
  color: var(--text-primary);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}

.nav-item-left {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}

.nav-icon {
  width: 18px;
  height: 18px;
  opacity: 0.85;
  flex-shrink: 0;
}

.nav-badge {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 0.1rem 0.45rem;
  border-radius: var(--radius-pill);
  background-color: var(--neutral-badge-bg);
  color: var(--neutral-badge-text);
}

.nav-badge.alert {
  background-color: var(--danger-bg);
  color: var(--danger-text);
}

.sidebar-footer {
  border-top: 1px solid var(--border-subtle);
  padding-top: 0.875rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.sidebar-section-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 0.5rem 0.75rem 0.25rem;
}

.subject-mini-list {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  max-height: 220px;
  overflow-y: auto;
}

.subject-mini-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.4rem 0.75rem;
  border-radius: var(--radius-sm);
  font-size: 0.83rem;
  color: var(--text-secondary);
  transition: background-color var(--transition-fast);
}

.subject-mini-item:hover {
  background-color: var(--bg-surface-hover);
  color: var(--text-primary);
}

.subject-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 0.5rem;
  flex-shrink: 0;
}

/* ==========================================================================
   Main Content Area & Persistent Quick Capture Bar
   ========================================================================== */
.main-area {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding-bottom: 5rem;
}

.top-capture-sticky {
  position: sticky;
  top: 0;
  z-index: 25;
  background-color: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0.875rem 1.75rem;
}

.capture-container {
  max-width: 960px;
  margin: 0 auto;
}

.capture-box {
  background-color: var(--bg-surface);
  border: 1.5px solid var(--border-default);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 0.5rem 0.65rem 0.5rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.capture-box:focus-within {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-sm);
}

.capture-icon {
  color: var(--accent-primary);
  flex-shrink: 0;
  display: flex;
  align-items: center;
}

.capture-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 0.96rem;
  color: var(--text-primary);
  outline: none;
  min-width: 0;
}

.capture-input::placeholder {
  color: var(--text-muted);
}

.capture-submit-btn {
  background-color: var(--accent-primary);
  color: var(--text-on-accent);
  font-weight: 600;
  font-size: 0.84rem;
  padding: 0.48rem 0.95rem;
  border-radius: var(--radius-md);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  flex-shrink: 0;
  transition: background-color var(--transition-fast), transform 100ms ease;
}

.capture-submit-btn:hover {
  background-color: var(--accent-primary-hover);
}

.capture-submit-btn:active {
  transform: scale(0.98);
}

/* Live NLP Parsing Preview Bar */
.capture-preview {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
  padding-top: 0.55rem;
  font-size: 0.79rem;
}

.capture-preview.hidden {
  display: none;
}

.preview-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-pill);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  color: var(--text-secondary);
  font-weight: 500;
}

.preview-chip.matched {
  background-color: var(--accent-soft);
  border-color: transparent;
  color: var(--accent-soft-text);
  font-weight: 600;
}

.preview-chip.warning {
  background-color: var(--warning-bg);
  border-color: var(--warning-border);
  color: var(--warning-text);
}

.quick-examples-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.45rem;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.quick-examples-row::-webkit-scrollbar {
  display: none;
}

.quick-example-label {
  font-size: 0.73rem;
  color: var(--text-muted);
  white-space: nowrap;
}

.example-pill {
  font-size: 0.73rem;
  color: var(--text-secondary);
  background-color: var(--bg-surface-subtle);
  border: 1px solid var(--border-subtle);
  padding: 0.15rem 0.55rem;
  border-radius: var(--radius-pill);
  white-space: nowrap;
  transition: background-color var(--transition-fast), border-color var(--transition-fast);
}

.example-pill:hover {
  background-color: var(--bg-surface);
  border-color: var(--border-default);
  color: var(--text-primary);
}

/* ==========================================================================
   Page Container & Dashboard Sections
   ========================================================================== */
.page-container {
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  padding: 1.5rem 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}

/* Top Status Header (Date, Condition Selector, Capacity Meter) */
.status-banner {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 1.15rem 1.35rem;
  box-shadow: var(--shadow-xs);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1.25rem;
}

.date-greeting h1 {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.date-greeting p {
  font-size: 0.84rem;
  color: var(--text-secondary);
  margin-top: 0.15rem;
}

.condition-selector-group {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.condition-label {
  font-size: 0.73rem;
  font-weight: 600;
  color: var(--text-muted);
}

.condition-segmented {
  display: inline-flex;
  background-color: var(--bg-surface-subtle);
  padding: 0.2rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.condition-btn {
  padding: 0.35rem 0.75rem;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: all var(--transition-fast);
}

.condition-btn:hover {
  color: var(--text-primary);
}

.condition-btn.active {
  background-color: var(--bg-surface);
  color: var(--text-primary);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}

/* Capacity & Workload Gauge */
.workload-meter-box {
  min-width: 230px;
  flex: 1;
  max-width: 300px;
}

.workload-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 0.8rem;
  margin-bottom: 0.35rem;
}

.workload-title {
  color: var(--text-secondary);
  font-weight: 500;
}

.workload-numbers {
  font-weight: 600;
  color: var(--text-primary);
}

.progress-track {
  height: 8px;
  background-color: var(--bg-surface-subtle);
  border-radius: var(--radius-pill);
  overflow: hidden;
  display: flex;
  border: 1px solid var(--border-subtle);
}

.progress-fill-done {
  background-color: var(--safe-dot);
  height: 100%;
  transition: width var(--transition-base);
}

.progress-fill-planned {
  background-color: var(--accent-primary);
  height: 100%;
  transition: width var(--transition-base);
}

.progress-fill-overload {
  background-color: var(--danger-dot);
  height: 100%;
  transition: width var(--transition-base);
}

.workload-caption {
  font-size: 0.73rem;
  color: var(--text-muted);
  margin-top: 0.3rem;
  display: flex;
  justify-content: space-between;
}

/* Replan Suggestion Callout */
.replan-callout {
  background-color: var(--warning-bg);
  border: 1px solid var(--warning-border);
  color: var(--warning-text);
  border-radius: var(--radius-lg);
  padding: 0.9rem 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.replan-callout-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.replan-callout-title {
  font-weight: 600;
  font-size: 0.9rem;
}

.replan-callout-desc {
  font-size: 0.8rem;
  opacity: 0.9;
}

.btn-replan-preview {
  background-color: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  padding: 0.45rem 0.9rem;
  border-radius: var(--radius-md);
  font-size: 0.82rem;
  font-weight: 600;
  box-shadow: var(--shadow-xs);
  white-space: nowrap;
}

.btn-replan-preview:hover {
  background-color: var(--bg-surface-hover);
}

/* ==========================================================================
   Dashboard Grid & Focus Card
   ========================================================================== */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 1.5rem;
  align-items: start;
}

.section-block {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.section-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 0.45rem;
  letter-spacing: -0.01em;
}

.section-subtitle {
  font-size: 0.78rem;
  color: var(--text-muted);
}

/* Top Priority Hero Card */
.hero-focus-card {
  background-color: var(--bg-surface);
  border: 1.5px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.35rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  position: relative;
}

.hero-focus-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.badge-row {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
}

.subject-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.18rem 0.6rem;
  border-radius: var(--radius-pill);
  font-size: 0.75rem;
  font-weight: 600;
  background-color: var(--bg-surface-subtle);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}

.risk-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.18rem 0.6rem;
  border-radius: var(--radius-pill);
  font-size: 0.74rem;
  font-weight: 600;
}

.risk-badge.danger {
  background-color: var(--danger-bg);
  color: var(--danger-text);
  border: 1px solid var(--danger-border);
}

.risk-badge.warning {
  background-color: var(--warning-bg);
  color: var(--warning-text);
  border: 1px solid var(--warning-border);
}

.risk-badge.safe {
  background-color: var(--safe-bg);
  color: var(--safe-text);
  border: 1px solid var(--safe-border);
}

.risk-badge.none {
  background-color: var(--neutral-badge-bg);
  color: var(--neutral-badge-text);
}

.hero-step-title {
  font-size: 1.18rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.35;
}

.hero-parent-title {
  font-size: 0.84rem;
  color: var(--text-secondary);
  margin-top: 0.2rem;
}

.hero-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
  padding-top: 0.5rem;
  border-top: 1px solid var(--border-subtle);
}

.meta-stat {
  font-size: 0.82rem;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.btn-primary {
  background-color: var(--accent-primary);
  color: var(--text-on-accent);
  padding: 0.5rem 1rem;
  border-radius: var(--radius-md);
  font-size: 0.84rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: background-color var(--transition-fast);
}

.btn-primary:hover {
  background-color: var(--accent-primary-hover);
}

.btn-secondary {
  background-color: var(--bg-surface-subtle);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  padding: 0.48rem 0.9rem;
  border-radius: var(--radius-md);
  font-size: 0.84rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: background-color var(--transition-fast);
}

.btn-secondary:hover {
  background-color: var(--bg-surface-hover);
}

/* ==========================================================================
   Action Step List Cards
   ========================================================================== */
.step-list {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.step-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0.85rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.85rem;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
}

.step-card:hover {
  border-color: var(--border-default);
  box-shadow: var(--shadow-xs);
}

.step-card-left {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  min-width: 0;
  flex: 1;
}

.check-circle {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 0.1rem;
  transition: all var(--transition-fast);
  color: transparent;
}

.check-circle:hover {
  border-color: var(--accent-primary);
  background-color: var(--accent-soft);
}

.check-circle.completed {
  background-color: var(--safe-dot);
  border-color: var(--safe-dot);
  color: #fff;
}

.step-info {
  min-width: 0;
  flex: 1;
  cursor: pointer;
}

.step-title-row {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
}

.step-name {
  font-weight: 600;
  font-size: 0.93rem;
  color: var(--text-primary);
}

.step-card.completed .step-name {
  text-decoration: line-through;
  color: var(--text-muted);
}

.step-parent-label {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 0.15rem;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  flex-wrap: wrap;
}

.step-card-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}

.duration-tag {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.2rem 0.55rem;
  border-radius: var(--radius-sm);
  background-color: var(--bg-surface-subtle);
  color: var(--text-secondary);
  white-space: nowrap;
}

/* Time-Pocket Filter Tabs (15m / 30m / 60m) */
.pocket-tabs {
  display: flex;
  gap: 0.35rem;
  background-color: var(--bg-surface-subtle);
  padding: 0.2rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.pocket-tab {
  flex: 1;
  text-align: center;
  padding: 0.32rem 0.5rem;
  font-size: 0.78rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  transition: all var(--transition-fast);
}

.pocket-tab.active {
  background-color: var(--bg-surface);
  color: var(--accent-primary);
  box-shadow: var(--shadow-xs);
}

/* Deadline Radar List */
.radar-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0.85rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  cursor: pointer;
  transition: border-color var(--transition-fast);
}

.radar-card:hover {
  border-color: var(--border-default);
}

.radar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.radar-title {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
}

.radar-progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* ==========================================================================
   Plan / Schedule Timeline View
   ========================================================================== */
.timeline-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}

.day-bucket-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.day-bucket-card.today {
  border-color: var(--accent-primary);
  box-shadow: var(--shadow-xs);
}

.day-bucket-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border-subtle);
}

.day-bucket-title {
  font-weight: 700;
  font-size: 0.92rem;
}

.day-bucket-cap {
  font-size: 0.76rem;
  color: var(--text-secondary);
}

/* ==========================================================================
   Subjects & Study History View
   ========================================================================== */
.subject-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}

.subject-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 1.15rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
  cursor: pointer;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.subject-card:hover {
  border-color: var(--border-default);
  box-shadow: var(--shadow-sm);
}

.subject-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.subject-name-wrap {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-weight: 700;
  font-size: 1rem;
}

/* ==========================================================================
   Modals, Slide-Over Detail Drawer & Focus Timer Overlay
   ========================================================================== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(3px);
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal-backdrop.hidden {
  display: none;
}

.modal-panel {
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  max-width: 640px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border-subtle);
}

.modal-title {
  font-size: 1.1rem;
  font-weight: 700;
}

.close-btn {
  padding: 0.35rem;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
}

.close-btn:hover {
  background-color: var(--bg-surface-hover);
  color: var(--text-primary);
}

/* Form Controls */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.85rem;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.form-field.full {
  grid-column: 1 / -1;
}

.form-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.form-input, .form-select, .form-textarea {
  background-color: var(--bg-surface-subtle);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: 0.5rem 0.75rem;
  font-size: 0.88rem;
  color: var(--text-primary);
  outline: none;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent-primary);
  background-color: var(--bg-surface);
}

/* Understanding Rating Popover / Modal */
.rating-group {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.6rem;
}

.rating-btn {
  border: 1.5px solid var(--border-default);
  background-color: var(--bg-surface);
  border-radius: var(--radius-md);
  padding: 0.75rem 0.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  transition: all var(--transition-fast);
}

.rating-btn:hover {
  border-color: var(--accent-primary);
  background-color: var(--accent-soft);
}

.rating-emoji {
  font-size: 1.3rem;
}

.rating-title {
  font-size: 0.82rem;
  font-weight: 700;
}

.rating-sub {
  font-size: 0.7rem;
  color: var(--text-muted);
}

/* Diff Comparison Table in Replan Modal */
.diff-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-height: 300px;
  overflow-y: auto;
}

.diff-row {
  background-color: var(--bg-surface-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0.65rem 0.85rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  font-size: 0.84rem;
}

.diff-dates {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 600;
  white-space: nowrap;
}

.diff-old {
  color: var(--text-muted);
  text-decoration: line-through;
}

.diff-new {
  color: var(--accent-primary);
  background-color: var(--accent-soft);
  padding: 0.15rem 0.5rem;
  border-radius: var(--radius-sm);
}

/* Active Timer Floating Pill */
.timer-floating-bar {
  position: fixed;
  bottom: 1.25rem;
  right: 1.5rem;
  z-index: 50;
  background-color: var(--text-primary);
  color: var(--bg-surface);
  padding: 0.75rem 1.15rem;
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 0.9rem;
}

.timer-floating-bar.hidden {
  display: none;
}

.timer-clock {
  font-size: 1.1rem;
  font-weight: 700;
}

/* Monochrome SVG Icon alignment */
.svg-icon {
  display: inline-block;
  vertical-align: -0.18em;
  flex-shrink: 0;
}

/* AM / PM 2-Stage Condition Selector */
.condition-ampm-wrap {
  display: flex;
  gap: 0.65rem;
  flex-wrap: wrap;
}

.condition-half-box {
  background-color: var(--bg-surface-subtle);
  border: 1.5px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0.5rem 0.65rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast);
}

.condition-half-box.active-half {
  background-color: var(--bg-surface);
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.condition-half-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.condition-half-box.active-half .condition-half-header {
  color: var(--accent-primary);
}

.active-half-pill {
  font-size: 0.65rem;
  padding: 0.08rem 0.42rem;
  border-radius: var(--radius-pill);
  background-color: var(--accent-soft);
  color: var(--accent-primary);
  font-weight: 700;
}

/* Weekly Timetable Matrix */
.timetable-scroll {
  overflow-x: auto;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
}

.timetable-table {
  width: 100%;
  min-width: 720px;
  border-collapse: collapse;
  table-layout: fixed;
}

.timetable-table th,
.timetable-table td {
  border: 1px solid var(--border-subtle);
  padding: 0.5rem;
  vertical-align: top;
}

.timetable-table thead th {
  background-color: var(--bg-surface-subtle);
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-secondary);
  text-align: center;
  padding: 0.55rem 0.4rem;
}

.timetable-table thead th.today-col {
  color: var(--accent-primary);
  background-color: var(--accent-soft);
}

.timetable-table .period-col {
  width: 76px;
  background-color: var(--bg-surface-subtle);
  text-align: center;
  vertical-align: middle;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-secondary);
}

.tt-card {
  background-color: var(--bg-surface-subtle);
  border: 1px solid var(--border-subtle);
  border-left: 3.5px solid var(--accent-primary);
  border-radius: var(--radius-sm);

/**
 * Date helper utilities (Local Timezone YYYY-MM-DD)
 */
function toDateStr(dateObj = new Date()) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function addDays(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return toDateStr(dt);
}
function diffDays(fromDateStr, toDateStr) {
  if (!fromDateStr || !toDateStr) return null;
  const [fy, fm, fd] = fromDateStr.split('-').map(Number);
  const [ty, tm, td] = toDateStr.split('-').map(Number);
  const f = new Date(fy, fm - 1, fd);
  const t = new Date(ty, tm - 1, td);
  return Math.round((t - f) / (1000 * 60 * 60 * 24));
}
function formatJpDate(dateStr, todayStr = toDateStr()) {
  if (!dateStr) return '期限未設定';
  const diff = diffDays(todayStr, dateStr);
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  const w = weekdays[dt.getDay()];

  if (diff === 0) return `今日 (${m}/${d} ${w})`;
  if (diff === 1) return `明日 (${m}/${d} ${w})`;
  if (diff === -1) return `昨日 (${m}/${d} ${w})`;
  if (diff > 1 && diff <= 7) return `${m}/${d}(${w})・あと${diff}日`;
  if (diff < -1) return `${m}/${d}(${w})・${Math.abs(diff)}日超過`;
  return `${m}/${d}(${w})`;
}
function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}

/**
 * Migrate and normalize loaded state so existing localStorage data remains 100% compatible
 */
function normalizeState(data) {
  const defaults = getDefaultTimetableSubjects();
  const defaultMap = new Map(defaults.map(s => [s.id, s]));

  // Map legacy generic subject IDs to new timetable subject IDs
  const legacyIdMap = {
    sub_circuits: 'sub_elc2',
    sub_em: 'sub_em2b',
    sub_exp: 'sub_exp1',
    sub_thermo: 'sub_thermo'
  };

  const rawSubjects = Array.isArray(data.subjects) ? data.subjects : [];
  const rawTasks = Array.isArray(data.tasks) ? data.tasks : [];
  const rawRules = Array.isArray(data.recurringRules) ? data.recurringRules : [];
  const rawLogs = Array.isArray(data.studyLogs) ? data.studyLogs : [];

  // Remap legacy subject IDs on tasks, recurringRules, studyLogs if those legacy IDs were used
  rawTasks.forEach(t => {
    if (t.subjectId && legacyIdMap[t.subjectId]) t.subjectId = legacyIdMap[t.subjectId];
  });
  rawRules.forEach(r => {
    if (r.subjectId && legacyIdMap[r.subjectId]) r.subjectId = legacyIdMap[r.subjectId];
  });
  rawLogs.forEach(l => {
    if (l.subjectId && legacyIdMap[l.subjectId]) l.subjectId = legacyIdMap[l.subjectId];
  });

  // Build merged subject list: start with all 11 default timetable courses, preserving user edits
  const existingById = new Map();
  const customSubjects = [];

  for (const s of rawSubjects) {
    const mappedId = legacyIdMap[s.id] || s.id;
    if (defaultMap.has(mappedId)) {
      const def = defaultMap.get(mappedId);
      existingById.set(mappedId, {
        ...def,
        ...s,
        id: mappedId,
        // Upgrade legacy generic name to full course name if it was untouched legacy seed
        name: ['sub_circuits', 'sub_em', 'sub_exp'].includes(s.id) ? def.name : (s.name || def.name),
        aliases: Array.from(new Set([...(def.aliases || []), ...(s.aliases || [])])),
        defaultWeekday: typeof s.defaultWeekday === 'number' ? s.defaultWeekday : def.defaultWeekday,
        periodSlot: s.periodSlot || def.periodSlot,
        room: s.room !== undefined ? s.room : def.room,
        autoPrep: !!s.autoPrep,
        autoReview: !!s.autoReview,
        prepMinutes: Number(s.prepMinutes) || 20,
        reviewMinutes: Number(s.reviewMinutes) || 20,
        memoLogs: Array.isArray(s.memoLogs) ? s.memoLogs : []
      });
    } else if (s.id === 'sub_eng') {
      // Only keep legacy 'sub_eng' if user has tasks/logs referencing it
      const hasRef = rawTasks.some(t => t.subjectId === 'sub_eng') || rawRules.some(r => r.subjectId === 'sub_eng');
      if (hasRef) {
        customSubjects.push({
          ...s,
          periodSlot: s.periodSlot || '',
          room: s.room || '',
          autoPrep: !!s.autoPrep,
          autoReview: !!s.autoReview,
          prepMinutes: Number(s.prepMinutes) || 20,
          reviewMinutes: Number(s.reviewMinutes) || 20,
          memoLogs: Array.isArray(s.memoLogs) ? s.memoLogs : []
        });
      }
    } else {
      customSubjects.push({
        ...s,
        periodSlot: s.periodSlot || '',
        room: s.room || '',
        autoPrep: !!s.autoPrep,
        autoReview: !!s.autoReview,
        prepMinutes: Number(s.prepMinutes) || 20,
        reviewMinutes: Number(s.reviewMinutes) || 20,
        memoLogs: Array.isArray(s.memoLogs) ? s.memoLogs : []
      });
    }
  }

  // If rawSubjects Already had v3 subjects (and maybe user deleted one intentionally), respect user's v3 list
  let finalSubjects;
  if (data.version >= 3 && rawSubjects.length > 0) {
    finalSubjects = rawSubjects.map(s => ({
      ...s,
      aliases: Array.isArray(s.aliases) ? s.aliases : [s.name],
      periodSlot: s.periodSlot || '',
      room: s.room || '',
      autoPrep: !!s.autoPrep,
      autoReview: !!s.autoReview,
      prepMinutes: Number(s.prepMinutes) || 20,
      reviewMinutes: Number(s.reviewMinutes) || 20,
      memoLogs: Array.isArray(s.memoLogs) ? s.memoLogs : []
    }));
  } else {
    finalSubjects = [
      ...defaults.map(def => existingById.get(def.id) || def),
      ...customSubjects
    ];
  }

  // Normalize dailyStates with AM/PM conditions
  const rawDaily = data.dailyStates || {};
  const normalizedDaily = {};
  for (const [dt, entry] of Object.entries(rawDaily)) {
    const fallback = entry?.condition || 'normal';
    normalizedDaily[dt] = {
      ...entry,
      date: dt,
      condition: fallback,
      conditionAm: entry?.conditionAm || fallback,
      conditionPm: entry?.conditionPm || fallback
    };
  }

  return {
    version: 3,
    subjects: finalSubjects,
    tasks: rawTasks,
    taskSteps: Array.isArray(data.taskSteps) ? data.taskSteps : [],
    studyLogs: rawLogs,
    dailyStates: normalizedDaily,
    userSettings: data.userSettings || createSeedData().userSettings,
    recurringRules: rawRules
  };
}

/**
 * Request persistent storage in browser so OS doesn't evict local DB
 */
async function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    try {
      return await navigator.storage.persist();
    } catch {
      return false;
    }
  }
  return false;
}

/**
 * IndexedDB helper for durable asynchronous storage
 */
function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error('IndexedDB not supported'));
      return;
    }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveToIDB(state) {
  try {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(state, 'root');
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    return false;
  }
}

async function loadFromIDB() {
  try {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get('root');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch {
    return null;
  }
}

/**
 * Load application state from LocalStorage or IndexedDB, migrating legacy keys seamlessly
 */
async function loadAppState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      for (const legacyKey of LEGACY_KEYS) {
        const candidate = localStorage.getItem(legacyKey);
        if (candidate) {
          raw = candidate;
          break;
        }
      }
    }
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.tasks) && Array.isArray(parsed.subjects)) {
        const normalized = normalizeState(parsed);
        saveAppState(normalized);
        return normalized;
      }
    }
  } catch (e) {
    console.warn('LocalStorage read failed, trying IndexedDB...', e);
  }

  const idbData = await loadFromIDB();
  if (idbData && Array.isArray(idbData.tasks) && Array.isArray(idbData.subjects)) {
    const normalized = normalizeState(idbData);
    saveAppState(normalized);
    return normalized;
  }

  const seed = createSeedData();
  saveAppState(seed);
  return seed;
}

/**
 * Save application state to both LocalStorage and IndexedDB
 */
function saveAppState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('LocalStorage save error:', e);
  }
  saveToIDB(state);
}

/**
 * Export full database as a downloadable JSON file
 */
function exportBackupJson(state) {
  const payload = {
    ...state,
    exportedAt: new Date().toISOString(),
    app: 'SmartStudyOS'
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateLabel = toDateStr();
  a.href = url;
  a.download = `smart-study-os-backup-${dateLabel}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  return jsonStr;
}

/**
 * Validate and parse an imported JSON backup string
 */
function parseAndValidateBackup(jsonString) {
  let data;
  try {
    data = JSON.parse(jsonString);
  } catch {
    throw new Error('JSONファイルの形式が正しくありません。');
  }

  if (!data || !Array.isArray(data.subjects) || !Array.isArray(data.tasks) || !Array.isArray(data.taskSteps)) {
    throw new Error('Smart Study OS のバックアップデータ形式ではありません。');
  }

  return normalizeState(data);
}

/**
 * Smart Study OS - Natural Language Task Parser & Decomposition Engine (parser.js)
 * Extracts Subject, Deadline, Category, Estimated Duration, and Breakdown Steps
 * without forcing guesses when information is omitted.
 */
const CATEGORY_META = {
  report: { label: 'レポート', iconName: 'fileText', defaultImportance: 3, defaultMinutes: 120 },
  quiz: { label: '小テスト', iconName: 'edit', defaultImportance: 2, defaultMinutes: 60 },

  self_study: { label: '自主学習', iconName: 'clock', defaultImportance: 1, defaultMinutes: 30 }
};

/**
 * Decomposition Templates by Category / Pattern
 * Small tasks (< 45 mins) are NOT decomposed unnecessarily.
 */
const DECOMPOSITION_TEMPLATES = {
  report: [
    { title: '課題要件・テーマの確認', minutes: 15 },
    { title: '実験データ・参考資料の整理', minutes: 25 },
    { title: '計算・グラフ・図表の作成', minutes: 30 },
    { title: '考察・本文の執筆', minutes: 35 },

  ],
  experiment_org: [

    { title: 'グラフ作成・有効数字の計算確認', minutes: 15 }
  ],
  quiz: [
    { title: '出題範囲の講義ノート・公式確認', minutes: 20 },
    { title: '例題・演習問題の解き直し', minutes: 25 },
    { title: '重要ポイントの最終チェック', minutes: 15 }
  ],
  exam: [
