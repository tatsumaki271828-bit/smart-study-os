  <style>
/* ==========================================================================
   Smart Study OS - Core Design System & Styles (Vanilla CSS)
    Aesthetic: Calm Academic Precision (Inspired by Things 3, Linear, Kinfolk)
   ========================================================================== */

:root {
  /* Surface & Background Tokens (Light Mode Default) */
  --bg-app: hsl(40, 20%, 97%);
  --bg-sidebar: hsl(40, 18%, 94%);
  --bg-surface: hsl(0, 0%, 100%);
  --bg-surface-hover: hsl(40, 15%, 96%);
  --bg-surface-subtle: hsl(40, 16%, 95%);
  --bg-elevated: hsl(0, 0%, 100%);
  --bg-glass: hsla(40, 20%, 98%, 0.88);

  /* Text Hierarchy */
  --text-primary: hsl(215, 28%, 14%);
  --text-secondary: hsl(215, 16%, 38%);
  --text-muted: hsl(215, 12%, 56%);
  --text-on-accent: hsl(0, 0%, 100%);

  /* Border & Divider Tokens */
  --border-subtle: hsl(40, 14%, 89%);
  --border-default: hsl(215, 14%, 84%);
  --border-strong: hsl(215, 16%, 72%);

  /* Brand & Functional Accent (Deep Teal / Academic Sapphire - No Purple) */
  --accent-primary: hsl(192, 78%, 31%);
  --accent-primary-hover: hsl(192, 82%, 25%);
  --accent-soft: hsl(192, 55%, 93%);
  --accent-soft-text: hsl(192, 85%, 24%);

  /* Semantic Status & Risk Colors */
  --danger-bg: hsl(4, 82%, 95%);
  --danger-text: hsl(4, 74%, 42%);
  --danger-border: hsl(4, 70%, 84%);
  --danger-dot: hsl(4, 76%, 52%);

  --warning-bg: hsl(36, 90%, 94%);
  --warning-text: hsl(32, 84%, 34%);
  --warning-border: hsl(36, 80%, 80%);
  --warning-dot: hsl(35, 90%, 48%);

  --safe-bg: hsl(152, 56%, 94%);
  --safe-text: hsl(154, 68%, 28%);
  --safe-border: hsl(152, 48%, 82%);
  --safe-dot: hsl(152, 64%, 40%);

  --neutral-badge-bg: hsl(215, 16%, 93%);
  --neutral-badge-text: hsl(215, 16%, 40%);

  /* Elevation & Shadows */
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 6px -1px rgba(15, 23, 42, 0.06), 0 1px 3px -1px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 8px 20px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 18px 36px -6px rgba(15, 23, 42, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.06);

  /* Layout & Radii */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-pill: 9999px;

  --sidebar-width: 248px;
  --header-height: 64px;
  --transition-fast: 140ms cubic-bezier(0.22, 1, 0.36, 1);
  --transition-base: 220ms cubic-bezier(0.22, 1, 0.36, 1);

  /* Typography */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
}

/* Dark Theme Tokens (Warm Slate & Teal - Zero Purple) */
[data-theme="dark"] {
  --bg-app: hsl(210, 20%, 10%);
  --bg-sidebar: hsl(210, 22%, 8%);
  --bg-surface: hsl(210, 18%, 14%);
  --bg-surface-hover: hsl(210, 18%, 17%);
  --bg-surface-subtle: hsl(210, 19%, 12%);
  --bg-elevated: hsl(210, 18%, 16%);
  --bg-glass: hsla(210, 20%, 11%, 0.88);

  --text-primary: hsl(40, 15%, 94%);
  --text-secondary: hsl(210, 12%, 70%);
  --text-muted: hsl(210, 10%, 50%);
  --text-on-accent: hsl(210, 22%, 8%);

  --border-subtle: hsl(210, 16%, 19%);
  --border-default: hsl(210, 15%, 24%);
  --border-strong: hsl(210, 14%, 34%);

  --accent-primary: hsl(186, 68%, 50%);
  --accent-primary-hover: hsl(186, 74%, 58%);
  --accent-soft: hsla(186, 68%, 45%, 0.15);
  --accent-soft-text: hsl(186, 72%, 68%);

  --danger-bg: hsla(4, 76%, 54%, 0.15);
  --danger-text: hsl(4, 85%, 74%);
  --danger-border: hsla(4, 76%, 54%, 0.32);
  --danger-dot: hsl(4, 82%, 62%);

  --warning-bg: hsla(36, 88%, 52%, 0.15);
  --warning-text: hsl(38, 92%, 72%);
  --warning-border: hsla(36, 88%, 52%, 0.32);
  --warning-dot: hsl(36, 90%, 58%);

  --safe-bg: hsla(152, 60%, 45%, 0.15);
  --safe-text: hsl(152, 70%, 70%);
  --safe-border: hsla(152, 60%, 45%, 0.32);
  --safe-dot: hsl(152, 65%, 52%);

  --neutral-badge-bg: hsl(210, 16%, 20%);
  --neutral-badge-text: hsl(210, 14%, 74%);

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.32);
  --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.42);
  --shadow-lg: 0 20px 44px rgba(0, 0, 0, 0.58);
}

/* ==========================================================================
   Base Reset & Typography
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  color: var(--text-primary);
  background-color: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color var(--transition-base), color var(--transition-base);
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

a {
  color: var(--accent-primary);
  text-decoration: none;
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
  font-family: var(--font-mono);
}

/* ==========================================================================
   App Shell Layout (Desktop Sidebar + Mobile Bottom Tab)
   ========================================================================== */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1.25rem 0.875rem;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 30;
}

.brand-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.25rem 0.625rem 1.25rem;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 0.625rem;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  background-color: var(--accent-primary);
  color: var(--text-on-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: -0.03em;
}

.brand-title {
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1.2;
}

.brand-subtitle {
  font-size: 0.72rem;
  color: var(--text-muted);
  display: block;
  font-weight: 500;
}

.nav-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 0.75rem;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 0.9rem;
  transition: background-color var(--transition-fast), color var(--transition-fast);
  text-align: left;
}

.nav-item:hover {
  background-color: var(--bg-surface-hover);
  color: var(--text-primary);
}

.nav-item.active {
  background-color: var(--bg-surface);
  color: var(--text-primary);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}

.nav-item-left {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}

.nav-icon {
  width: 18px;
  height: 18px;
  opacity: 0.85;
  flex-shrink: 0;
}

.nav-badge {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 0.1rem 0.45rem;
  border-radius: var(--radius-pill);
  background-color: var(--neutral-badge-bg);
  color: var(--neutral-badge-text);
}

.nav-badge.alert {
  background-color: var(--danger-bg);
  color: var(--danger-text);
}

.sidebar-footer {
  border-top: 1px solid var(--border-subtle);
  padding-top: 0.875rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.sidebar-section-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 0.5rem 0.75rem 0.25rem;
}

.subject-mini-list {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  max-height: 220px;
  overflow-y: auto;
}

.subject-mini-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.4rem 0.75rem;
  border-radius: var(--radius-sm);
  font-size: 0.83rem;

.toast-container {
  position: fixed;
  bottom: 1.25rem;
  left: 50%;

  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}

.toast-undo-btn:active {

}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }

/**

 * Dual persistence (LocalStorage + IndexedDB) with 1-click JSON Backup & Restore,
 * Legacy Subject Unification, TaskType Normalization, and Timetable Metadata.
 */

const STORAGE_KEY = 'smart_study_os_v3_clean';
const LEGACY_KEYS = ['smart_study_os_v2_state', 'smart_study_os_v1_state'];
const IDB_NAME = 'SmartStudyOS_DB_v3';
const IDB_STORE = 'app_state';
const PERIOD_SLOTS = [
  { id: '1-2', label: '1・2限', short: '1-2限' },

];

/**
 * Date helper utilities (Local Timezone YYYY-MM-DD)
 */
function toDateStr(dateObj = new Date()) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function addDays(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return toDateStr(dt);
}
function diffDays(fromDateStr, toDateStr) {
  if (!fromDateStr || !toDateStr) return null;
  const [fy, fm, fd] = fromDateStr.split('-').map(Number);
  const [ty, tm, td] = toDateStr.split('-').map(Number);
  const f = new Date(fy, fm - 1, fd);
  const t = new Date(ty, tm - 1, td);
  return Math.round((t - f) / (1000 * 60 * 60 * 24));
}
function formatJpDate(dateStr, todayStr = toDateStr()) {
  if (!dateStr) return '期限未設定';
  const diff = diffDays(todayStr, dateStr);
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  const w = weekdays[dt.getDay()];

  if (diff === 0) return `今日 (${m}/${d} ${w})`;
  if (diff === 1) return `明日 (${m}/${d} ${w})`;
  if (diff === -1) return `昨日 (${m}/${d} ${w})`;
  if (diff > 1 && diff <= 7) return `${m}/${d}(${w})・あと${diff}日`;
  if (diff < -1) return `${m}/${d}(${w})・${Math.abs(diff)}日超過`;
  return `${m}/${d}(${w})`;
}
function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}

const SUBJECT_COLOR_PALETTE = [
  'hsl(195, 82%, 35%)',
  'hsl(152, 65%, 34%)',
  'hsl(220, 72%, 46%)',
  'hsl(182, 76%, 33%)',
  'hsl(258, 62%, 50%)',
  'hsl(335, 72%, 46%)',
  'hsl(168, 70%, 34%)',
  'hsl(38, 86%, 44%)',
  'hsl(232, 68%, 50%)',
  'hsl(24, 84%, 46%)',
  'hsl(4, 74%, 50%)'
];

/**
 * Check whether a subject is an Experiment course (科目名に「実験」を含む授業)
 */
function isExperimentSubject(subOrName) {
  if (!subOrName) return false;
  if (typeof subOrName === 'string') {
    return /実験/.test(subOrName);
  }
  return /実験/.test(subOrName.name || '');
}

/**
 * Check whether a subject is a 1st/2nd period early-morning course (1・2限科目)
 */
function isEarlyMorningSubject(sub) {
  if (!sub) return false;
  return sub.periodSlot === '1-2';
}

/**
 * Default subjects template (Empty by default; users load their own timetable via JSON or UI)
 */
function getDefaultTimetableSubjects() {
  return [];
}

/**
 * Expand Roman/Arabic numeral variations automatically for subject aliases
 */
function expandNumeralAliases(name) {
  if (!name || typeof name !== 'string') return [];
  const romanPairs = [
    ['Ⅰ', '1', 'I'],
    ['Ⅱ', '2', 'II'],
    ['Ⅲ', '3', 'III'],
    ['Ⅳ', '4', 'IV'],
    ['Ⅴ', '5', 'V']
  ];
  const variants = new Set([name]);
  for (const [roman, arabic, ascii] of romanPairs) {
    if (name.includes(roman)) {
      variants.add(name.replaceAll(roman, arabic));
      variants.add(name.replaceAll(roman, ascii));
      variants.add(name.replaceAll(roman, '').trim());
    }
  }
  return Array.from(variants).filter(Boolean);
}

/**
 * Normalize a subject entry from JSON or UI
 */
function normalizeSubjectEntry(rawSub, index = 0, existingSub = null) {
  if (!rawSub || typeof rawSub !== 'object') return null;
  const name = String(rawSub.name || existingSub?.name || '').trim();
  if (!name) return null;

  const weekdayMap = { '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6 };
  let defaultWeekday = existingSub?.defaultWeekday ?? null;
  if (typeof rawSub.defaultWeekday === 'number') {
    defaultWeekday = rawSub.defaultWeekday;
  } else if (typeof rawSub.weekday === 'number') {
    defaultWeekday = rawSub.weekday;
  } else if (typeof rawSub.weekday === 'string' && rawSub.weekday.trim()) {
    const cleanW = rawSub.weekday.trim().replace(/曜日|曜/g, '');
    if (weekdayMap[cleanW] !== undefined) {
      defaultWeekday = weekdayMap[cleanW];
    } else if (!Number.isNaN(Number(cleanW))) {
      defaultWeekday = Number(cleanW);
    }
  }

  let periodSlot = rawSub.periodSlot ?? rawSub.period ?? existingSub?.periodSlot ?? '';
  if (typeof periodSlot === 'string') {
    periodSlot = periodSlot
      .trim()
      .replace(/限/g, '')
      .replace(/[・〜~]/g, '-');
  }

  const isExp = isExperimentSubject(name);
  const rawAliases = Array.isArray(rawSub.aliases)
    ? rawSub.aliases
    : typeof rawSub.aliases === 'string'
      ? rawSub.aliases.split(',').map(s => s.trim()).filter(Boolean)
      : [];
  const existingAliases = Array.isArray(existingSub?.aliases) ? existingSub.aliases : [];
  const aliases = Array.from(
    new Set([
      name,
      ...expandNumeralAliases(name),
      ...rawAliases,
      ...existingAliases
    ])
  ).filter(Boolean);

  const mergedMemos = [
    ...(Array.isArray(existingSub?.memoLogs) ? existingSub.memoLogs : []),
    ...(Array.isArray(rawSub.memoLogs) ? rawSub.memoLogs : [])
  ];
  const seenMemoIds = new Set();
  const uniqueMemos = mergedMemos.filter(m => {
    if (!m || !m.text) return false;
    const key = m.id || `${m.date}_${m.text}`;
    if (seenMemoIds.has(key)) return false;
    seenMemoIds.add(key);
    return true;
  });

  return {
    id: rawSub.id || existingSub?.id || uid('sub'),
    name,
    aliases,
    color: rawSub.color || existingSub?.color || SUBJECT_COLOR_PALETTE[index % SUBJECT_COLOR_PALETTE.length],
    defaultWeekday: typeof defaultWeekday === 'number' ? defaultWeekday : null,
    periodSlot: periodSlot || '',
    room: rawSub.room !== undefined ? String(rawSub.room) : (existingSub?.room || ''),
    autoPrep: isExp ? false : Boolean(rawSub.autoPrep ?? existingSub?.autoPrep ?? false),
    autoReview: isExp ? false : Boolean(rawSub.autoReview ?? existingSub?.autoReview ?? false),
    prepMinutes: Number(rawSub.prepMinutes ?? existingSub?.prepMinutes) || 20,
    reviewMinutes: Number(rawSub.reviewMinutes ?? existingSub?.reviewMinutes) || 20,
    syllabusNote: rawSub.syllabusNote ?? existingSub?.syllabusNote ?? '',
    weakPointsNote: rawSub.weakPointsNote ?? existingSub?.weakPointsNote ?? '',
    memoLogs: uniqueMemos
  };
}

/**
 * Match a subject from natural text by checking longest aliases first across all subjects
 */
function matchSubjectFromText(text, subjects = []) {
  if (!text || !Array.isArray(subjects) || subjects.length === 0) return null;
  const pairs = [];
  for (const sub of subjects) {
    const candidates = Array.from(new Set([sub.name, ...(sub.aliases || [])])).filter(Boolean);
    for (const alias of candidates) {
      pairs.push({ alias, sub });
    }
  }
  // Longer aliases take strict priority
  pairs.sort((a, b) => b.alias.length - a.alias.length);
  for (const pair of pairs) {
    if (text.includes(pair.alias)) {
      return pair.sub;
    }
  }
  return null;
}

/**
 * Dynamically upgrade legacy course names in task/step/rule titles using loaded subjects' aliases
 */
function upgradeLegacyCourseText(str, subjects = []) {
  if (!str || typeof str !== 'string' || !Array.isArray(subjects) || subjects.length === 0) {
    return str;
  }
  let out = str;
  for (const sub of subjects) {
    if (!sub?.name || out.includes(sub.name)) continue;
    const aliases = (sub.aliases || [])
      .filter(a => a && a !== sub.name && a.length >= 3 && !sub.name.startsWith(a))
      .sort((a, b) => b.length - a.length);
    for (const alias of aliases) {
      if (out.includes(alias)) {
        out = out.replaceAll(alias, sub.name);
        break;
      }
    }
  }
  return out;
}

/**
 * Infer taskType from task/rule/log properties and subject
 */
function inferTaskTypeForItem(item, sub) {
  const isExp = isExperimentSubject(sub) || /実験/.test(item?.title || '') || /実験/.test(item?.rawInput || '');
  const text = `${item?.title || ''} ${item?.rawInput || ''}`;

  if (isExp) {
    if (item?.taskType && ['レポート', '小レポート', 'その他'].includes(item.taskType)) {
      return item.taskType;
    }
    if (/小レポート|小レポ|予習レポ/.test(text)) return '小レポート';
    if (/レポート|本レポ/.test(text)) return 'レポート';
    if (item?.taskType === 'その他') return 'その他';
    return 'レポート';
  }

  if (item?.taskType && ['小テスト', '課題', 'レポート', 'テスト', '予習・復習'].includes(item.taskType)) {
    return item.taskType;
  }
  if (item?.isPrepReview || item?.category === 'prep' || item?.category === 'review' || /【予習】|【復習】|予習|復習/.test(text)) {
    return '予習・復習';
  }
  if (/小テスト|確認テスト|ミニテスト|クイズ/.test(text) || item?.category === 'quiz') {
    return '小テスト';
  }
  if (/レポート|レポ|報告書/.test(text) || item?.category === 'report') {
    return 'レポート';
  }
  if (/テスト|試験|中間|期末/.test(text) || item?.category === 'exam') {
    return 'テスト';
  }
  return '課題';
}

/**
 * Generate initial clean empty template state (no hardcoded timetable courses)
 */
function createSeedData(todayStr = toDateStr()) {
  const subjects = getDefaultTimetableSubjects();

  const dailyStates = {
    [todayStr]: {
      date: todayStr,
      condition: 'normal',
      conditionAm: 'normal',
      conditionPm: 'normal',
      customAvailableMinutes: null
    }
  };

  const userSettings = {
    theme: 'light',
    weekdayCapacity: {
      0: 150, // 日曜
      1: 90,  // 月曜
      2: 90,  // 火曜
      3: 105, // 水曜
      4: 90,  // 木曜
      5: 90,  // 金曜
      6: 150  // 土曜
    },

  return {

    recurringRules: [],
    typeEstimates: {}

}

/**
 * Migrate and normalize loaded state while preserving user-imported subjects & tasks in localStorage
 */
function normalizeState(data) {
  // If migrating from an older version (< 5) where hardcoded default subjects were seeded
  // and userImportedSubjects is not set, start with empty subjects template until user imports or adds subjects.
  const hasUserSubjects = Boolean(data.userImportedSubjects) || Number(data.version) >= 5;
  const rawSubjects = hasUserSubjects && Array.isArray(data.subjects) ? data.subjects : [];
  let rawTasks = Array.isArray(data.tasks) ? data.tasks : [];
  let rawSteps = Array.isArray(data.taskSteps) ? data.taskSteps : [];
  const rawRules = Array.isArray(data.recurringRules) ? data.recurringRules : [];
  const rawLogs = Array.isArray(data.studyLogs) ? data.studyLogs : [];

  // Normalize and deduplicate subjects by id or alias/name match
  const finalSubjects = [];
  const legacyIdMap = {};

  rawSubjects.forEach((s, idx) => {
    if (!s || !s.name) return;
    const matchedExisting = finalSubjects.find(
      ex => ex.id === s.id || ex.name === s.name || (ex.aliases || []).includes(s.name)
    );
    if (matchedExisting) {
      if (s.id && s.id !== matchedExisting.id) {
        legacyIdMap[s.id] = matchedExisting.id;
      }
      const merged = normalizeSubjectEntry(matchedExisting, idx, s);
      Object.assign(matchedExisting, merged);
    } else {
      const normalized = normalizeSubjectEntry(s, finalSubjects.length);
      if (normalized) {
        finalSubjects.push(normalized);
      }
    }
  });

  const subjectMap = new Map(finalSubjects.map(s => [s.id, s]));

  // Remove any auto-generated prep/review tasks that might have been created for Experiment subjects or deleted subjects
  const invalidPrepReviewTaskIds = new Set(
    rawTasks
      .filter(t => {
        if (!t.isPrepReview || t.status === 'completed') return false;
        const sub = subjectMap.get(legacyIdMap[t.subjectId] || t.subjectId);
        return !sub || isExperimentSubject(sub);
      })
      .map(t => t.id)
  );
  if (invalidPrepReviewTaskIds.size > 0) {
    rawTasks = rawTasks.filter(t => !invalidPrepReviewTaskIds.has(t.id));
    rawSteps = rawSteps.filter(s => !invalidPrepReviewTaskIds.has(s.taskId));
  }

  // Upgrade & unify tasks against currently loaded subjects
  rawTasks.forEach(t => {
    if (t.subjectId && legacyIdMap[t.subjectId]) {
      t.subjectId = legacyIdMap[t.subjectId];
    }
    t.title = upgradeLegacyCourseText(t.title, finalSubjects);
    if (t.rawInput) t.rawInput = upgradeLegacyCourseText(t.rawInput, finalSubjects);

    const matched = matchSubjectFromText(`${t.title || ''} ${t.rawInput || ''}`, finalSubjects);
    if (matched && (!t.subjectId || !subjectMap.has(t.subjectId) || matched.id !== t.subjectId)) {
      t.subjectId = matched.id;
    }

    const sub = subjectMap.get(t.subjectId);
    t.taskType = inferTaskTypeForItem(t, sub);
  });

  // Upgrade & unify taskSteps
  rawSteps.forEach(st => {
    st.title = upgradeLegacyCourseText(st.title, finalSubjects);
  });

  // Upgrade & unify recurringRules
  rawRules.forEach(r => {
    if (r.subjectId && legacyIdMap[r.subjectId]) {
      r.subjectId = legacyIdMap[r.subjectId];
    }
    r.title = upgradeLegacyCourseText(r.title, finalSubjects);
    const matched = matchSubjectFromText(r.title || '', finalSubjects);
    if (matched && (!r.subjectId || !subjectMap.has(r.subjectId))) {
      r.subjectId = matched.id;
    }
    const sub = subjectMap.get(r.subjectId);
    r.taskType = inferTaskTypeForItem(r, sub);
  });

  // Upgrade & unify studyLogs
  const taskById = new Map(rawTasks.map(t => [t.id, t]));
  rawLogs.forEach(l => {
    if (l.subjectId && legacyIdMap[l.subjectId]) {
      l.subjectId = legacyIdMap[l.subjectId];
    }
    l.title = upgradeLegacyCourseText(l.title, finalSubjects);
    const parentTask = l.taskId ? taskById.get(l.taskId) : null;
    if (!l.subjectId && parentTask?.subjectId) {
      l.subjectId = parentTask.subjectId;
    }
    if (!l.subjectId || !subjectMap.has(l.subjectId)) {
      const matched = matchSubjectFromText(l.title || '', finalSubjects);
      if (matched) l.subjectId = matched.id;
    }
    const sub = subjectMap.get(l.subjectId);
    l.taskType = l.taskType || parentTask?.taskType || inferTaskTypeForItem(l, sub);
  });

  // Normalize dailyStates with AM/PM conditions
  const rawDaily = data.dailyStates || {};
  const normalizedDaily = {};
  for (const [dt, entry] of Object.entries(rawDaily)) {
    const fallback = entry?.condition || 'normal';
    normalizedDaily[dt] = {
      ...entry,
      date: dt,
      condition: fallback,
      conditionAm: entry?.conditionAm || fallback,
      conditionPm: entry?.conditionPm || fallback
    };
  }

  return {
    version: 5,
    userImportedSubjects: finalSubjects.length > 0 || Boolean(data.userImportedSubjects),
    subjects: finalSubjects,
    tasks: rawTasks,
    taskSteps: rawSteps,
    studyLogs: rawLogs,
    dailyStates: normalizedDaily,
    userSettings: data.userSettings || createSeedData().userSettings,
    recurringRules: rawRules,
    typeEstimates: data.typeEstimates && typeof data.typeEstimates === 'object' ? data.typeEstimates : {}
  };
}

/**
 * Request persistent storage in browser so OS doesn't evict local DB
 */
async function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    try {
      return await navigator.storage.persist();
    } catch {
      return false;
    }
  }
  return false;
}

/**
 * IndexedDB helper for durable asynchronous storage
 */
function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error('IndexedDB not supported'));
      return;
    }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveToIDB(state) {
  try {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(state, 'root');
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch {
    return false;
  }
}

async function loadFromIDB() {
  try {
    const db = await openIDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get('root');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch {
    return null;
  }
}

/**
 * Load application state from LocalStorage or IndexedDB, migrating legacy keys seamlessly
 */
async function loadAppState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      for (const legacyKey of LEGACY_KEYS) {
        const candidate = localStorage.getItem(legacyKey);
        if (candidate) {
          raw = candidate;
          break;
        }
      }
    }
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.tasks) && Array.isArray(parsed.subjects)) {
        const normalized = normalizeState(parsed);
        saveAppState(normalized);
        return normalized;
      }
    }
  } catch (e) {
    console.warn('LocalStorage read failed, trying IndexedDB...', e);
  }

  const idbData = await loadFromIDB();
  if (idbData && Array.isArray(idbData.tasks) && Array.isArray(idbData.subjects)) {
    const normalized = normalizeState(idbData);
    saveAppState(normalized);
    return normalized;
  }

  const seed = createSeedData();
  saveAppState(seed);
  return seed;
}

/**
 * Save application state to both LocalStorage and IndexedDB
 */
function saveAppState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('LocalStorage save error:', e);
  }
  saveToIDB(state);
}

/**
 * Export full database as a downloadable JSON file
 */
function exportBackupJson(state) {
  const payload = {
    ...state,
    exportedAt: new Date().toISOString(),
    app: 'SmartStudyOS'
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateLabel = toDateStr();
  a.href = url;
  a.download = `smart-study-os-backup-${dateLabel}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  return jsonStr;
}

/**
 * Validate and parse an imported JSON string (supports Timetable-only JSON or Full Backup JSON)
 */
function parseAndValidateBackup(jsonString, currentState = null) {
  let data;
  try {
    data = JSON.parse(jsonString);
  } catch {
    throw new Error('JSONの形式が正しくありません。括弧やカンマを確認してください。');
  }

  const baseState = currentState || createSeedData();

  // Case 1: Timetable-only JSON ([...] or { subjects: [...] } or { timetable: [...] } without tasks array)
  const isSubjectArray = Array.isArray(data);
  const isTimetableOnlyObj =
    data &&
    typeof data === 'object' &&
    !Array.isArray(data) &&
    (Array.isArray(data.subjects) || Array.isArray(data.timetable)) &&
    !Array.isArray(data.tasks);

  if (isSubjectArray || isTimetableOnlyObj) {
    const incomingSubjects = isSubjectArray ? data : (data.subjects || data.timetable || []);
    if (incomingSubjects.length === 0 || !incomingSubjects.some(s => s && s.name)) {
      throw new Error('時間割JSON内に有効な科目データ（"name"）が見つかりません。');
    }

    // Preserve memoLogs / autoPrep / autoReview from existing subjects if matching by id or name
    const existingList = Array.isArray(baseState.subjects) ? baseState.subjects : [];
    const mergedSubjects = incomingSubjects.map((inc, idx) => {
      const prev = existingList.find(
        ex => (inc.id && ex.id === inc.id) || (inc.name && ex.name === inc.name)
      );
      return normalizeSubjectEntry(inc, idx, prev);
    }).filter(Boolean);

    return normalizeState({
      ...baseState,
      version: 5,
      userImportedSubjects: true,
      subjects: mergedSubjects
    });
  }

  // Case 2: Full Backup JSON ({ subjects: [...], tasks: [...], taskSteps: [...] })
  if (!data || !Array.isArray(data.subjects) || !Array.isArray(data.tasks) || !Array.isArray(data.taskSteps)) {
    throw new Error('時間割JSON（[{"name": "..."}] または {"subjects": [...]}）またはバックアップJSONを指定してください。');
  }

  return normalizeState({
    ...data,
    version: 5,
    userImportedSubjects: true
  });
}

/**
 * Detect taskType from natural text, prioritizing longer keywords first
 */
function detectTaskTypeFromText(text, isExperiment = false) {
  const s = text || '';

  if (isExperiment) {
    // Experiment course keyword rules (longest keywords prioritized)
    const expRules = [
      { keyword: '小レポート', type: '小レポート' },
      { keyword: '予習レポ', type: '小レポート' },
      { keyword: 'レポート', type: 'レポート' },
      { keyword: '小レポ', type: '小レポート' },
      { keyword: '本レポ', type: 'レポート' },
      { keyword: 'その他', type: 'その他' }
    ];
    expRules.sort((a, b) => b.keyword.length - a.keyword.length);
    for (const r of expRules) {
      if (s.includes(r.keyword)) return r.type;
    }
    return 'レポート';
  }

  // Normal course keyword rules (longer keywords prioritized so '小テスト'/'確認テスト' beat 'テスト')
  const normalRules = [
    { keyword: '確認テスト', type: '小テスト' },
    { keyword: '予習・復習', type: '予習・復習' },
    { keyword: 'ミニテスト', type: '小テスト' },
    { keyword: '小テスト', type: '小テスト' },
    { keyword: 'レポート', type: 'レポート' },
    { keyword: 'プリント', type: '課題' },
    { keyword: 'テスト', type: 'テスト' },
    { keyword: '試験', type: 'テスト' },
    { keyword: '中間', type: 'テスト' },
    { keyword: '期末', type: 'テスト' },
    { keyword: '予習', type: '予習・復習' },
    { keyword: '復習', type: '予習・復習' },
    { keyword: '課題', type: '課題' },
    { keyword: '演習', type: '課題' },
    { keyword: '宿題', type: '課題' }
  ];
  normalRules.sort((a, b) => b.keyword.length - a.keyword.length);
  for (const r of normalRules) {
    if (s.includes(r.keyword)) return r.type;
  }
  return '課題';
}

const WEEKDAY_MAP = {
  '日': 0, '月': 1, '火': 2, '水': 3, '木': 4, '金': 5, '土': 6
};

/**
 * Parse natural Japanese task input in real-time
 * @param {string} rawText - User input string
 * @param {Array} subjects - Registered subjects array
 * @param {string} todayStr - Today's YYYY-MM-DD
 * @param {number} defaultMinutes - Default fallback duration
 * @param {Function|null} getLearnedMinutesFn - Optional callback `(subjectId, taskType) => learnedMinutes | null`
 */
function parseNaturalInput(
  rawText,
  subjects = [],
  todayStr = toDateStr(),
  defaultMinutes = 30,
  getLearnedMinutesFn = null
) {
  const text = (rawText || '').trim();
  if (!text) return null;

  const [ty, tm, td] = todayStr.split('-').map(Number);
  const todayObj = new Date(ty, tm - 1, td);
  const currentDow = todayObj.getDay();

  // 1. Detect Subject (Longest alias match across all registered subjects)
  const matchedSubject = matchSubjectFromText(text, subjects);
  const isExp = isExperimentSubject(matchedSubject) || (!matchedSubject && /実験|小レポート|小レポ|予習レポ|本レポ/.test(text));

  // 2. Detect TaskType & Spec
  const taskType = detectTaskTypeFromText(text, isExp);
  const spec = getTaskTypeSpec(isExp, taskType);
  const category = spec.category;

  // 3. Detect Deadline Date
  let deadlineDate = null;
  let matchedDateToken = '';

  let recurrence = null;
  const weeklyMatch = text.match(/毎週(?:の)?(?:([日月火水木金土])曜(?:日)?)?(?:まで(?:に)?|に|の)?/);
  if (weeklyMatch) {
    let weekday;
    let weekdaySource = 'explicit';
    if (weeklyMatch[1]) {
      weekday = WEEKDAY_MAP[weeklyMatch[1]];
    } else if (matchedSubject && typeof matchedSubject.defaultWeekday === 'number') {
      weekday = matchedSubject.defaultWeekday;
      weekdaySource = 'subject';
    } else {
      weekday = currentDow;
      weekdaySource = 'fallback';
    }
    let delta = weekday - currentDow;
    if (delta <= 0) delta += 7;
    deadlineDate = addDays(todayStr, delta);
    matchedDateToken = weeklyMatch[0];
    recurrence = { frequency: 'weekly', weekday, weekdaySource };
  }

  // 3a. Explicit M/D or M月D日
  const mdMatch = text.match(/(\d{1,2})\s*(?:月|\/)\s*(\d{1,2})\s*日?(?:まで(?:に)?|に)?/);
  if (!deadlineDate && mdMatch) {
    const m = parseInt(mdMatch[1], 10);
    const d = parseInt(mdMatch[2], 10);
    if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
      let targetYear = ty;
      const candidate = new Date(targetYear, m - 1, d);
      if (candidate < todayObj && (todayObj - candidate) > 1000 * 60 * 60 * 24 * 30) {
        targetYear += 1;
      }
      deadlineDate = toDateStr(new Date(targetYear, m - 1, d));
      matchedDateToken = mdMatch[0];
    }
  }

  // 3b. Relative days: 今日 / 明日 / 明後日 / N日後
  if (!deadlineDate) {
    const relDaysMatch = text.match(/(\d+)\s*日後(?:まで(?:に)?|に)?/);
    if (relDaysMatch) {
      deadlineDate = addDays(todayStr, parseInt(relDaysMatch[1], 10));
      matchedDateToken = relDaysMatch[0];
    } else if (/今日|本日|きょう/.test(text)) {
      deadlineDate = todayStr;
      const m = text.match(/(?:今日|本日|きょう)(?:の|中|まで(?:に)?|に)?/);
      if (m) matchedDateToken = m[0];
    } else if (/明後日|あさって/.test(text)) {
      deadlineDate = addDays(todayStr, 2);
      const m = text.match(/(?:明後日|あさって)(?:の|まで(?:に)?|に)?/);
      if (m) matchedDateToken = m[0];
    } else if (/明日|あした/.test(text)) {
      deadlineDate = addDays(todayStr, 1);
      const m = text.match(/(?:明日|あした)(?:の|まで(?:に)?|に)?/);
      if (m) matchedDateToken = m[0];
    }
  }

  // 3c. Weekdays: 来週月曜 / 今週金曜 / 金曜日までに / 水曜に
  if (!deadlineDate) {
    const dowMatch = text.match(/(再来週|来週|今週)?(?:の)?([日月火水木金土])曜(?:日)?(?:まで(?:に)?|に|の)?/);
    if (dowMatch) {
      const prefix = dowMatch[1] || '';
      const targetDow = WEEKDAY_MAP[dowMatch[2]];
      let delta = targetDow - currentDow;

      if (prefix === '来週') {
        const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
        const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
        delta = daysToNextMonday + offsetFromMonday;
      } else if (prefix === '再来週') {
        const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
        const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
        delta = daysToNextMonday + 7 + offsetFromMonday;
      } else {
        if (delta <= 0) delta += 7;
      }
      deadlineDate = addDays(todayStr, delta);
      matchedDateToken = dowMatch[0];
    }
  }

  // 3d. "来週の[科目]の課題" when weekday is omitted -> use subject's defaultWeekday
  if (!deadlineDate && /来週/.test(text) && matchedSubject && typeof matchedSubject.defaultWeekday === 'number') {
    const targetDow = matchedSubject.defaultWeekday;
    const daysToNextMonday = ((1 - currentDow + 7) % 7) || 7;
    const offsetFromMonday = (targetDow === 0) ? 6 : (targetDow - 1);
    deadlineDate = addDays(todayStr, daysToNextMonday + offsetFromMonday);
    matchedDateToken = '来週';
  }

  // 4. Detect Explicit Duration (Minutes) if typed
  let explicitMinutes = null;
  let matchedDurationToken = '';

  const hourMinMatch = text.match(/(\d+(?:\.\d+)?)\s*時間(?:\s*(\d+)\s*分)?/);
  const halfHourMatch = text.match(/(\d+)\s*時間半/);
  const minMatch = text.match(/(\d+)\s*(?:分|分間|m|min)(?:間|だけ|勉強する|やる)?/i);

  if (halfHourMatch) {
    explicitMinutes = parseInt(halfHourMatch[1], 10) * 60 + 30;
    matchedDurationToken = halfHourMatch[0];
  } else if (hourMinMatch) {
    const hrs = parseFloat(hourMinMatch[1]);
    const mins = hourMinMatch[2] ? parseInt(hourMinMatch[2], 10) : 0;
    explicitMinutes = Math.round(hrs * 60) + mins;
    matchedDurationToken = hourMinMatch[0];
  } else if (minMatch) {
    explicitMinutes = parseInt(minMatch[1], 10);
    matchedDurationToken = minMatch[0];
  }

  // 5. Determine Estimated Duration & Decomposition Steps from TaskType Spec + Subject×TaskType Learning
  const learnedInfo = (matchedSubject && typeof getLearnedMinutesFn === 'function')
    ? getLearnedMinutesFn(matchedSubject.id, taskType)
    : null;

  let shouldDecompose = spec.shouldDecompose;
  let suggestedSteps = spec.steps.map(s => ({ ...s }));
  let estimatedMinutes = explicitMinutes || (learnedInfo ? learnedInfo.learnedMinutes : spec.baseMinutes);
  const isLearnedDuration = Boolean(!explicitMinutes && learnedInfo && learnedInfo.sampleCount > 0);

  if (shouldDecompose && suggestedSteps.length > 0) {
    const templateSum = suggestedSteps.reduce((acc, s) => acc + s.minutes, 0);
    if (estimatedMinutes !== templateSum) {
      const ratio = estimatedMinutes / Math.max(1, templateSum);
      suggestedSteps = suggestedSteps.map(s => ({
        title: s.title,
        minutes: Math.max(5, Math.round((s.minutes * ratio) / 5) * 5)
      }));
      estimatedMinutes = suggestedSteps.reduce((acc, s) => acc + s.minutes, 0);
    }
  }

  // 6. Clean up Title & dynamically unify alias course names against registered subjects
  let cleanTitle = text;
  if (matchedDateToken && !/今日/.test(matchedDateToken)) {
    cleanTitle = cleanTitle.replace(matchedDateToken, '').trim();
  }
  if (matchedDurationToken) {
    cleanTitle = cleanTitle
      .replace(/を?\s*\d+(?:\.\d+)?\s*(?:時間半|時間|分|分間)\s*(?:勉強する|やる|行う)$/, 'を勉強する')
      .replace(/\s+\d+\s*(?:分|時間)$/, '')
      .trim();
  }
  cleanTitle = cleanTitle.replace(/^[、,・\s]+/, '').trim();
  if (!cleanTitle) {
    cleanTitle = text;
  }
  cleanTitle = upgradeLegacyCourseText(cleanTitle, subjects);

  return {
    rawInput: text,
    cleanTitle,
    subjectId: matchedSubject ? matchedSubject.id : null,
    subjectName: matchedSubject ? matchedSubject.name : null,
    subjectColor: matchedSubject ? matchedSubject.color : null,
    isExperiment: isExp,
    taskType,
    category,
    categoryLabel: taskType,
    categoryIconName: spec.iconName,
    importance: spec.importance,
    deadlineDate,
    deadlineLabel: deadlineDate ? formatJpDate(deadlineDate, todayStr) : '未設定',
    baseMinutes: spec.baseMinutes,
    estimatedMinutes,
    explicitMinutes,
    isDurationExplicit: Boolean(explicitMinutes),
    isLearnedDuration,
    learnedRatio: learnedInfo ? learnedInfo.ratio : null,
    shouldDecompose,
    suggestedSteps,
    recurrence
  };
}

/**
 * Get step templates for Task Detail Modal re-decomposition
 */
function getCategoryStepTemplates(categoryOrTaskType, isExperiment = false, taskType = null) {
  const effectiveType = taskType || (
    ['小テスト', '課題', 'レポート', 'テスト', '予習・復習', '小レポート', 'その他'].includes(categoryOrTaskType)
      ? categoryOrTaskType
      : categoryOrTaskType === 'report'
        ? 'レポート'
        : categoryOrTaskType === 'quiz'
          ? '小テスト'
          : categoryOrTaskType === 'exam'
            ? 'テスト'
            : '課題'
  );
  const spec = getTaskTypeSpec(isExperiment, effectiveType);
  if (spec.steps && spec.steps.length > 0) {
    return spec.steps.map(s => ({ ...s }));
  }
  return [
    { title: `${effectiveType}の取り組み・確認`, minutes: spec.baseMinutes }
  ];
}
