            ${rule.active ? '' : `<span class="risk-badge none">一時停止中</span>`}
          </div>
          <div style="display:flex;align-items:center;gap:0.4rem;">
            <span style="font-size:0.76rem;color:var(--text-secondary);">毎週</span>
            <select class="form-select" style="width:auto;padding:0.2rem 0.45rem;font-size:0.76rem;" data-rule-weekday="${rule.id}">
              ${WEEKDAY_LABELS.map((w, idx) => `<option value="${idx}" ${rule.weekday === idx ? 'selected' : ''}>${w}曜</option>`).join('')}
            </select>
            <button type="button" class="btn-secondary" style="font-size:0.74rem;padding:0.25rem 0.55rem;" data-toggle-rule="${rule.id}">
              ${rule.active ? '一時停止' : '再開'}
            </button>
            <button type="button" class="close-btn" title="定期ルールを削除" data-delete-rule="${rule.id}">
              ${icon('trash', 14)}
            </button>
          </div>
        </div>

        <div style="font-size:0.76rem;color:var(--text-secondary);">
          次回の推定 合計 <strong class="tabular-nums">${totalEstimate}分</strong>
          ・実績からの学習反映 <span class="tabular-nums">${totalSamples}回</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:0.3rem;">
          ${rule.stepsTemplate.map((ts, idx) => {
            const last = (ts.history || []).slice(-1)[0];
            const err = getAverageError(ts);
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;background:var(--bg-surface-subtle);padding:0.35rem 0.6rem;border-radius:var(--radius-sm);font-size:0.78rem;flex-wrap:wrap;">
                <span>${idx + 1}. ${escapeHtml(ts.title)}</span>
                <span style="display:flex;align-items:center;gap:0.5rem;color:var(--text-secondary);" class="tabular-nums">
                  ${last ? `<span>前回: 推定${last.estimated}分 → 実績${last.actual}分</span>` : `<span style="color:var(--text-muted);">実績まだなし（初期値）</span>`}
                  ${err !== null ? `<span>（平均誤差 ±${err}分）</span>` : ''}
                  <span class="duration-tag">次回推定 ${ts.estimatedMinutes}分</span>
                </span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

                    `).join('')}

                ` : `

    </section>

    <!-- 3. Weekly Recurring Rules & Estimate Learning -->

      <div class="section-header" style="flex-wrap:wrap;">
        <h2 class="section-title">${icon('repeat', 17)} <span>毎週の定期課題 ＆ 推定時間の自動学習</span></h2>
        <span class="section-subtitle">完了時に入力した実時間と推定時間の差から、次回以降の推定時間を自動補正します</span>
      </div>
      <div class="step-list">
        ${renderRecurringRulesHtml()}

    </section>

    <!-- 4. Study History & Backup/Settings -->
    <div class="dashboard-grid">
      <section class="section-block">
        <div class="section-header">
          <h2 class="section-title">${icon('fileText', 17)} <span>学習履歴ログ（累計 ${totalStudiedMins}分）</span></h2>
          <span class="section-subtitle">完了タスクと学習時間の自動記録</span>
        </div>
        <div class="step-list">
          ${state.studyLogs.slice(0, 15).map(log => {
            const sub = subjectMap.get(log.subjectId);
            const uBadge = log.understandingLevel === 3 ? '◎ 十分理解' : log.understandingLevel === 1 ? '△ 要復習' : '◯ 標準';
            const uClass = log.understandingLevel === 3 ? 'safe' : log.understandingLevel === 1 ? 'warning' : 'none';
            return `
              <div class="step-card" style="flex-direction:column;align-items:stretch;gap:0.35rem;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <div class="badge-row">
                    <span class="subject-pill">
                      <span class="subject-dot" style="background:${sub ? sub.color : 'hsl(215,14%,55%)'}"></span>
                      ${escapeHtml(sub ? sub.name : '科目未設定')}
                    </span>
                    <span class="risk-badge ${uClass}">${uBadge}</span>
                  </div>
                  <span style="font-size:0.75rem;color:var(--text-muted);" class="tabular-nums">

                </div>
                <div style="font-weight:600;font-size:0.88rem;">${escapeHtml(log.title)}</div>
                ${log.reflectionNote ? `<div style="font-size:0.78rem;color:var(--text-secondary);">${escapeHtml(log.reflectionNote)}</div>` : ''}

          ${state.studyLogs.length === 0 ? `
            <div class="step-card" style="justify-content:center;color:var(--text-muted);">

          ` : ''}
        </div>
      </section>

      <section class="section-block">
        <div class="section-header">
          <h2 class="section-title">${icon('sliders', 17)} <span>曜日別空き時間 ＆ バックアップ・復元</span></h2>
        </div>
        <div class="day-bucket-card">
          <div style="font-weight:700;font-size:0.88rem;">曜日ごとの標準空き時間（自動スケジューリング基準）</div>
          <div style="display:flex;flex-direction:column;gap:0.5rem;margin-top:0.25rem;">
            ${WEEKDAY_LABELS.map((wLabel, dow) => {
              const val = state.userSettings?.weekdayCapacity?.[dow] ?? 90;
              return `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;font-size:0.82rem;">
                  <span style="width:48px;font-weight:600;">${wLabel}曜日</span>
                  <input
                    type="range"
                    min="15"
                    max="300"
                    step="15"
                    value="${val}"
                    data-weekday-slider="${dow}"
                    style="flex:1;accent-color:var(--accent-primary);"
                  />
                  <span class="tabular-nums" style="width:55px;text-align:right;font-weight:600;" id="weekday-val-${dow}">${val}分</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="day-bucket-card">
          <div style="font-weight:700;font-size:0.88rem;">データのバックアップと復元（JSON形式）</div>
          <p style="font-size:0.78rem;color:var(--text-secondary);">
            ブラウザのデータ消去や機種変更に備え、全データ（課題・時間割・学習メモ・履歴）をJSON形式でコピー・ダウンロード・復元できます。
          </p>
          <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.25rem;">
            <button type="button" class="btn-primary" id="btn-copy-json-backup">
              ${icon('copy', 14)} <span>JSONをコピー</span>
            </button>
            <button type="button" class="btn-secondary" id="btn-download-json">
              ${icon('download', 14)} <span>JSONファイル保存</span>
            </button>
            <button type="button" class="btn-secondary" id="btn-paste-restore-json">
              ${icon('upload', 14)} <span>JSON貼り付けで復元</span>
            </button>
            <label class="btn-secondary" style="cursor:pointer;">
              ${icon('upload', 14)} <span>JSONファイルから復元</span>
              <input type="file" id="input-restore-json" accept=".json,application/json" style="display:none;" />

            <button type="button" class="btn-danger-ghost" id="btn-reset-demo">

  // Toggle Prep / Review Auto-Generation Switches

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const sub = state.subjects.find(s => s.id === btn.getAttribute('data-toggle-prep'));
      if (!sub) return;
      sub.autoPrep = !sub.autoPrep;
      syncTimetablePrepReviewTasks(state, todayStr);
      commitState();
      showToast(sub.autoPrep ? `「${sub.name}」の予習タスク（講義前日・${sub.prepMinutes || 20}分）自動生成をONにしました` : `「${sub.name}」の予習自動生成をOFFにしました`);
    });
  });

  container.querySelectorAll('[data-toggle-review]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const sub = state.subjects.find(s => s.id === btn.getAttribute('data-toggle-review'));
      if (!sub) return;
      sub.autoReview = !sub.autoReview;
      syncTimetablePrepReviewTasks(state, todayStr);
      commitState();
      showToast(sub.autoReview ? `「${sub.name}」の復習タスク（講義当日〜翌日・${sub.reviewMinutes || 20}分）自動生成をONにしました` : `「${sub.name}」の復習自動生成をOFFにしました`);
    });
  });

  // Add course to empty timetable slot
  container.querySelectorAll('[data-add-slot-dow]').forEach(btn => {
    btn.addEventListener('click', () => {
      const dow = Number(btn.getAttribute('data-add-slot-dow'));
      const period = btn.getAttribute('data-add-slot-period');
      openSubjectModal(null, dow, period);
    });
  });

  // Inline 1-Line Subject Memo addition
  const addSubjectMemo = (subId) => {
    const input = container.querySelector(`[data-memo-input="${subId}"]`);
    if (!input || !input.value.trim()) return;
    const sub = state.subjects.find(s => s.id === subId);
    if (!sub) return;
    if (!Array.isArray(sub.memoLogs)) sub.memoLogs = [];
    sub.memoLogs.unshift({
      id: uid('memo'),
      date: todayStr,
      text: input.value.trim()
    });
    commitState();
    showToast(`「${sub.name}」の学習メモを記録しました`);
  };

  container.querySelectorAll('[data-memo-add]').forEach(btn => {
    btn.addEventListener('click', () => addSubjectMemo(btn.getAttribute('data-memo-add')));
  });

  container.querySelectorAll('[data-memo-input]').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addSubjectMemo(inp.getAttribute('data-memo-input'));
      }
    });
  });

  container.querySelectorAll('[data-delete-memo]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sub = state.subjects.find(s => s.id === btn.getAttribute('data-memo-sub'));
      const memoId = btn.getAttribute('data-delete-memo');
      if (sub && Array.isArray(sub.memoLogs)) {
        sub.memoLogs = sub.memoLogs.filter(m => m.id !== memoId);
        commitState();
      }
    });
  });

  // Recurring rules controls
  container.querySelectorAll('[data-toggle-rule]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rule = (state.recurringRules || []).find(r => r.id === btn.getAttribute('data-toggle-rule'));
      if (!rule) return;
      rule.active = !rule.active;
      if (rule.active) {
        rule.startDate = todayStr;
        generateRecurringInstances(state, todayStr);
      }
      commitState();
      showToast(rule.active ? `「${rule.title}」の毎週作成を再開しました` : `「${rule.title}」を一時停止しました`);
    });
  });

  container.querySelectorAll('[data-rule-weekday]').forEach(sel => {
    sel.addEventListener('change', () => {
      const rule = (state.recurringRules || []).find(r => r.id === sel.getAttribute('data-rule-weekday'));
      if (!rule) return;
      rule.weekday = Number(sel.value);
      rule.startDate = todayStr;
      generateRecurringInstances(state, todayStr);
      commitState();
      showToast(`「${rule.title}」を毎週${WEEKDAY_LABELS[rule.weekday]}曜に変更しました`);
    });
  });

  container.querySelectorAll('[data-delete-rule]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ruleId = btn.getAttribute('data-delete-rule');
      state.recurringRules = (state.recurringRules || []).filter(r => r.id !== ruleId);
      commitState();
      showToast('定期課題ルールを削除しました');
    });
  });

  container.querySelectorAll('[data-weekday-slider]').forEach(slider => {
    slider.addEventListener('input', () => {
      const dow = Number(slider.getAttribute('data-weekday-slider'));
      const val = Number(slider.value);
      const label = document.getElementById(`weekday-val-${dow}`);
      if (label) label.textContent = `${val}分`;
    });
    slider.addEventListener('change', () => {
      const dow = Number(slider.getAttribute('data-weekday-slider'));
      const val = Number(slider.value);
      if (!state.userSettings.weekdayCapacity) state.userSettings.weekdayCapacity = {};
      state.userSettings.weekdayCapacity[dow] = val;
      commitState();
      showToast('曜日別の標準空き時間を更新しました');
    });
  });

  container.querySelectorAll('[data-edit-subject]').forEach(card => {
    card.addEventListener('click', () => {
      openSubjectModal(card.getAttribute('data-edit-subject'));
    });
  });

  document.getElementById('btn-open-new-subject')?.addEventListener('click', () => {
    openSubjectModal(null);
  });

  document.getElementById('btn-export-backup-main')?.addEventListener('click', () => {
    exportBackupJson(state);
    showToast('バックアップJSONファイルを書き出しました');
  });

  document.getElementById('btn-download-json')?.addEventListener('click', () => {
    exportBackupJson(state);
    showToast('バックアップJSONファイルを書き出しました');
  });

  document.getElementById('btn-copy-json-backup')?.addEventListener('click', () => {
    const jsonStr = JSON.stringify({ ...state, exportedAt: new Date().toISOString(), app: 'SmartStudyOS' }, null, 2);
    copyTextWithModalFallback(
      'バックアップJSONのコピー',
      '全データのバックアップJSONをクリップボードにコピーしました。メモ帳などに保存しておくと「JSON貼り付けで復元」からいつでも復元できます。',
      jsonStr,
      'バックアップJSONをコピーしました'
    );
  });

  document.getElementById('btn-paste-restore-json')?.addEventListener('click', () => {
    openPasteRestoreModal();
  });

  document.getElementById('input-restore-json')?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const restored = parseAndValidateBackup(ev.target.result);
        state = restored;
        applyTheme(state.userSettings?.theme || 'light');
        commitState();
        showToast('バックアップファイルから全データを復元しました');
      } catch (err) {
        alert(err.message);
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('btn-reset-demo')?.addEventListener('click', () => {
    state.tasks = [];
    state.taskSteps = [];
    state.recurringRules = [];
    state.studyLogs = [];
    commitState();
    showToast('すべてのタスク・定期課題・学習履歴を空にしました');
  });
}

/**
 * Open Modal to Restore from Pasted JSON Text
 */
function openPasteRestoreModal() {
  const modal = document.getElementById('modal-subject-edit');
  const titleEl = document.getElementById('title-subject-modal');
  const body = document.getElementById('modal-subject-body');
  if (!modal || !body) return;
  if (titleEl) titleEl.textContent = 'JSONテキスト貼り付けによるデータ復元';

  body.innerHTML = `
    <div style="font-size:0.8rem;color:var(--text-secondary);">
      コピーしておいたバックアップJSONテキストを下の欄に貼り付けて「データを復元する」を押してください。
    </div>
    <textarea id="paste-restore-textarea" class="form-textarea" rows="8" placeholder='{"version": 3, "subjects": [...], ...}' style="font-family:var(--font-mono);font-size:0.75rem;"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:0.5rem;">
      <button type="button" class="btn-secondary" id="btn-cancel-paste-restore">キャンセル</button>
      <button type="button" class="btn-primary" id="btn-confirm-paste-restore">
        ${icon('upload', 14)} <span>データを復元する</span>
      </button>
    </div>
  `;
  modal.classList.remove('hidden');

  document.getElementById('btn-cancel-paste-restore')?.addEventListener('click', () => modal.classList.add('hidden'));
  document.getElementById('btn-confirm-paste-restore')?.addEventListener('click', () => {
    const raw = document.getElementById('paste-restore-textarea')?.value?.trim();
    if (!raw) return;
    try {
      const restored = parseAndValidateBackup(raw);
      state = restored;
      applyTheme(state.userSettings?.theme || 'light');
      modal.classList.add('hidden');
      commitState();
      showToast('JSONテキストから全データを復元しました');
    } catch (err) {
      alert(err.message);
    }
  });
}

   MODAL 1: Complete Step, Adaptive Estimate Learning & Subject 1-Line Memo
   ========================================================================== */
function openCompleteStepModal(stepId, measuredMinutes = null) {
  const step = state.taskSteps.find(s => s.id === stepId);
  if (!step) return;
  const task = state.tasks.find(t => t.id === step.taskId);
  const sub = state.subjects.find(s => s.id === task?.subjectId);
  const modal = document.getElementById('modal-complete-step');
  const body = document.getElementById('modal-complete-body');
  if (!modal || !body) return;

  const initialMinutes = measuredMinutes || step.estimatedMinutes || 30;
  const isRecurringStep = !!previewLearning(state, step, initialMinutes);

  body.innerHTML = `
    <div>
      <div style="font-size:0.78rem;color:var(--text-secondary);">
        完了するステップ ${isRecurringStep ? `<span class="subject-pill">${icon('repeat', 12)} <span>毎週の定期課題</span></span>` : ''}
      </div>
      <div style="font-size:1.05rem;font-weight:700;margin-top:0.15rem;">${escapeHtml(step.title)}</div>
      <div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.1rem;">
        親課題: ${escapeHtml(task ? task.title : '')} ${sub ? `（${escapeHtml(sub.name)}）` : ''}
      </div>
    </div>

    <div class="form-grid">
      <div class="form-field">
        <label class="form-label" for="complete-actual-mins">
          実際にかかった時間（分）${measuredMinutes ? '・タイマー計測値を自動反映' : ''}
        </label>
        <input
          type="number"
          id="complete-actual-mins"
          class="form-input tabular-nums"
          value="${initialMinutes}"
          min="1"
          max="600"
        />
      </div>
      <div class="form-field">
        <label class="form-label">理解度・手応え（苦手抽出用）</label>
        <div class="condition-segmented" id="complete-understanding-group">
          <button type="button" class="condition-btn" data-u-level="3">◎ 完璧</button>
          <button type="button" class="condition-btn active" data-u-level="2">◯ 普通</button>
          <button type="button" class="condition-btn" data-u-level="1">△ 要復習</button>
        </div>
      </div>
    </div>

    <div id="learning-preview-banner"></div>

    <div class="form-field">
      <label class="form-label" for="complete-note">
        学習メモ・理解が曖昧な点（${sub ? `「${escapeHtml(sub.name)}」の学習メモにも1行蓄積されます` : '任意'}）
      </label>
      <input
        type="text"
        id="complete-note"
        class="form-input"
        placeholder="例: テブナンの定理の等価抵抗計算で符号を間違えやすい"
      />
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.6rem;padding-top:0.5rem;">
      <button type="button" class="btn-secondary" id="btn-cancel-complete">キャンセル</button>
      <button type="button" class="btn-primary" id="btn-confirm-complete">
        ${icon('check', 15)} <span>完了して記録する</span>
      </button>
    </div>
  `;

  modal.classList.remove('hidden');

  const updateLearningBanner = () => {
    const banner = document.getElementById('learning-preview-banner');
    if (!banner) return;
    const actual = Math.max(1, Number(document.getElementById('complete-actual-mins')?.value) || initialMinutes);
    const info = previewLearning(state, step, actual);
    if (!info) {
      banner.innerHTML = '';
      return;
    }
    const diff = info.nextEstimate - info.oldEstimate;
    const diffLabel = diff > 0 ? `+${diff}分` : `${diff}分`;
    banner.innerHTML = `
      <div style="background:var(--accent-soft);border:1px solid var(--accent-primary);color:var(--text-primary);padding:0.65rem 0.85rem;border-radius:var(--radius-sm);font-size:0.78rem;">
        <div style="font-weight:700;color:var(--accent-primary);display:flex;align-items:center;gap:0.35rem;">
          ${icon('trendingUp', 14)}
          <span>推定時間の自動学習（実績 ${info.actualMinutes}分 vs 今回推定 ${info.oldEstimate}分）</span>
        </div>
        <div style="margin-top:0.2rem;">
          ${diff === 0
            ? `推定時間と実績が一致しています。次回の推定時間も <strong class="tabular-nums">${info.nextEstimate}分</strong> を維持します。`
            : `この差を学習し、次回のこのステップの推定時間を <strong class="tabular-nums">${info.oldEstimate}分 → ${info.nextEstimate}分 (${diffLabel})</strong> に自動補正します。`}
        </div>
      </div>
    `;
  };

  updateLearningBanner();
  document.getElementById('complete-actual-mins')?.addEventListener('input', updateLearningBanner);

  let selectedLevel = 2;
  body.querySelectorAll('[data-u-level]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedLevel = Number(btn.getAttribute('data-u-level'));
      body.querySelectorAll('[data-u-level]').forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  document.getElementById('btn-cancel-complete')?.addEventListener('click', () => {
    modal.classList.add('hidden');
  });

  document.getElementById('btn-confirm-complete')?.addEventListener('click', () => {
    const mins = Math.max(1, Number(document.getElementById('complete-actual-mins')?.value) || 20);
    const note = document.getElementById('complete-note')?.value?.trim() || '';
    finalizeStepCompletion(step, task, mins, selectedLevel, note);
    modal.classList.add('hidden');
  });
}

function finalizeStepCompletion(step, task, actualMinutes, understandingLevel, reflectionNote) {
  const todayStr = toDateStr();
  const estimatedBefore = step.estimatedMinutes || 30;
  const learning = applyActualToRecurringRule(state, step, actualMinutes, todayStr);

  step.isCompleted = true;
  step.completedAt = todayStr;
  step.estimatedMinutes = actualMinutes;

  // Also update prep/review learned duration if this was an auto-generated prep/review task
  if (task && task.subjectId && task.isPrepReview) {
    const sub = state.subjects.find(s => s.id === task.subjectId);
    if (sub) {
      const key = task.isPrepReview === 'prep' ? 'prepMinutes' : 'reviewMinutes';
      const oldVal = Number(sub[key]) || 20;
      sub[key] = Math.max(5, Math.round((0.5 * actualMinutes + 0.5 * oldVal) / 5) * 5);
    }
  }

  // Append reflectionNote to subject's 1-line memoLogs if provided
  if (reflectionNote && task && task.subjectId) {
    const sub = state.subjects.find(s => s.id === task.subjectId);
    if (sub) {
      if (!Array.isArray(sub.memoLogs)) sub.memoLogs = [];
      sub.memoLogs.unshift({
        id: uid('memo'),
        date: todayStr,
        text: `${reflectionNote}（${step.title}）`
      });
    }
  }

  if (task) {
    task.understandingLevel = understandingLevel;
    if (understandingLevel === 1) {
      task.nextReviewDate = addDays(todayStr, 3);
    }
    const allSteps = state.taskSteps.filter(s => s.taskId === task.id);
    if (allSteps.every(s => s.isCompleted)) {
      task.status = 'completed';
      task.completedAt = todayStr;
      if (task.recurringRuleId) {
        generateRecurringInstances(state, todayStr);
      }
    } else {
      task.status = 'in_progress';
    }
    task.estimatedMinutes = allSteps.reduce((acc, s) => acc + (Number(s.estimatedMinutes) || 0), 0);
  }

  state.studyLogs.unshift({
    id: uid('log'),
    taskId: task ? task.id : null,
    stepId: step.id,
    subjectId: task ? task.subjectId : null,
    title: task && task.title !== step.title ? `${task.title}：${step.title}` : step.title,
    studiedDate: todayStr,
    durationMinutes: actualMinutes,
    estimatedMinutes: estimatedBefore,
    understandingLevel,
    reflectionNote
  });

  commitState();
  if (learning && learning.oldEstimate !== learning.nextEstimate) {
    showToast(`完了！次回「${learning.stepTitle}」の推定時間を ${learning.oldEstimate}分 → ${learning.nextEstimate}分 に自動補正しました`);
  } else {
    showToast(understandingLevel === 1 ? '完了！3日後に復習を提案します' : 'ステップ完了と学習ログを記録しました');
  }
}

        ${icon('repeat', 13)} 毎週ある小テストやレポートですか？（実時間から推定時間の精度を毎週自動で上げます）
      </div>
      <div style="display:flex;align-items:center;gap:0.4rem;">
        <select id="convert-rule-weekday" class="form-select" style="width:auto;padding:0.22rem 0.45rem;font-size:0.76rem;">
          ${WEEKDAY_LABELS.map((w, idx) => `<option value="${idx}" ${defaultDow === idx ? 'selected' : ''}>毎週${w}曜</option>`).join('')}
        </select>
        <button type="button" class="btn-secondary" id="btn-convert-to-recurring" style="font-size:0.75rem;padding:0.28rem 0.6rem;color:var(--accent-primary);border-color:var(--accent-primary);">

      <div class="form-grid">
        <div class="form-field full">
          <label class="form-label">課題タイトル</label>
          <input type="text" id="detail-task-title" class="form-input" value="${escapeHtml(task.title)}" />
        </div>

            `).join('')}
          </select>
        </div>
        <div class="form-field">
          <label class="form-label">優先度（重要度）</label>
          <select id="detail-task-importance" class="form-select">
            <option value="3" ${task.importance === 3 ? 'selected' : ''}>高（レポート・試験・必修）</option>
            <option value="2" ${task.importance === 2 ? 'selected' : ''}>中（通常課題・演習）</option>
            <option value="1" ${task.importance === 1 ? 'selected' : ''}>低（自主学習・予備）</option>
          </select>
        </div>

      <div style="border-top:1px solid var(--border-subtle);padding-top:0.9rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;flex-wrap:wrap;gap:0.4rem;">
          <div>
            <div style="font-weight:700;font-size:0.9rem;">${icon('layers', 15)} 実行ステップ分解 (${steps.length}ステップ)</div>
            <div style="font-size:0.75rem;color:var(--text-secondary);">最初は適当な推定時間でOK。完了時の実時間から次回推定を自動学習します</div>
          </div>
          <div style="display:flex;gap:0.4rem;">
            <button type="button" class="btn-secondary" id="btn-auto-decompose-template" style="font-size:0.75rem;padding:0.3rem 0.6rem;">
              テンプレート分解
            </button>
            <button type="button" class="btn-secondary" id="btn-add-step-row" style="font-size:0.75rem;padding:0.3rem 0.6rem;">

        <div style="display:flex;flex-direction:column;gap:0.45rem;" id="detail-steps-list">

                class="form-input tabular-nums"

                value="${st.estimatedMinutes}"
                min="5"
                max="300"
                step="5"
              />

              <input
                type="date"
                class="form-input"
                style="width:130px;padding:0.28rem 0.4rem;font-size:0.76rem;"

                value="${st.scheduledDate || ''}"
              />
              ${steps.length > 1 ? `

          <button type="button" class="btn-primary" id="btn-save-task-detail">保存してスケジュール反映</button>
        </div>
      </div>
    `;

    const syncDraftInputs = () => {
      task.title = document.getElementById('detail-task-title')?.value?.trim() || task.title;
      task.subjectId = document.getElementById('detail-task-subject')?.value || null;
      task.deadlineDate = document.getElementById('detail-task-deadline')?.value || null;
      task.category = document.getElementById('detail-task-category')?.value || 'self_study';
      task.importance = Number(document.getElementById('detail-task-importance')?.value) || 2;

      body.querySelectorAll('[data-edit-step-title]').forEach(inp => {
        const st = state.taskSteps.find(s => s.id === inp.getAttribute('data-edit-step-title'));
        if (st) st.title = inp.value.trim() || st.title;
      });
      body.querySelectorAll('[data-edit-step-mins]').forEach(inp => {
        const st = state.taskSteps.find(s => s.id === inp.getAttribute('data-edit-step-mins'));
        if (st) st.estimatedMinutes = Math.max(5, Number(inp.value) || 30);
      });
      body.querySelectorAll('[data-edit-step-date]').forEach(inp => {
        const st = state.taskSteps.find(s => s.id === inp.getAttribute('data-edit-step-date'));
        if (st) st.scheduledDate = inp.value || null;
      });

      const currentSteps = state.taskSteps.filter(s => s.taskId === task.id);
      task.estimatedMinutes = currentSteps.reduce((acc, s) => acc + (Number(s.estimatedMinutes) || 0), 0);
    };

    document.getElementById('btn-convert-to-recurring')?.addEventListener('click', () => {
      syncDraftInputs();
      const dow = Number(document.getElementById('convert-rule-weekday')?.value ?? 1);
      const rule = createRuleFromTask(state, task, dow, toDateStr());
      generateRecurringInstances(state, toDateStr());
      commitState();
      renderModalContent();
      showToast(`「${rule.title}」を毎週${WEEKDAY_LABELS[dow]}曜の定期課題に設定しました`);
    });

    document.getElementById('detail-rule-weekday')?.addEventListener('change', (e) => {
      const rule = (state.recurringRules || []).find(r => r.id === task.recurringRuleId);
      if (rule) {
        rule.weekday = Number(e.target.value);
        commitState();
        renderModalContent();
        showToast(`繰り返し曜日を毎週${WEEKDAY_LABELS[rule.weekday]}曜に変更しました`);
      }
    });

    document.getElementById('btn-stop-recurring-rule')?.addEventListener('click', () => {
      const rule = (state.recurringRules || []).find(r => r.id === task.recurringRuleId);
      if (rule) rule.active = false;
      task.recurringRuleId = null;
      commitState();
      renderModalContent();
      showToast('毎週の繰り返しを解除しました');
    });

    body.querySelectorAll('[data-remove-step]').forEach(btn => {
      btn.addEventListener('click', () => {
        syncDraftInputs();
        const rmId = btn.getAttribute('data-remove-step');
        state.taskSteps = state.taskSteps.filter(s => s.id !== rmId);
        state.taskSteps
          .filter(s => s.taskId === task.id)
          .sort((a, b) => a.orderIndex - b.orderIndex)
          .forEach((s, idx) => { s.orderIndex = idx + 1; });
        renderModalContent();
      });
    });

    document.getElementById('btn-auto-decompose-template')?.addEventListener('click', () => {
      syncDraftInputs();
      const todayStr = toDateStr();
      const templates = getCategoryStepTemplates(task.category);
      state.taskSteps = state.taskSteps.filter(s => s.taskId !== task.id);
      const rawSteps = templates.map((t, idx) => ({
        id: uid('step'),
        taskId: task.id,
        title: t.title,
        orderIndex: idx + 1,
        templateIndex: idx,
        estimatedMinutes: t.minutes,
        scheduledDate: null,
        isCompleted: false,
        completedAt: null
      }));
      const scheduled = assignDatesForNewTaskSteps(rawSteps, task.deadlineDate, state, todayStr);
      state.taskSteps.push(...scheduled);
      renderModalContent();
    });

    document.getElementById('btn-add-step-row')?.addEventListener('click', () => {
      syncDraftInputs();
      const existing = state.taskSteps.filter(s => s.taskId === task.id);
      state.taskSteps.push({
        id: uid('step'),
        taskId: task.id,
        title: `作業ステップ ${existing.length + 1}`,
        orderIndex: existing.length + 1,
        estimatedMinutes: 30,
        scheduledDate: task.deadlineDate || toDateStr(),
        isCompleted: false,
        completedAt: null
      });
      renderModalContent();
    });

    document.getElementById('btn-delete-task')?.addEventListener('click', () => {
      state.tasks = state.tasks.filter(t => t.id !== task.id);
      state.taskSteps = state.taskSteps.filter(s => s.taskId !== task.id);
      modal.classList.add('hidden');
      commitState();
      showToast('課題を削除しました');
    });

    document.getElementById('btn-save-task-detail')?.addEventListener('click', () => {
      syncDraftInputs();
      if (task.deadlineDate) {
        const unscheduled = state.taskSteps.filter(s => s.taskId === task.id && !s.scheduledDate && !s.isCompleted);
        if (unscheduled.length > 0) {
          const allTaskSteps = state.taskSteps.filter(s => s.taskId === task.id);
          const scheduled = assignDatesForNewTaskSteps(allTaskSteps, task.deadlineDate, state, toDateStr());
          state.taskSteps = state.taskSteps.filter(s => s.taskId !== task.id).concat(scheduled);
        }
        if (task.status === 'inbox') task.status = 'planned';
      }
      modal.classList.add('hidden');
      commitState();
      showToast('課題とステップ計画を保存しました');
    });
  };

  renderModalContent();
  modal.classList.remove('hidden');
}

              <span class="subject-dot" style="background:${d.subjectColor}"></span>
              <span>${escapeHtml(d.subjectName)}・${escapeHtml(d.taskTitle)} (${d.minutes}分)</span>
            </div>
            <div style="font-weight:600;margin-top:0.1rem;">${escapeHtml(d.stepTitle)}</div>
          </div>
          <div class="diff-dates tabular-nums">
            <span class="diff-old">${escapeHtml(d.oldDateLabel)}</span>
            <span>→</span>
            <span class="diff-new">${escapeHtml(d.newDateLabel)}</span>
          </div>
        </div>
      `).join('')}
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.6rem;padding-top:0.75rem;border-top:1px solid var(--border-subtle);">
      <button type="button" class="btn-secondary" id="btn-cancel-replan">今は変更しない</button>
      <button type="button" class="btn-primary" id="btn-approve-replan">
        ${icon('check', 15)} <span>この内容で計画を更新する (${proposal.diffs.length}件)</span>
      </button>
    </div>
  `;

  modal.classList.remove('hidden');

  document.getElementById('btn-cancel-replan')?.addEventListener('click', () => {
    modal.classList.add('hidden');
  });

  document.getElementById('btn-approve-replan')?.addEventListener('click', () => {
    for (const diff of proposal.diffs) {
      const step = state.taskSteps.find(s => s.id === diff.stepId);
      if (step) {
        step.scheduledDate = diff.newDate;
      }
    }
    modal.classList.add('hidden');
    commitState();
    showToast(`${proposal.diffs.length}件のステップを新しい計画に更新しました`);
  });
}

function openSubjectModal(subjectId, presetWeekday = null, presetPeriod = null) {
  const existing = subjectId ? state.subjects.find(s => s.id === subjectId) : null;
  const modal = document.getElementById('modal-subject-edit');
  const titleEl = document.getElementById('title-subject-modal');
  const body = document.getElementById('modal-subject-body');
  if (!modal || !body) return;
  if (titleEl) titleEl.textContent = existing ? `科目設定・時間割・学習メモ (${existing.name})` : '新しい科目・時間割コマの追加';

  const colors = [
    'hsl(195, 82%, 35%)',
    'hsl(152, 65%, 34%)',
    'hsl(220, 72%, 46%)',
    'hsl(182, 76%, 33%)',
    'hsl(258, 62%, 50%)',
    'hsl(335, 72%, 46%)',
    'hsl(168, 70%, 34%)',
    'hsl(38, 86%, 44%)',
    'hsl(24, 84%, 46%)',
    'hsl(4, 74%, 50%)'
  ];

  const initDow = existing ? existing.defaultWeekday : (presetWeekday ?? 1);
  const initPeriod = existing ? (existing.periodSlot || '1-2') : (presetPeriod ?? '1-2');

  body.innerHTML = `
    <div class="form-grid">
      <div class="form-field">
        <label class="form-label">科目名</label>
        <input type="text" id="sub-edit-name" class="form-input" value="${escapeHtml(existing ? existing.name : '')}" placeholder="例: 電気回路Ⅰ" />
      </div>
      <div class="form-field">
        <label class="form-label">教室・場所</label>
        <input type="text" id="sub-edit-room" class="form-input" value="${escapeHtml(existing ? (existing.room || '') : '')}" placeholder="例: 工8-21" />
      </div>
      <div class="form-field">
        <label class="form-label">時間割の曜日</label>
        <select id="sub-edit-weekday" class="form-select">
          ${WEEKDAY_LABELS.map((w, idx) => `
            <option value="${idx}" ${initDow === idx ? 'selected' : ''}>${w}曜日</option>
          `).join('')}
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">時限コマ</label>
        <select id="sub-edit-period" class="form-select">
          <option value="" ${!initPeriod ? 'selected' : ''}>時間割枠なし</option>
          ${PERIOD_SLOTS.map(p => `
            <option value="${p.id}" ${initPeriod === p.id ? 'selected' : ''}>${escapeHtml(p.label)}</option>
          `).join('')}
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">自然文認識用の略称（カンマ区切り）</label>
        <input type="text" id="sub-edit-aliases" class="form-input" value="${escapeHtml(existing ? (existing.aliases || []).join(', ') : '')}" placeholder="例: 電気回路, 回路1" />
      </div>
      <div class="form-field">
        <label class="form-label">テーマカラー</label>
        <select id="sub-edit-color" class="form-select">
          ${colors.map(c => `
            <option value="${c}" ${(existing?.color === c) ? 'selected' : ''}>${c}</option>
          `).join('')}
        </select>
      </div>
      <div class="form-field full">
        <label class="form-label">予習・復習タスクの自動生成設定</label>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;background:var(--bg-surface-subtle);padding:0.6rem 0.75rem;border-radius:var(--radius-sm);">
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.8rem;cursor:pointer;">
            <input type="checkbox" id="sub-edit-autoprep" ${existing?.autoPrep ? 'checked' : ''} />
            <span>予習を自動生成（講義前日・推定 ${existing?.prepMinutes || 20}分）</span>
          </label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.8rem;cursor:pointer;">
            <input type="checkbox" id="sub-edit-autoreview" ${existing?.autoReview ? 'checked' : ''} />
            <span>復習を自動生成（講義当日〜翌日・推定 ${existing?.reviewMinutes || 20}分）</span>
          </label>
        </div>
      </div>
      <div class="form-field full">
        <label class="form-label">苦手分野・試験範囲メモ</label>
        <textarea id="sub-edit-weak" class="form-textarea" rows="2" placeholder="例: 複素インピーダンスのフェーザ図、過渡現象の微分方程式">${escapeHtml(existing ? existing.weakPointsNote : '')}</textarea>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:0.6rem;padding-top:0.75rem;border-top:1px solid var(--border-subtle);">
      ${existing ? `<button type="button" class="btn-danger-ghost" id="btn-delete-subject">${icon('trash', 14)} <span>この科目を削除</span></button>` : `<span></span>`}
      <button type="button" class="btn-primary" id="btn-save-subject">保存する</button>
    </div>
  `;

  modal.classList.remove('hidden');

  document.getElementById('btn-delete-subject')?.addEventListener('click', () => {
    if (!existing) return;
    state.subjects = state.subjects.filter(s => s.id !== existing.id);
    modal.classList.add('hidden');
    commitState();
    showToast(`科目「${existing.name}」を削除しました`);
  });

  document.getElementById('btn-save-subject')?.addEventListener('click', () => {
    const name = document.getElementById('sub-edit-name')?.value?.trim();
    if (!name) return;
    const room = document.getElementById('sub-edit-room')?.value?.trim() || '';
    const defaultWeekday = Number(document.getElementById('sub-edit-weekday')?.value) || 1;
    const periodSlot = document.getElementById('sub-edit-period')?.value || '';
    const rawAliases = document.getElementById('sub-edit-aliases')?.value || name;
    const aliases = Array.from(new Set([name, ...rawAliases.split(',').map(s => s.trim()).filter(Boolean)]));
    const color = document.getElementById('sub-edit-color')?.value || colors[0];
    const autoPrep = Boolean(document.getElementById('sub-edit-autoprep')?.checked);
    const autoReview = Boolean(document.getElementById('sub-edit-autoreview')?.checked);
    const weakPointsNote = document.getElementById('sub-edit-weak')?.value?.trim() || '';

    if (existing) {
      existing.name = name;
      existing.room = room;
      existing.defaultWeekday = defaultWeekday;
      existing.periodSlot = periodSlot;
      existing.aliases = aliases;
      existing.color = color;
      existing.autoPrep = autoPrep;
      existing.autoReview = autoReview;
      existing.weakPointsNote = weakPointsNote;
    } else {
      state.subjects.push({
        id: uid('sub'),
        name,
        aliases,
        color,
        defaultWeekday,
        periodSlot,
        room,
        autoPrep,
        autoReview,
        prepMinutes: 20,
        reviewMinutes: 20,
        syllabusNote: '',
        weakPointsNote,
        memoLogs: []
      });
    }

    syncTimetablePrepReviewTasks(state, toDateStr());
    modal.classList.add('hidden');
    commitState();
    showToast(`科目「${name}」を保存しました`);
  });
}

/* ==========================================================================
   Focus Timer Controller
   ========================================================================== */
function startFocusTimerForStep(stepId) {
  const step = state.taskSteps.find(s => s.id === stepId);
  if (!step) return;

  if (activeTimer.intervalId) {
    clearInterval(activeTimer.intervalId);
  }

  const mins = Number(step.estimatedMinutes) || 25;
  activeTimer = {
    stepId: step.id,
    taskId: step.taskId,
    title: step.title,
    remainingSeconds: mins * 60,
    elapsedSeconds: 0,
    isRunning: true,
    intervalId: setInterval(() => {
      if (!activeTimer.isRunning) return;
      activeTimer.elapsedSeconds += 1;
      if (activeTimer.remainingSeconds > 0) {
        activeTimer.remainingSeconds -= 1;
      }
      updateTimerFloatingBarUI();
    }, 1000)
  };

  updateTimerFloatingBarUI();
  document.getElementById('timer-floating-bar')?.classList.remove('hidden');
  showToast(`「${step.title}」の集中タイマーを開始しました`);
}

function toggleFocusTimer() {
  if (!activeTimer.stepId) return;
  activeTimer.isRunning = !activeTimer.isRunning;
  updateTimerFloatingBarUI();
}

function stopFocusTimer() {
  if (activeTimer.intervalId) {
    clearInterval(activeTimer.intervalId);
  }
  activeTimer = {
    stepId: null,
    taskId: null,
    title: '',
    remainingSeconds: 0,
    elapsedSeconds: 0,
    isRunning: false,
    intervalId: null
  };
  document.getElementById('timer-floating-bar')?.classList.add('hidden');
}

function updateTimerFloatingBarUI() {
  const titleEl = document.getElementById('timer-step-title');
  const clockEl = document.getElementById('timer-clock-display');
  const toggleBtn = document.getElementById('timer-toggle-btn');

  if (titleEl) titleEl.textContent = activeTimer.title;
  if (clockEl) {
    const m = String(Math.floor(activeTimer.remainingSeconds / 60)).padStart(2, '0');
    const s = String(activeTimer.remainingSeconds % 60).padStart(2, '0');
    clockEl.textContent = `${m}:${s}`;
  }
  if (toggleBtn) {
    toggleBtn.innerHTML = activeTimer.isRunning
      ? `${icon('pause', 13)} <span>一時停止</span>`
      : `${icon('play', 13)} <span>再開</span>`;
  }
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
